      function vConcLista(ids, porCli, cliDe) {
        if (!ids.length) return '<div class="card"><p class="sm">Nenhuma pendência concluída.</p></div>';
        const grupos = [...S.cat.sis.map((x) => [x.sigla, `${x.sigla} – ${x.nome}`]), ["", "Sem sistema definido"]];
        const plural = (n) => `${n} concluída${n > 1 ? "s" : ""}`;
        const linha = (p, c) => {
          const ex = ((c && c.eqs) || []).find((x) => x.id === p.eqId);
          return `<div class="li" style="cursor:default"><div class="t"><b>${esc(p.titulo || "(sem título)")}</b><span class="chip ok">${p.concluidaEm ? bd(p.concluidaEm) : "Concluída"}</span></div>
      <div class="sm">Aberta${p.criadaPorNome ? " por " + esc(p.criadaPorNome) : ""} em ${bd(p.criada)}${p.concluidaPorNome ? " · concluída por " + esc(p.concluidaPorNome) : ""}</div>
      ${p.solucao ? `<div class="sm" style="margin-top:4px">Solução: ${esc(p.solucao)}</div>` : ""}
      <button class="b o s" data-a="concAbre" data-id="${esc(p.clienteId)}">Abrir cliente</button></div>`;
        };
        return ids
          .map((id) => {
            const c = cliDe(id),
              L = porCli[id];
            const eqDe = (p) => ((c && c.eqs) || []).find((x) => x.id === p.eqId);
            const sisDe = (p) => {
              const e = eqDe(p);
              return (e ? tp(e.tipo).sis : p.tipoId ? tp(p.tipoId).sis : p.sis) || "";
            };
            const tipoDe = (p) => {
              const e = eqDe(p);
              return e ? e.tipo : p.tipoId || "";
            };
            const sis = grupos
              .map(([sigla, nome]) => {
                const g = L.filter((p) => sisDe(p) === sigla || (sigla === "" && !S.cat.sis.some((x) => x.sigla === sisDe(p))));
                if (!g.length) return "";
                const mapa = new Map();
                g.forEach((p) => {
                  const t = eqDe(p) ? "e:" + p.eqId : tipoDe(p) ? "t:" + tipoDe(p) : "";
                  if (!mapa.has(t)) mapa.set(t, []);
                  mapa.get(t).push(p);
                });
                const eqs = [...mapa.entries()]
                  .map(([t, l]) => {
                    l.sort((a, b) => String(b.concluidaEm || "").localeCompare(String(a.concluidaEm || "")));
                    if (!t) return l.map((p) => linha(p, c)).join("");
                    const k = `gq:${id}:${sigla}:${t}`;
                    const nome2 = t.startsWith("e:") ? nmEq(eqDe(l[0])) : tp(t.slice(2)).nome;
                    return `<details class="eq" data-k="${esc(k)}"${S.ab[k] ? " open" : ""}><summary class="sp"><b class="rd">${esc(nome2)}</b><span class="chip ok">${plural(l.length)}</span></summary><div style="margin-top:8px">${l.map((p) => linha(p, c)).join("")}</div></details>`;
                  })
                  .join("");
                const k = `gs:${id}:${sigla}`;
                return `<details class="eq" data-k="${esc(k)}"${S.ab[k] ? " open" : ""}><summary class="sp"><b class="rd">${esc(nome)}</b><span class="chip ok">${plural(g.length)}</span></summary><div style="margin-top:8px">${eqs}</div></details>`;
              })
              .join("");
            const k = `gc:${id}`;
            return `<div class="card"><details class="eq" data-k="${esc(k)}"${S.ab[k] ? " open" : ""}><summary class="sp"><b class="rd">${esc(cliNome(id))}</b><span class="chip ok">${plural(L.length)}</span></summary><div style="margin-top:8px">${sis}</div></details></div>`;
          })
          .join("");
      }

      function afterChange(p) {

        if (root === "visit") {
          const v = S.visit;
          if (!podeEditarVisita(v)) return;
          later("visit:" + v.id, () => gravar("visitas", v.id, v));
        } else if (root === "cli") {
          const c = S.cli;
          later("cli:" + c.id, () => gravar("clientes", c.id, c));
        } else if (root === "cat") {
          const c = S.cat;
          later("cat", () => gravar("catalogo", "dados", c));
        } else if (root === "cfg") {
          const c = S.cfg;
          later("cfg", () => gravar("config", "dados", c));
        } else if (root === "usuarios") {
          const u = S.usuarios[+p.split(".")[1]];
          later("us:" + u.uid, () => gravar("usuarios", u.uid, u));
        } else if (root === "eq") {
          const e = S.eq[+p.split(".")[1]];
          later("eq:" + e.id, () => gravar("equipes", e.id, e));
        } else if (root === "pc") {
          const o = S.pc[+p.split(".")[1]];
          later("pc:" + o.id, () => commitPend(o), 900);
        }

      const CAMPOS_PEND = [["titulo","Equipamento / assunto"],["tipoId","Tipo"],["eqId","Equipamento do cliente"],["problema","Problema reportado"],["diag","Diagnóstico"],["acoes","Ações executadas"],["solucao","Solução proposta"],["obs","Observação técnica"],["texto","Texto livre"],["status","Status"],["dispTag","Dispositivo do inventário"],["dispStatus","Situação do dispositivo"],["causa","Causa"],["problemaNome","Problema"]];
      const vTxt = (v) => (Array.isArray(v) ? v.join("; ") : v == null ? "" : String(v)).trim();
      // no histórico, tipo e equipamento aparecem pelo nome (não pelo código interno)
      const nomeTipo = (id) => {
        const t = id && ((S.cat && S.cat.tipos) || []).find((x) => x.id === id);
        return t ? `${t.sis} · ${t.nome}` : id || "";
      };
      const nomeEqId = (id) => {
        const e = id && [...((S.cli && S.cli.eqs) || []), ...((S.vcli && S.vcli.eqs) || [])].find((x) => x.id === id);
        return e ? nmEq(e) : id || "";

      const legHist = (c, v) => (c === "Tipo" ? nomeTipo(v) : c === "Equipamento do cliente" ? nomeEqId(v) : c === "Causa" && CAUSAS.some((x) => x.id === v) ? nomeCausa(v) : v);
      const difPend = (a, b) => {
        const r = [];
        CAMPOS_PEND.forEach(([k, n]) => {
          const f = k === "tipoId" ? nomeTipo : k === "eqId" ? nomeEqId : k === "causa" ? (z) => (z ? nomeCausa(z) : "") : (z) => z;
          const x = vTxt(f(a && a[k])), y = vTxt(f(b && b[k]));
          if (x !== y) r.push({ c: n, de: x.slice(0, 160), para: y.slice(0, 160) });
        });
        return r;
      };
      const baseP = (p) => { const o = {}; CAMPOS_PEND.forEach(([k]) => (o[k] = Array.isArray(p[k]) ? [...p[k]] : p[k])); return o; };
      const horaHM = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
      // salva as alterações de uma pendência (concluída ou não) e registra no histórico o que mudou
      function commitPend(p) {
        S.pcBase = S.pcBase || {};
        const dif = difPend(S.pcBase[p.id], p);
        if (dif.length) {
          p.historico = [...(p.historico || []), { data: hoje(), hora: horaHM(), ts: Date.now(), status: "Atualizada", por: S.me.nome, alt: dif }];
          S.pcBase[p.id] = baseP(p);

        gravar("pendencias", p.id, semTransitorios(p));
      }
      const dispDe = (it) => ({ dispId: it.dispId || "", dispSis: it.dispSis || "", dispTag: it.dispTag || "", dispIp: it.dispIp || "", dispPav: it.dispPav || "", dispStatus: it.dispStatus || "", causa: it.causa || "diag", problemaId: it.problemaId || "", problemaNome: it.problemaNome || "" });
      const pushHist = (p, e) => {
        p.historico = (p.historico || []).filter((h) => h.visitaId !== e.visitaId);
        p.historico.push(e);
      };

      async function encerrar() {
        if (!podeEditarVisita(S.visit)) return;
        flushAll();
        const v = S.visit,
          c = S.vcli,
          data = v.data;
        if (
          v.tipo === "preventiva" &&
          !Object.values(v.sis).some(Boolean) &&
          !confirm("Nenhum sistema foi selecionado. Gerar o relatório mesmo assim?")
        )
          return;
        if (
          v.tipo === "corretiva" &&
          !v.itens.some((i) => i.titulo || i.problema || i.diag || i.texto) &&
          !confirm("Nenhum atendimento foi preenchido. Gerar o relatório mesmo assim?")
        )
          return;
        {
          const falta = [];
          if (!String(v.tecnicos || "").trim()) falta.push("técnicos não informados");
          if (!v.ini || !v.fim) falta.push("horário de início ou fim vazio");
          if (v.tipo === "corretiva")
            v.itens.forEach((it, n) => {
              if ((it.titulo || it.problema || it.diag || it.texto) && !vTxt(it.acoes) && !vTxt(it.solucao)) falta.push("atendimento " + (n + 1) + (it.titulo ? " (" + it.titulo + ")" : "") + " sem ações nem solução");
            });
          if (falta.length && !confirm("Ainda falta:\n- " + falta.join("\n- ") + "\n\nGerar o relatório mesmo assim?")) return;
        }
        try {
          for (const p of v.pend) {
            // pendências já existentes (e novas digitadas na visita)
            if (!podeEditarPend(p)) {
              // pendência de outro técnico: ações, solução, observação e texto livre, sobre a versão atual do banco
              const cur = await DB.get("pendencias", p.id);
              if (!cur) continue;
              const antes = baseP(cur);
              ["acoes", "solucao", "obs", "texto"].forEach((k) => (cur[k] = p[k]));
              if (cur.dispId && p.dispStatus !== undefined) cur.dispStatus = p.dispStatus;
              ["causa", "problemaId", "problemaNome"].forEach((k) => p[k] !== undefined && (cur[k] = p[k]));
              const dif = difPend(antes, cur);
              if (p.concluir && cur.aberta) {
                cur.aberta = false;
                cur.concluidaEm = data;
                cur.concluidaPorId = S.user.uid;
                cur.concluidaPorNome = S.me.nome;
                pushHist(cur, { data, hora: horaHM(), ts: Date.now(), visitaId: v.id, status: "Concluída", por: S.me.nome, alt: dif });
              } else if (dif.length) pushHist(cur, { data, hora: horaHM(), ts: Date.now(), visitaId: v.id, status: "Atualizada", por: S.me.nome, alt: dif });
              gravar("pendencias", cur.id, cur);
              continue;
            }
            const cur0 = p.nova ? null : await DB.get("pendencias", p.id).catch(() => null);
            const dif0 = cur0 ? difPend(cur0, p) : [];
            p.clienteId = c.id;
            p.equipeId = c.equipeId;
            p.aberta = !p.concluir;
            if (p.concluir) {
              p.concluidaEm = data;
              p.concluidaPorId = S.user.uid;
              p.concluidaPorNome = S.me.nome;
            } else {
              delete p.concluidaEm;
              delete p.concluidaPorId;
              delete p.concluidaPorNome;
            }
            pushHist(p, { data, hora: horaHM(), ts: Date.now(), visitaId: v.id, status: p.concluir ? "Concluída" : p.nova ? "Aberta" : "Atualizada", por: S.me.nome, alt: dif0 });
            gravar("pendencias", p.id, semTransitorios(p));
          }
          for (const it of v.itens) {
            // corretivas não resolvidas viram pendência
            const old = it.pendId ? await DB.get("pendencias", it.pendId) : null;

                eqId: it.eqId || "",
                tipoId: eqIt ? eqIt.tipo : it.tipoId || "",
                sis: eqIt ? tp(eqIt.tipo).sis : it.tipoId ? tp(it.tipoId).sis : "",
                ...dispDe(it),
                titulo: it.titulo,
                problema: it.problema,
                diag: it.diag,
                acoes: it.acoes || [],
                solucao: it.solucao,
                obs: it.obs,
                texto: it.texto,
                status: it.status || "",
                aberta: true,
              });
              delete p.concluidaEm;
              pushHist(p, { data, visitaId: v.id, status: it.status || "" });
              gravar("pendencias", p.id, p);
            } else {
              // resolvida na própria visita: fica registrada como pendência concluída (aberta e concluída no mesmo dia)
              if (!old && !(it.titulo || it.problema || it.diag || it.texto || it.solucao)) continue;
              if (!it.pendId) it.pendId = uid();
              const eqIt = c.eqs.find((x) => x.id === it.eqId);
              const antes = old ? baseP(old) : null;
              const p = old || { id: it.pendId, clienteId: c.id, equipeId: c.equipeId, criadaPorId: S.user.uid, criadaPorNome: S.me.nome, criada: data, origemVisita: v.id, historico: [] };
              Object.assign(p, {
                eqId: it.eqId || "",
                tipoId: eqIt ? eqIt.tipo : it.tipoId || "",
                sis: eqIt ? tp(eqIt.tipo).sis : it.tipoId ? tp(it.tipoId).sis : "",
                ...dispDe(it),
                titulo: it.titulo, problema: it.problema, diag: it.diag, acoes: it.acoes || [], solucao: it.solucao, obs: it.obs, texto: it.texto,
                status: it.status || "Concluída",
                aberta: false, concluidaEm: data, concluidaPorId: S.user.uid, concluidaPorNome: S.me.nome,
              });
              if (!old) pushHist(p, { data, hora: horaHM(), ts: Date.now() - 1, visitaId: v.id + ":a", status: "Aberta", por: S.me.nome });

      function makeSnap(v, c) {
        const prev = v.tipo === "preventiva";
        const sistemas = prev
          ? S.cat.sis
              .filter((s) => v.sis[s.sigla])
              .map((s) => {
                const eqs = c.eqs.filter((e) => tp(e.tipo).sis === s.sigla);
                return {
                  sigla: s.sigla,
                  nome: s.nome,
                  previstos: eqs.filter((e) => !(v.ver[e.id] || {}).off).map(nmEq),
                  feitos: eqs
                    .filter((e) => !(v.ver[e.id] || {}).off)
                    .map((e) => {
                      const t = tp(e.tipo),
                        st = v.ver[e.id] || {};
                      return {
                        nome: nmEq(e),
                        atividades: atvDe(e).filter((a, k) => !(st.no || {})[k]),
                        dias: t.extra === "dias" ? st.dias || [] : [],
                        status: st.st || STATUS_EQ[0],
                      };
                    }),
                };
              })
          : [];
        return {
          tipo: v.tipo,
          data: v.data,
          hora: v.hora,
          numero: (v.numero || "").trim(),
          ini: v.ini,
          fim: v.fim,
          tecnicos: v.tecnicos,
          corr: v.corr,
          custo: v.custo,
          obs: v.obs,
          cab: {
            empresa: c.empresa,
            unidade: c.unidade,
            area: c.area,
            sisMan: c.sisMan,
            tipoOc: prev ? "PREVENTIVA" : "CORRETIVA",
            equipCab: c.equipCab,
            areaVisita: c.areaVisita || "Comum/Técnica",
            emitente: eqNome(v.equipeAutorId || c.equipeId),
            solic: eqNome(v.equipeAutorId || c.equipeId),
            exec: eqNome(v.equipeAutorId || c.equipeId),
          },
          sistemas,
          // pendência concluída nesta visita também entra nas ações corretivas, com a ressalva de quando/por quem foi aberta
          itens: [
            ...clone(v.itens),
            ...v.pend
              .filter((p) => p.concluir)
              .map((p) => ({
                ...clone(p),
                concluir: false,
                resolvido: true,
                status: "",
                ressalva: `Pendência aberta${p.criada ? " em " + bd(p.criada) : ""}${p.criadaPorNome ? " por " + p.criadaPorNome : ""}, concluída nesta visita (${bd(v.data)}).`,
              })),
          ],
          pend: clone(v.pend),
        };
      }

      async function backup() {
        try {
          const [clientes, visitas, pendencias] = await Promise.all([
            DB.list("clientes", filtro()),
            DB.list("visitas", filtro()),
            DB.list("pendencias", filtro()),
          ]);
          const blob = new Blob(
            [
              JSON.stringify(
                { gerado: new Date().toISOString(), equipes: S.eq, catalogo: S.cat, config: S.cfg, clientes, visitas, pendencias },
                null,
                1,
              ),
            ],
            { type: "application/json" },
          );
          baixar(blob, `backup_diario_${hoje()}.json`);
        } catch (e) {
          toast("Erro no backup: " + (e.code || e.message));
        }
      }
      function baixar(blob, nome) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = nome;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          URL.revokeObjectURL(a.href);
          a.remove();
        }, 1500);
      }

          S.catAberto = t.id;
          afterChange("cat.x");
          render();
        },
        delPerfil(el) {
          if (!pode("catalogo.excluir") || !confirm("Remover este perfil?")) return;
          S.catAberto = S.cat.tipos[+el.dataset.i].id;
          S.cat.tipos[+el.dataset.i].perfis.splice(+el.dataset.j, 1);
          afterChange("cat.x");
          render();
        },
        async delTipo(el) {
          if (!pode("catalogo.excluir")) return;
          const t = S.cat.tipos[+el.dataset.i];
          let todos = [];
          try {
            todos = await DB.list("clientes");
          } catch (e) {
            return toast("Não consegui conferir o uso: " + (e.code || e.message));
          }
          if (todos.some((c) => (c.eqs || []).some((e) => e.tipo === t.id)))
            return alert("Este tipo está em uso por algum cliente. Troque o tipo dos equipamentos antes de remover.");
          if (!confirm("Remover este tipo?")) return;
          (S.catDel = S.catDel || new Set()).add(t.id); // não deixa o tipo voltar ao juntar com o servidor
          S.cat.tipos.splice(+el.dataset.i, 1);
          afterChange("cat.x");
          render();
        },
        async delCli() {
          const c = S.cli;
          if (!c || !pode("cliente.editar")) return;
          if (!confirm(`Excluir o cliente "${c.unidade}"?\nAs visitas e as pendências dele também serão apagadas. Não dá para desfazer.`))
            return;
          if (!confirm("Confirma a exclusão definitiva deste cliente?")) return;
          try {
            const f = fCli(c);
            const [vs, ps] = await Promise.all([DB.list("visitas", f), DB.list("pendencias", f)]);
            [...vs.map((v) => "visit:" + v.id), ...ps.map((p) => "pc:" + p.id), "cli:" + c.id].forEach((k) => {
              clearTimeout(timers[k]);
              delete timers[k];
              delete fns[k];
            });
            await Promise.all([
              ...vs.map((v) => DB.del("visitas", v.id)),
              ...ps.map((p) => DB.del("pendencias", p.id)),
              DB.del("clientes", c.id),
            ]);
            S.clientes = S.clientes.filter((x) => x.id !== c.id);
            S.cli = null;
            S.hist = null;
            S.pc = null;
            toast("Cliente excluído");
            go("clientes");
          } catch (e) {
            console.error(e);
            toast("Erro ao excluir: " + (e.code || e.message));
          }
        },
        addEquipe() {
          const nome = (prompt("Nome da equipe (sai como emitente no relatório):", "") || "").trim();
          if (!nome) return;
          const e = { id: uid(), nome };
          S.eq.push(e);
          gravar("equipes", e.id, e);
          render();
        },
        async delEquipe(el) {
          const e = S.eq[+el.dataset.i];
          try {
            const [c, u] = await Promise.all([DB.list("clientes", { equipeId: e.id }), DB.list("usuarios", { equipeId: e.id })]);
            if (c.length || u.length)
              return alert(`Esta equipe não pode ser excluída: tem ${c.length} cliente(s) e ${u.length} usuário(s). Mude ou exclua antes.`);
            if (!confirm(`Excluir a equipe "${e.nome}"?`)) return;
            clearTimeout(timers["eq:" + e.id]);
            delete timers["eq:" + e.id];
            delete fns["eq:" + e.id];
            await DB.del("equipes", e.id);
            S.eq.splice(+el.dataset.i, 1);
            if (S.eqSel === e.id) S.eqSel = "";
            render();
          } catch (err) {
            console.error(err);
            toast("Erro: " + (err.code || err.message));
          }
        },
        async criarUser() {
          if (!pode("usuarios.gerir")) return;
          const n = S.nu,
            email = (n.email || "").trim(),
            nome = (n.nome || "").trim();
          if (!email || !nome) return toast("Preencha e-mail e nome.");
          const fracaN = validaSenha(n.senha);
          if (fracaN) return toast(fracaN);
          if (n.papel !== "admin" && !n.equipeId) return toast("Escolha a equipe do usuário.");
          try {
            const id = await DB.criaLogin(email, n.senha);
            await DB.set("usuarios", id, {
              uid: id,
              email,
              nome,
              papel: n.papel,
              equipeId: n.papel === "admin" ? "" : n.equipeId,
              ativo: true,
              trocarSenha: !!n.trocar, // se marcado, no primeiro acesso a pessoa precisa criar a própria senha
              criado: Date.now(),
            });
            S.nu = novoNU();
            await carregaUsuarios();
            toast("Usuário criado");
          } catch (e) {
            console.error(e);
            alert(
              e.code === "auth/invalid-credential"
                ? "Este e-mail já tem login no Firebase. Digite a senha atual dele para vincular, ou apague o login no Console do Firebase."
                : AUTH_ERR[e.code] || "Erro: " + (e.code || e.message),
            );
          }
        },
        async exigeTroca(el) {
          const u = S.usuarios[+el.dataset.i];
          if (!u || u.uid === S.me.uid || !pode("usuarios.gerir")) return;
          const liga = el.dataset.v0 !== "0";
          if (liga && !confirm(`Exigir que ${u.nome || u.email} crie uma nova senha no próximo acesso?`)) return;
          u.trocarSenha = liga;
          if (DB.audit) DB.audit(liga ? "exigiu troca de senha" : "cancelou exigência de troca de senha", "usuarios", u.uid, u.email);
          await gravar("usuarios", u.uid, u);
          toast(liga ? "Troca de senha exigida no próximo acesso" : "Exigência cancelada");
          render();
        },
        toggleUser(el) {
          const u = S.usuarios[+el.dataset.i];
          if (!u || u.uid === S.me.uid) return;
          if (u.ativo !== false && !confirm(`Desativar ${u.nome}? Ele não conseguirá mais usar o sistema.`)) return;
          u.ativo = u.ativo === false;
          gravar("usuarios", u.uid, u);
          render();
        },
        async delUser(el) {
          const u = S.usuarios[+el.dataset.i];
          if (!u || u.uid === S.me.uid || !pode("usuarios.gerir")) return;
          if (
            !confirm(
              `Remover ${u.nome} (${u.email}) do sistema?\nEle perde o acesso e some da lista. As visitas e pendências dele continuam com o nome dele.\nO login continua no Firebase: para apagá-lo, remova em Authentication > Users.`,
            )
          )
            return;
          try {
            clearTimeout(timers["us:" + u.uid]);
            delete timers["us:" + u.uid];
            delete fns["us:" + u.uid];
            await DB.del("usuarios", u.uid);
            S.usuarios.splice(+el.dataset.i, 1);
            render();
            toast("Usuário removido");
          } catch (e) {
            console.error(e);
            toast("Erro ao remover: " + (e.code || e.message));
          }
        },
        async exigeTodos() {
          if (!pode("usuarios.gerir")) return;
          const alvo = S.usuarios.filter((u) => u.uid !== S.me.uid && u.ativo !== false && u.trocarSenha !== true);
          if (!alvo.length) return toast("Todos já estão com a troca exigida (ou não há outros usuários).");
          if (!confirm(`Exigir nova senha de ${alvo.length} usuário(s) no próximo acesso?\nEles vão criar uma senha que siga a política (${SENHA_MIN}+ caracteres, maiúscula, minúscula, número e especial).`)) return;
          let n = 0;
          for (const u of alvo) {
            try {
              u.trocarSenha = true;
              await DB.set("usuarios", u.uid, u);
              n++;
            } catch (e) {
              console.error(e);
              u.trocarSenha = false;
            }
          }
          if (DB.audit) DB.audit("exigiu troca de senha de todos", "usuarios", "", n + " usuário(s)");
          toast(n + " usuário(s) vão criar nova senha no próximo acesso");
          render();
        },
        minhaSenha() {
          S.me.trocarSenha = true;
          S.trocaSenha = true;
          S.trocaVol = true;
          render();
        },
        cancelaTroca() {
          S.me.trocarSenha = false;
          S.trocaSenha = false;
          S.trocaVol = false;
          render();
        },
        async resetUser(el) {
          const u = S.usuarios[+el.dataset.i];
          try {
            await DB.authM.sendPasswordResetEmail(DB.auth, u.email);
            if (DB.audit) DB.audit("enviou e-mail de redefinição de senha", "usuarios", u.uid, u.email);
            toast("Enviei o e-mail de nova senha");
          } catch (e) {
            toast(AUTH_ERR[e.code] || "Erro: " + e.code);
          }
        },
        backup,
      };
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-a],[data-v]");
        if (!b) return;
        if (b.dataset.v) {
          flushAll();
          // Inventário é uma página à parte (inventario.html), como o simulado: abre na mesma aba, com a mesma sessão
          if (b.dataset.v === "inventario") return void (location.href = "inventario.html");
          const fechando = S.menuAb && !!b.closest("nav");
          S.menuAb = false;
          if (b.dataset.v === "catalogo") {
            S.catSis = "";
            S.catBusca = "";
            S.catAberto = "";
          }
          if (fechando) {
            const n = document.querySelector(".shell > nav"),
              m = document.querySelector(".mbk");
            if (n) n.classList.remove("open");
            if (m) m.classList.remove("on");
            const v = b.dataset.v;
            return void setTimeout(() => go(v), 230);
          }
          return go(b.dataset.v);
        }
        const f = A[b.dataset.a];
        if (f) f(b);
      });

      /* ==================================================================
   10. GERAÇÃO DO WORD (a partir da cópia congelada da visita)
   ================================================================== */
      async function gerarDocx(sn) {
        if (typeof docx === "undefined") return toast("Biblioteca do Word não carregou. Verifique a internet.");
        const d = docx,
          F = "Arial",
          W = 10000,
          DX = d.WidthType.DXA;
        const ln = { style: d.BorderStyle.SINGLE, size: 6, color: "000000" },
          bo = { top: ln, bottom: ln, left: ln, right: ln };
        const R = (t, o) => new d.TextRun({ text: t, font: F, size: 16, ...o }),
          B = (t) => R(t, { bold: true });
        const P = (ch, o) => new d.Paragraph({ spacing: { before: 40, after: 40 }, children: [].concat(ch), ...o });
        const sh = (f) => ({ type: d.ShadingType.CLEAR, fill: f, color: "auto" });
        const C = (ch, w, o = {}) =>
          new d.TableCell({
            borders: bo,
            width: { size: w, type: DX },
            margins: { top: 60, bottom: 60, left: 100, right: 100 },
            children: ch.length ? ch : [P(R(""))],
            ...o,
          });
        const Lb = (t, w) => C([P(B(t))], w, { shading: sh("EDEDED") });
        const TR = (x) => new d.TableRow({ children: x });
        const Tb = (r, cols) =>
          new d.Table({
            width: { size: W, type: DX },
            columnWidths: cols,
            layout: d.TableLayoutType.FIXED,
            alignment: d.AlignmentType.CENTER,
            indent: { size: 0, type: DX },
            rows: r,
          });
        const gap = () => P(R("", { size: 8 }), { spacing: { before: 0, after: 0 } });
        const box = (ch) => Tb([TR([C(ch, W)])], [W]);
        const sec = (t, ch) =>
          Tb([new d.TableRow({ cantSplit: true, children: [C([P(B(t))], W, { shading: sh("EDEDED") })] }), TR([C(ch, W)])], [W]);
        const lines = (t) =>
          (t || "")
            .split("\n")
            .map((s) => s.trim())
            .filter(Boolean)
            .map((l) => P(R(l)));
        const cab = sn.cab,
          prev = sn.tipo === "preventiva",
          HS = 12; // respostas do cabeçalho: 6 pt (tópicos e resto do documento: 8 pt)

        // ---- cabeçalho (Detectada e Prioridade ficam em branco, para preencher no Word)
        const L = [
          ["Empresa:", cab.empresa],
          ["Unidade de Man.:", cab.unidade],
          ["Área:", cab.area],
          ["Sistema de Man.:", cab.sisMan],
          ["Detectada:", null],
          ["Prioridade:", null],
        ];
        const Rr = [
          ["Tipo de Ocorrência:", cab.tipoOc],
          ["Equipamento:", cab.equipCab],
          ["Capacidade:", ""],
          ["Marca:", ""],
          ["Modelo:", ""],
          ["Data / Hora:", bd(sn.data) + "   " + sn.hora],
        ];
        const cl = [1800, 2800, 650, 2150, 2600];
        const head = Tb(
          L.map((l, i) =>
            TR([
              Lb(l[0], cl[0]),
              C([P(R(l[1] || "", { size: HS }))], cl[1]),
              ...(i === 0
                ? [
                    new d.TableCell({
                      borders: bo,
                      rowSpan: 6,
                      width: { size: cl[2], type: DX },
                      verticalAlign: d.VerticalAlign.CENTER,
                      textDirection: d.TextDirection.BOTTOM_TO_TOP_LEFT_TO_RIGHT,
                      children: [P([B("Nº: "), R(sn.numero || "", { size: 32 })], { alignment: d.AlignmentType.CENTER })],
                    }),
                  ]
                : []),
              Lb(Rr[i][0], cl[3]),
              C([P(R(Rr[i][1], { size: HS }))], cl[4]),
            ]),
          ),
          cl,
        );

        // ---- itens de corretiva / pendência
        const rot = (r, t) => (t ? P([B(r + ": "), R(t)]) : null);
        function itemParas(it, rotStatus) {
          const o = [],
            est = it.problema || it.diag || (it.acoes || []).length || it.solucao || it.obs;
          if (it.titulo) o.push(P(est ? [B("Equipamento: "), R(it.titulo)] : B(it.titulo), { spacing: { before: 140, after: 40 } }));
          o.push(rot("Problema Reportado", it.problema), rot("Diagnóstico", it.diag));
          if ((it.acoes || []).length) {
            o.push(P(B("Ações Corretivas Executadas:")));
            it.acoes.forEach((a, k) => o.push(P(R(`${roman(k + 1)}.  ${a}`), { indent: { left: 500 } })));
          }
          o.push(rot("Solução proposta", it.solucao), rot("Observação técnica", it.obs));
          o.push(...lines(it.texto));
          if (it.ressalva) o.push(P(R("Ressalva: " + it.ressalva, { italics: true })));
          if (it.status) o.push(P(B(rotStatus + ": " + it.status)));
          return o.filter(Boolean);
        }
        const itens = sn.itens.filter((i) => i.titulo || i.problema || i.diag || i.texto || (i.acoes || []).length || i.solucao || i.obs);
        const pe = [];
        sn.pend
          .filter((p) => p.titulo || p.problema || p.diag || p.texto || (p.acoes || []).length || p.solucao || p.obs)
          .forEach((p) => pe.push(...itemParas({ ...p, status: p.concluir ? "Concluída em " + bd(sn.data) : p.status }, "Status")));

        // ---- início e final da visita
        const ini = [P(B("Início da Visita Técnica")), P([B("Técnicos: "), R(sn.tecnicos)]), P([B("Área: "), R(cab.areaVisita)])];
        const fin = [P(B("Final da Visita Técnica")), P([B("Técnicos: "), R(sn.tecnicos)])];
        if (prev) {
          ini.push(
            P(R("Estão previstas as realizações das seguintes atividades preventivas:", { bold: true, underline: {} }), {
              spacing: { before: 160, after: 80 },
            }),
          );
          sn.sistemas.filter((s) => s.previstos.length).forEach((s, n) => {
            ini.push(P(B(`${n + 1}.  ${s.sigla} (${s.nome})`), { indent: { left: 400 }, spacing: { before: 120, after: 40 } }));
            s.previstos.forEach((t) => ini.push(P(R("•   " + t), { indent: { left: 800 } })));
          });
          fin.push(
            P(R("Preventiva – Área: " + cab.areaVisita + "   Ações realizadas:", { bold: true, underline: {} }), {
              spacing: { before: 160, after: 80 },
            }),
          );
          sn.sistemas.forEach((s) => {
            if (!s.feitos.length) return;
            fin.push(P(B(`${s.sigla} (${s.nome})`), { spacing: { before: 160, after: 40 } }));
            s.feitos.forEach((e, n) => {
              fin.push(P(B(`${n + 1}.  ${e.nome}`), { indent: { left: 400 }, spacing: { before: 100, after: 40 } }));
              if (e.atividades.length) {
                fin.push(P(R("Atividades realizadas:"), { indent: { left: 800 } }));
                e.atividades.forEach((a, k) => {
                  fin.push(P(R(`${roman(k + 1)}.  ${a}`), { indent: { left: 1200 } }));
                  if (k === 0) e.dias.forEach((x) => fin.push(P(R("•   " + x), { indent: { left: 1700 } })));
                });
              }
              fin.push(P(B("Status: " + e.status), { indent: { left: 800 } }));
            });
          });
        } else {
          ini.push(P(R("Atendimento corretivo solicitado:", { bold: true, underline: {} }), { spacing: { before: 160, after: 80 } }));
          itens.forEach((i) => ini.push(P(R("•   " + [i.titulo, i.problema].filter(Boolean).join(": ")), { indent: { left: 400 } })));
          fin.push(
            P(R("Corretiva – Área: " + cab.areaVisita + "   Ações realizadas:", { bold: true, underline: {} }), {
              spacing: { before: 160, after: 80 },
            }),
          );
          itens.forEach((i) => fin.push(...itemParas(i, "Status Final")));
        }

        // ---- rodapé do relatório
        const mi = (s) => {
            const [h, m] = (s || "").split(":");
            return +h * 60 + +m;
          },
          tt = mi(sn.fim) - mi(sn.ini);
        const tot = isNaN(tt) || tt < 0 ? "" : pad(Math.floor(tt / 60)) + ":" + pad(tt % 60),
          fc = [1700, 3402, 1300, 1700, 1898];
        const foot = Tb(
          [
            TR([
              Lb("Solicitado por:", fc[0]),
              C([P(R(cab.solic))], fc[1]),
              Lb("INÍCIO", fc[2]),
              Lb("Data: " + bd(sn.data), fc[3]),
              C([P(R("Hora: " + sn.ini))], fc[4]),
            ]),
            TR([
              Lb("Executado por:", fc[0]),
              C([P(R(cab.exec))], fc[1]),
              Lb("TÉRMINO", fc[2]),
              Lb("Data: " + bd(sn.data), fc[3]),
              C([P(R("Hora: " + sn.fim))], fc[4]),
            ]),
            TR([
              Lb("Custo:", fc[0]),
              C([P(R("R$ " + (sn.custo || "")))], fc[1]),
              new d.TableCell({
                borders: bo,
                columnSpan: 3,
                width: { size: fc[2] + fc[3] + fc[4], type: DX },
                margins: { top: 60, bottom: 60, left: 100, right: 100 },
                children: [P(B("Tempo Total Trabalhado (Horas:Minutos): " + tot))],
              }),
            ]),
          ],
          fc,
        );

        let headers;
        try {
          const r = await fetch("logo.png");
          if (r.ok)
            headers = {
              default: new d.Header({
                children: [
                  P(
                    new d.ImageRun({
                      type: "png",
                      data: new Uint8Array(await r.arrayBuffer()),
                      transformation: { width: 220, height: 30 },
                    }),
                    { spacing: { after: 0 } },
                  ),
                ],
              }),
            };
        } catch (e) {}
        const corpo = [
          head,
          gap(),
          Tb([TR([Lb("OCORRÊNCIA", 1800), C([P(B("EMITENTE: " + cab.emitente))], W - 1800)])], [1800, W - 1800]),
          box(ini),
          gap(),
          Tb(
            [TR([Lb("CORREÇÃO", 1800), C([P(R(CORRECOES.map((x) => (x === sn.corr ? "(x) " : "( ) ") + x).join("        ")))], W - 1800)])],
            [1800, W - 1800],
          ),
          box(fin),
          gap(),
        ];
        if (prev)
          corpo.push(
            sec(
              "Corretivas técnicas:",
              itens.flatMap((i) => itemParas(i, "Status Final")),
            ),
            gap(),
          );
        corpo.push(sec("Pendências:", pe), gap());
        if (sn.obs) corpo.push(sec("Observação Técnica:", lines(sn.obs)), gap());
        corpo.push(foot);

        const doc = new d.Document({
          creator: "Controller BMS",
          title: "Relatório de Visita Técnica",
          styles: { default: { document: { run: { font: F, size: 16 } } } },
          sections: [
            {
              properties: {
                page: { size: { width: 11906, height: 16838 }, margin: { top: 1134, bottom: 851, left: 851, right: 851, header: 454 } },
              },
              headers,
              footers: {
                default: new d.Footer({
                  children: [
                    P(
                      [
                        R("Página ", { size: 16 }),
                        new d.TextRun({ children: [d.PageNumber.CURRENT], font: F, size: 16 }),
                        R(" de ", { size: 16 }),
                        new d.TextRun({ children: [d.PageNumber.TOTAL_PAGES], font: F, size: 16 }),
                      ],
                      { alignment: d.AlignmentType.RIGHT },
                    ),
                  ],
                }),
              },
              children: corpo,
            },
          ],
        });
        const nome = cab.unidade
          .normalize("NFD")
          .replace(/[̀-ͯ]/g, "")
          .replace(/[^\w]+/g, "_")
          .replace(/^_|_$/g, "");
        baixar(await d.Packer.toBlob(doc), `${nome}_Visita_Tecnica${prev ? "" : "_Corretiva"}_${bd(sn.data).replace(/\//g, "_")}.docx`);
      }

      boot();

      // Corretor ortográfico (pt-BR) em todos os campos de texto, inclusive os criados depois
      (function () {
        const sel = 'textarea, input:not([type]), input[type="text"], input[type="search"]';
        const aplica = (root) =>
          (root.querySelectorAll ? root.querySelectorAll(sel) : []).forEach((el) => {
            el.setAttribute("spellcheck", "true");
            el.setAttribute("lang", "pt-BR");
            el.setAttribute("autocorrect", "on");
            if (!el.hasAttribute("autocapitalize")) el.setAttribute("autocapitalize", "sentences");
          });
        aplica(document);
        new MutationObserver((m) =>
          m.forEach((x) =>
            x.addedNodes.forEach((n) => {
              if (n.nodeType === 1) {
                if (n.matches && n.matches(sel)) aplica({ querySelectorAll: () => [n] });
                aplica(n);
              }
            }),
          ),
        ).observe(document.body, { childList: true, subtree: true });
      })();
