      function logoDados() {
        return new Promise((ok) => {
          const i = new Image();
          i.onload = () => {
            const c = document.createElement("canvas");
            c.width = i.naturalWidth;
            c.height = i.naturalHeight;
            c.getContext("2d").drawImage(i, 0, 0);
            ok({ url: c.toDataURL("image/png"), w: i.naturalWidth, h: i.naturalHeight });
          };
          i.onerror = () => ok(null);
          i.src = "logo.png";
        });
      }
      async function relPdf() {
        try {
          await lib("jspdf");
          await lib("autotable");
          const L = relLinhas(),
            F = relFiltrosTxt(),
            doc = new window.jspdf.jsPDF({ orientation: "landscape", unit: "mm", format: "a4" }),
            W = doc.internal.pageSize.getWidth(),
            H = doc.internal.pageSize.getHeight(),
            M = 12;
          const logo = await logoDados();
          let y = M;
          if (logo) {
            const w = 62,
              h = (w * logo.h) / logo.w;
            doc.addImage(logo.url, "PNG", M, y, w, h);
            y += h + 5;
          }
          doc.setFontSize(15);
          doc.setFont("helvetica", "bold");
          doc.text("Relatório de visitas e pendências", M, y + 4);
          y += 10;
          doc.setFontSize(9.5);
          doc.setFont("helvetica", "normal");
          const linhas = [
            `Equipe: ${relEquipeTxt()}   ·   Gerado em ${agoraTxt()} por ${S.me.nome}`,
            F.visitas,
            F.pend,
            `Visitas: ${L.T.nv} (${L.T.prev} preventiva(s), ${L.T.corr} corretiva(s), ${L.T.enc} encerrada(s))   ·   Pendências: ${L.T.np} (${L.T.ab} em aberto, ${L.T.co} concluída(s)${L.T.media !== null ? ", média de " + String(L.T.media).replace(".", ",") + " dia(s) até concluir" : ""})`,
          ];
          linhas.forEach((t) => {
            const q = doc.splitTextToSize(t, W - 2 * M);
            doc.text(q, M, y);
            y += q.length * 4.4;
          });
          y += 2;
          const head = (c) => [c],
            estilo = { fontSize: 8, cellPadding: 1.6, overflow: "linebreak" },
            cab = { fillColor: [200, 30, 44], textColor: 255 };
          const dd = (x) => (x ? bd(x) : "");
          doc.setFont("helvetica", "bold");
          doc.setFontSize(11);
          doc.text(`Visitas (${L.visitas.length})`, M, y + 3);
          doc.autoTable({
            startY: y + 5,
            margin: { left: M, right: M, top: M, bottom: 14 },
            styles: estilo,
            headStyles: cab,
            head: head(["Data", "Cliente", "Equipe", "Tipo", "Situação", "Técnico", "Criada em", "Encerrada em", "Exceção"]),
            body: L.visitas.length
              ? L.visitas.map((v) => [dd(v.data), v.cliente, v.equipe, v.tipo, v.sit, v.tec, dd(v.criada), dd(v.enc), v.exc])
              : [["Nenhuma visita com esses filtros.", "", "", "", "", "", "", "", ""]],
          });
          let y2 = doc.lastAutoTable.finalY + 8;
          if (y2 > H - 40) {
            doc.addPage();
            y2 = M;
          }
          doc.setFont("helvetica", "bold");
          doc.setFontSize(11);
          doc.text(`Pendências (${L.pend.length})`, M, y2 + 3);
          doc.autoTable({
            startY: y2 + 5,
            margin: { left: M, right: M, top: M, bottom: 14 },
            styles: estilo,
            headStyles: cab,
            head: head(["Cliente", "Sistema / equipamento", "Título", "Status", "Situação", "Aberta por", "Criada em", "Concluída em", "Concluída por", "Dias"]),
            body: L.pend.length
              ? L.pend.map((p) => [
                  p.cliente,
                  [p.sis, p.eqp].filter(Boolean).join(" · "),
                  p.titulo,
                  p.status,
                  p.sit,
                  p.por,
                  dd(p.criada),
                  dd(p.conc),
                  p.concPor,
                  p.dias === "" ? "" : String(p.dias),
                ])
              : [["Nenhuma pendência com esses filtros.", "", "", "", "", "", "", "", "", ""]],
          });
          const n = doc.getNumberOfPages();
          for (let i = 1; i <= n; i++) {
            doc.setPage(i);
            doc.setFontSize(8);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(120);
            doc.text(`Controller BMS · ${relEquipeTxt()}`, M, H - 6);
            doc.text(`Página ${i} de ${n}`, W - M, H - 6, { align: "right" });
          }
          baixar(doc.output("blob"), `relatorio_${hoje()}.pdf`);
          toast("PDF gerado");
        } catch (e) {
          console.error(e);
          toast("Erro ao gerar o PDF: " + (e.message || e.code));
        }
      }

      const SIM_PARTE = 700000,
        SIM_MAX = 15 * 1024 * 1024;
      const simB64 = (bytes) => {
        let t = "";
        for (let i = 0; i < bytes.length; i += 0x8000) t += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        return btoa(t);
      };
      const simDeB64 = (b) => {
        const t = atob(b),
          u = new Uint8Array(t.length);
        for (let i = 0; i < t.length; i++) u[i] = t.charCodeAt(i);
        return u;
      };

      async function simEnvia(file) {
        const U = S.simUp;
        if (!pode("simulados")) return;
        if (!file) return;
        const c = S.clientes.find((x) => x.id === U.cliId);
        if (!c) return toast("Escolha o cliente primeiro.");
        if (!U.data) return toast("Informe a data do simulado.");
        const ext = (file.name.split(".").pop() || "").toLowerCase();
        if (!SIM_MIME[ext]) return toast("Envie um arquivo Word (.docx) ou PDF.");
        if (file.size > SIM_MAX) return toast("Arquivo muito grande (máximo 15 MB).");
        if (DB.mode === "firebase" && navigator.onLine === false) return toast("Sem conexão. Envie quando tiver internet.");
        if (S.simOcup && /Enviando/.test(S.simOcup)) return;
        const id = uid();
        let N = 0;
        try {
          const b64 = simB64(new Uint8Array(await file.arrayBuffer()));
          N = Math.ceil(b64.length / SIM_PARTE);
          for (let i = 0; i < N; i++) {
            simMsg(`Enviando… parte ${i + 1} de ${N}. Não feche a página.`);
            await DB.set(SIMARQ, `${id}_${i}`, { id: `${id}_${i}`, simId: id, equipeId: c.equipeId || "", parte: i, b64: b64.slice(i * SIM_PARTE, (i + 1) * SIM_PARTE) });
          }
          await DB.set("simulados", id, {
            id,
            clienteId: c.id,
            clienteNome: c.unidade,
            equipeId: c.equipeId || "",
            data: U.data,
            mp: U.mp.trim(),
            arquivo: file.name,
            ext,
            partes: N,
            tam: file.size,
            enviadoPorId: S.user.uid,
            enviadoPorNome: meuNome(),
            criadoEm: Date.now(),
          });
          S.simUp = { cliId: "", data: "", mp: "" };
          simMsg("");
          toast("Simulado guardado");
          render();
        } catch (e) {
          console.error(e);
          for (let i = 0; i < N; i++) DB.del(SIMARQ, `${id}_${i}`).catch(() => {});
          simMsg("");
          toast("Não consegui enviar: " + (e.code || e.message));
        }
      }

      function vConcLista(ids, porCli, cliDe) {
        if (!ids.length) return '<div class="card"><p class="sm">Nenhuma pendência concluída.</p></div>';
        const grupos = [...S.cat.sis.map((x) => [x.sigla, `${x.sigla} – ${x.nome}`]), ["", "Sem sistema definido"]];
        const plural = (n) => `${n} concluída${n > 1 ? "s" : ""}`;
        const linha = (p, c) => {
          const ex = ((c && c.eqs) || []).find((x) => x.id === p.eqId);
          return `<div class="li" style="cursor:default"><div class="t"><b>${esc(p.titulo || "(sem título)")}</b><span class="chip ok">${p.concluidaEm ? bd(p.concluidaEm) : "Concluída"}</span></div>
      <div class="sm">Aberta${p.criadaPorNome ? " por " + esc(p.criadaPorNome) : ""} em ${bd(p.criada)}${p.concluidaPorNome ? " · concluída por " + esc(p.concluidaPorNome) : ""}</div>
      ${p.solucao ? `<div class="sm" style="margin-top:4px">Solução: ${esc(p.solucao)}</div>` : ""}
      <button class="b o s" data-a="concAbre" data-id="${esc(p.clienteId)}">Abrir cliente</button></div>`;
        };
        return ids
          .map((id) => {
            const c = cliDe(id),
              L = porCli[id];
            const eqDe = (p) => ((c && c.eqs) || []).find((x) => x.id === p.eqId);
            const sisDe = (p) => {
              const e = eqDe(p);
              return (e ? tp(e.tipo).sis : p.tipoId ? tp(p.tipoId).sis : p.sis) || "";
            };
            const tipoDe = (p) => {
              const e = eqDe(p);
              return e ? e.tipo : p.tipoId || "";
            };
            const sis = grupos
              .map(([sigla, nome]) => {
                const g = L.filter((p) => sisDe(p) === sigla || (sigla === "" && !S.cat.sis.some((x) => x.sigla === sisDe(p))));
                if (!g.length) return "";
                const mapa = new Map();
                g.forEach((p) => {
                  const t = eqDe(p) ? "e:" + p.eqId : tipoDe(p) ? "t:" + tipoDe(p) : "";
                  if (!mapa.has(t)) mapa.set(t, []);
                  mapa.get(t).push(p);
                });
                const eqs = [...mapa.entries()]
                  .map(([t, l]) => {
                    l.sort((a, b) => String(b.concluidaEm || "").localeCompare(String(a.concluidaEm || "")));
                    if (!t) return l.map((p) => linha(p, c)).join("");
                    const k = `gq:${id}:${sigla}:${t}`;
                    const nome2 = t.startsWith("e:") ? nmEq(eqDe(l[0])) : tp(t.slice(2)).nome;
                    return `<details class="eq" data-k="${esc(k)}"${S.ab[k] ? " open" : ""}><summary class="sp"><b class="rd">${esc(nome2)}</b><span class="chip ok">${plural(l.length)}</span></summary><div style="margin-top:8px">${l.map((p) => linha(p, c)).join("")}</div></details>`;
                  })
                  .join("");
                const k = `gs:${id}:${sigla}`;
                return `<details class="eq" data-k="${esc(k)}"${S.ab[k] ? " open" : ""}><summary class="sp"><b class="rd">${esc(nome)}</b><span class="chip ok">${plural(g.length)}</span></summary><div style="margin-top:8px">${eqs}</div></details>`;
              })
              .join("");
            const k = `gc:${id}`;
            return `<div class="card"><details class="eq" data-k="${esc(k)}"${S.ab[k] ? " open" : ""}><summary class="sp"><b class="rd">${esc(cliNome(id))}</b><span class="chip ok">${plural(L.length)}</span></summary><div style="margin-top:8px">${sis}</div></details></div>`;
          })
          .join("");
      }

      function afterChange(p) {
        const root = p.split(".")[0];
        if (root === "visit") {
          const v = S.visit;
          if (!podeEditarVisita(v)) return;
          later("visit:" + v.id, () => gravar("visitas", v.id, v));
        } else if (root === "sd") {
          const e = S.sd;
          if (!sdEditavel()) return;
          later("sd:" + e.id, () => gravar("sdaiEnsaios", e.id, sdDoc(e)));
        } else if (root === "cli") {
          const c = S.cli;
          later("cli:" + c.id, () => gravar("clientes", c.id, c));
        } else if (root === "cat") {
          const c = S.cat;
          later("cat", () => gravar("catalogo", "dados", c));
        } else if (root === "cfg") {
          const c = S.cfg;
          later("cfg", () => gravar("config", "dados", c));
        } else if (root === "usuarios") {
          const u = S.usuarios[+p.split(".")[1]];
          later("us:" + u.uid, () => gravar("usuarios", u.uid, u));
        } else if (root === "eq") {
          const e = S.eq[+p.split(".")[1]];
          later("eq:" + e.id, () => gravar("equipes", e.id, e));
        } else if (root === "pc") {
          const o = S.pc[+p.split(".")[1]];
          later("pc:" + o.id, () => commitPend(o), 900);
        }
      }

      const CAMPOS_PEND = [["titulo","Equipamento / assunto"],["tipoId","Tipo"],["eqId","Equipamento do cliente"],["problema","Problema reportado"],["diag","Diagnóstico"],["acoes","Ações executadas"],["solucao","Solução proposta"],["obs","Observação técnica"],["texto","Texto livre"],["status","Status"]];
      const vTxt = (v) => (Array.isArray(v) ? v.join("; ") : v == null ? "" : String(v)).trim();
      const difPend = (a, b) => {
        const r = [];
        CAMPOS_PEND.forEach(([k, n]) => {
          const x = vTxt(a && a[k]), y = vTxt(b && b[k]);
          if (x !== y) r.push({ c: n, de: x.slice(0, 160), para: y.slice(0, 160) });
        });
        return r;
      };
      const baseP = (p) => { const o = {}; CAMPOS_PEND.forEach(([k]) => (o[k] = Array.isArray(p[k]) ? [...p[k]] : p[k])); return o; };
      const horaHM = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
      // salva as alterações de uma pendência (concluída ou não) e registra no histórico o que mudou
      function commitPend(p) {
        S.pcBase = S.pcBase || {};
        const dif = difPend(S.pcBase[p.id], p);
        if (dif.length) {
          p.historico = [...(p.historico || []), { data: hoje(), hora: horaHM(), ts: Date.now(), status: "Atualizada", por: S.me.nome, alt: dif }];
          S.pcBase[p.id] = baseP(p);
        }
        gravar("pendencias", p.id, semTransitorios(p));
      }
      const pushHist = (p, e) => {
        p.historico = (p.historico || []).filter((h) => h.visitaId !== e.visitaId);
        p.historico.push(e);
      };

      async function encerrar() {
        if (!podeEditarVisita(S.visit)) return;
        flushAll();
        const v = S.visit,
          c = S.vcli,
          data = v.data;
        if (
          v.tipo === "preventiva" &&
          !Object.values(v.sis).some(Boolean) &&
          !confirm("Nenhum sistema foi selecionado. Gerar o relatório mesmo assim?")
        )
          return;
        if (
          v.tipo === "corretiva" &&
          !v.itens.some((i) => i.titulo || i.problema || i.diag || i.texto) &&
          !confirm("Nenhum atendimento foi preenchido. Gerar o relatório mesmo assim?")
        )
          return;
        {
          const falta = [];
          if (!String(v.tecnicos || "").trim()) falta.push("técnicos não informados");
          if (!v.ini || !v.fim) falta.push("horário de início ou fim vazio");
          if (v.tipo === "corretiva")
            v.itens.forEach((it, n) => {
              if ((it.titulo || it.problema || it.diag || it.texto) && !vTxt(it.acoes) && !vTxt(it.solucao)) falta.push("atendimento " + (n + 1) + (it.titulo ? " (" + it.titulo + ")" : "") + " sem ações nem solução");
            });
          if (falta.length && !confirm("Ainda falta:\n- " + falta.join("\n- ") + "\n\nGerar o relatório mesmo assim?")) return;
        }
        try {
          for (const p of v.pend) {
            // pendências já existentes (e novas digitadas na visita)
            if (!podeEditarPend(p)) {
              // pendência de outro técnico: ações, solução, observação e texto livre, sobre a versão atual do banco
              const cur = await DB.get("pendencias", p.id);
              if (!cur) continue;
              const antes = baseP(cur);
              ["acoes", "solucao", "obs", "texto"].forEach((k) => (cur[k] = p[k]));
              const dif = difPend(antes, cur);
              if (p.concluir && cur.aberta) {
                cur.aberta = false;
                cur.concluidaEm = data;
                cur.concluidaPorId = S.user.uid;
                cur.concluidaPorNome = S.me.nome;
                pushHist(cur, { data, hora: horaHM(), ts: Date.now(), visitaId: v.id, status: "Concluída", por: S.me.nome, alt: dif });
              } else if (dif.length) pushHist(cur, { data, hora: horaHM(), ts: Date.now(), visitaId: v.id, status: "Atualizada", por: S.me.nome, alt: dif });
              gravar("pendencias", cur.id, cur);
              continue;
            }
            const cur0 = p.nova ? null : await DB.get("pendencias", p.id).catch(() => null);
            const dif0 = cur0 ? difPend(cur0, p) : [];
            p.clienteId = c.id;
            p.equipeId = c.equipeId;
            p.aberta = !p.concluir;
            if (p.concluir) {
              p.concluidaEm = data;
              p.concluidaPorId = S.user.uid;
              p.concluidaPorNome = S.me.nome;
            } else {
              delete p.concluidaEm;
              delete p.concluidaPorId;
              delete p.concluidaPorNome;
            }
            pushHist(p, { data, hora: horaHM(), ts: Date.now(), visitaId: v.id, status: p.concluir ? "Concluída" : p.nova ? "Aberta" : "Atualizada", por: S.me.nome, alt: dif0 });
            gravar("pendencias", p.id, semTransitorios(p));
          }
          for (const it of v.itens) {
            // corretivas não resolvidas viram pendência
            const old = it.pendId ? await DB.get("pendencias", it.pendId) : null;
            if (!it.resolvido) {
              if (!it.pendId) it.pendId = uid();
              const p = old || {
                id: it.pendId,
                clienteId: c.id,
                equipeId: c.equipeId,
                criadaPorId: S.user.uid,
                criadaPorNome: S.me.nome,
                criada: data,
                origemVisita: v.id,
                historico: [],
              };
              const eqIt = c.eqs.find((x) => x.id === it.eqId);
              Object.assign(p, {
                eqId: it.eqId || "",
                tipoId: eqIt ? eqIt.tipo : it.tipoId || "",
                sis: eqIt ? tp(eqIt.tipo).sis : it.tipoId ? tp(it.tipoId).sis : "",
                titulo: it.titulo,
                problema: it.problema,
                diag: it.diag,
                acoes: it.acoes || [],
                solucao: it.solucao,
                obs: it.obs,
                texto: it.texto,
                status: it.status || "",
                aberta: true,
              });
              delete p.concluidaEm;
              pushHist(p, { data, visitaId: v.id, status: it.status || "" });
              gravar("pendencias", p.id, p);
            } else {
              // resolvida na própria visita: fica registrada como pendência concluída (aberta e concluída no mesmo dia)
              if (!old && !(it.titulo || it.problema || it.diag || it.texto || it.solucao)) continue;
              if (!it.pendId) it.pendId = uid();
              const eqIt = c.eqs.find((x) => x.id === it.eqId);
              const antes = old ? baseP(old) : null;
              const p = old || { id: it.pendId, clienteId: c.id, equipeId: c.equipeId, criadaPorId: S.user.uid, criadaPorNome: S.me.nome, criada: data, origemVisita: v.id, historico: [] };
              Object.assign(p, {
                eqId: it.eqId || "",
                tipoId: eqIt ? eqIt.tipo : it.tipoId || "",
                sis: eqIt ? tp(eqIt.tipo).sis : it.tipoId ? tp(it.tipoId).sis : "",
                titulo: it.titulo, problema: it.problema, diag: it.diag, acoes: it.acoes || [], solucao: it.solucao, obs: it.obs, texto: it.texto,
                status: it.status || "Concluída",
                aberta: false, concluidaEm: data, concluidaPorId: S.user.uid, concluidaPorNome: S.me.nome,
              });
              if (!old) pushHist(p, { data, hora: horaHM(), ts: Date.now() - 1, visitaId: v.id + ":a", status: "Aberta", por: S.me.nome });
              pushHist(p, { data, hora: horaHM(), ts: Date.now(), visitaId: v.id, status: "Concluída", por: S.me.nome, alt: old ? difPend(antes, p) : [] });
              gravar("pendencias", p.id, p);
            }
          }
          v.snap = makeSnap(v, c);
          v.status = "encerrada";
          v.encerradaEm = Date.now();
          v.clienteNome = c.unidade;
          gravar("visitas", v.id, v);
          const cf = await DB.get("clientes", c.id);
          if (cf && (!cf.ultimaVisita || cf.ultimaVisita < data)) {
            cf.ultimaVisita = data;
            if (v.tipo === "preventiva") cf.ultimaVisitaDados = { sis: clone(v.sis || {}), ini: v.ini || "", fim: v.fim || "", hora: v.hora || "" };
            gravar("clientes", c.id, cf);
          }
          await gerarDocx(v.snap);
          toast("Relatório gerado");
          render();
          if (v.excecao && v.autorizacaoId) {
            // termina o acesso temporário depois que tudo foi gravado
            await Promise.all([...gravPend]);
            const a = await DB.get("autorizacoes", v.autorizacaoId);
            if (a && a.status === "em_uso" && a.visitaId === v.id)
              await DB.set("autorizacoes", a.id, { ...a, status: "concluida", ativa: false, concluidaEm: Date.now() });
          }
        } catch (e) {
          console.error(e);
          toast("Erro ao encerrar: " + (e.code || e.message));
        }
      }

      function makeSnap(v, c) {
        const prev = v.tipo === "preventiva";
        const sistemas = prev
          ? S.cat.sis
              .filter((s) => v.sis[s.sigla])
              .map((s) => {
                const eqs = c.eqs.filter((e) => tp(e.tipo).sis === s.sigla);
                return {
                  sigla: s.sigla,
                  nome: s.nome,
                  previstos: eqs.filter((e) => !(v.ver[e.id] || {}).off).map(nmEq),
                  feitos: eqs
                    .filter((e) => !(v.ver[e.id] || {}).off)
                    .map((e) => {
                      const t = tp(e.tipo),
                        st = v.ver[e.id] || {};
                      return {
                        nome: nmEq(e),
                        atividades: atvDe(e).filter((a, k) => !(st.no || {})[k]),
                        dias: t.extra === "dias" ? st.dias || [] : [],
                        status: st.st || STATUS_EQ[0],
                      };
                    }),
                };
              })
          : [];
        return {
          tipo: v.tipo,
          data: v.data,
          hora: v.hora,
          numero: (v.numero || "").trim(),
          ini: v.ini,
          fim: v.fim,
          tecnicos: v.tecnicos,
          corr: v.corr,
          custo: v.custo,
          obs: v.obs,

          ]);
          const blob = new Blob(
            [
              JSON.stringify(
                { gerado: new Date().toISOString(), equipes: S.eq, catalogo: S.cat, config: S.cfg, clientes, visitas, pendencias },
                null,
                1,
              ),
            ],

      function baixar(blob, nome) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = nome;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          URL.revokeObjectURL(a.href);
          a.remove();
        }, 1500);
      }

      /* ==================================================================

      async function gerarDocx(sn) {
        if (typeof docx === "undefined") return toast("Biblioteca do Word não carregou. Verifique a internet.");
        const d = docx,
          F = "Arial",
          W = 10000,
          DX = d.WidthType.DXA;
        const ln = { style: d.BorderStyle.SINGLE, size: 6, color: "000000" },
          bo = { top: ln, bottom: ln, left: ln, right: ln };
        const R = (t, o) => new d.TextRun({ text: t, font: F, size: 16, ...o }),
          B = (t) => R(t, { bold: true });
        const P = (ch, o) => new d.Paragraph({ spacing: { before: 40, after: 40 }, children: [].concat(ch), ...o });
        const sh = (f) => ({ type: d.ShadingType.CLEAR, fill: f, color: "auto" });
        const C = (ch, w, o = {}) =>
          new d.TableCell({
            borders: bo,
            width: { size: w, type: DX },
            margins: { top: 60, bottom: 60, left: 100, right: 100 },
            children: ch.length ? ch : [P(R(""))],
            ...o,
          });
        const Lb = (t, w) => C([P(B(t))], w, { shading: sh("EDEDED") });
        const TR = (x) => new d.TableRow({ children: x });
        const Tb = (r, cols) =>
          new d.Table({
            width: { size: W, type: DX },
            columnWidths: cols,
            layout: d.TableLayoutType.FIXED,
            alignment: d.AlignmentType.CENTER,
            indent: { size: 0, type: DX },
            rows: r,
          });
        const gap = () => P(R("", { size: 8 }), { spacing: { before: 0, after: 0 } });
        const box = (ch) => Tb([TR([C(ch, W)])], [W]);
        const sec = (t, ch) =>
          Tb([new d.TableRow({ cantSplit: true, children: [C([P(B(t))], W, { shading: sh("EDEDED") })] }), TR([C(ch, W)])], [W]);
        const lines = (t) =>
          (t || "")
            .split("\n")
            .map((s) => s.trim())
            .filter(Boolean)
            .map((l) => P(R(l)));
        const cab = sn.cab,
          prev = sn.tipo === "preventiva",
          HS = 12; // respostas do cabeçalho: 6 pt (tópicos e resto do documento: 8 pt)

        // ---- cabeçalho (Detectada e Prioridade ficam em branco, para preencher no Word)
        const L = [
          ["Empresa:", cab.empresa],
          ["Unidade de Man.:", cab.unidade],
          ["Área:", cab.area],
          ["Sistema de Man.:", cab.sisMan],
          ["Detectada:", null],
          ["Prioridade:", null],
        ];
        const Rr = [
          ["Tipo de Ocorrência:", cab.tipoOc],
          ["Equipamento:", cab.equipCab],
          ["Capacidade:", ""],
          ["Marca:", ""],
          ["Modelo:", ""],
          ["Data / Hora:", bd(sn.data) + "   " + sn.hora],
        ];
        const cl = [1800, 2800, 650, 2150, 2600];
        const head = Tb(
          L.map((l, i) =>
            TR([
              Lb(l[0], cl[0]),
              C([P(R(l[1] || "", { size: HS }))], cl[1]),
              ...(i === 0
                ? [
                    new d.TableCell({
                      borders: bo,
                      rowSpan: 6,
                      width: { size: cl[2], type: DX },
                      verticalAlign: d.VerticalAlign.CENTER,
                      textDirection: d.TextDirection.BOTTOM_TO_TOP_LEFT_TO_RIGHT,
                      children: [P([B("Nº: "), R(sn.numero || "", { size: 32 })], { alignment: d.AlignmentType.CENTER })],
                    }),
                  ]
                : []),
              Lb(Rr[i][0], cl[3]),
              C([P(R(Rr[i][1], { size: HS }))], cl[4]),
            ]),
          ),
          cl,
        );

        // ---- itens de corretiva / pendência
        const rot = (r, t) => (t ? P([B(r + ": "), R(t)]) : null);
        function itemParas(it, rotStatus) {
          const o = [],
            est = it.problema || it.diag || (it.acoes || []).length || it.solucao || it.obs;
          if (it.titulo) o.push(P(est ? [B("Equipamento: "), R(it.titulo)] : B(it.titulo), { spacing: { before: 140, after: 40 } }));
          o.push(rot("Problema Reportado", it.problema), rot("Diagnóstico", it.diag));
          if ((it.acoes || []).length) {
            o.push(P(B("Ações Corretivas Executadas:")));
            it.acoes.forEach((a, k) => o.push(P(R(`${roman(k + 1)}.  ${a}`), { indent: { left: 500 } })));
          }
          o.push(rot("Solução proposta", it.solucao), rot("Observação técnica", it.obs));
          o.push(...lines(it.texto));
          if (it.ressalva) o.push(P(R("Ressalva: " + it.ressalva, { italics: true })));
          if (it.status) o.push(P(B(rotStatus + ": " + it.status)));
          return o.filter(Boolean);
        }
        const itens = sn.itens.filter((i) => i.titulo || i.problema || i.diag || i.texto || (i.acoes || []).length || i.solucao || i.obs);
        const pe = [];
        sn.pend
          .filter((p) => p.titulo || p.problema || p.diag || p.texto || (p.acoes || []).length || p.solucao || p.obs)
          .forEach((p) => pe.push(...itemParas({ ...p, status: p.concluir ? "Concluída em " + bd(sn.data) : p.status }, "Status")));

        // ---- início e final da visita
        const ini = [P(B("Início da Visita Técnica")), P([B("Técnicos: "), R(sn.tecnicos)]), P([B("Área: "), R(cab.areaVisita)])];
        const fin = [P(B("Final da Visita Técnica")), P([B("Técnicos: "), R(sn.tecnicos)])];
        if (prev) {
          ini.push(
            P(R("Estão previstas as realizações das seguintes atividades preventivas:", { bold: true, underline: {} }), {
              spacing: { before: 160, after: 80 },
            }),
          );
          sn.sistemas.filter((s) => s.previstos.length).forEach((s, n) => {
            ini.push(P(B(`${n + 1}.  ${s.sigla} (${s.nome})`), { indent: { left: 400 }, spacing: { before: 120, after: 40 } }));
            s.previstos.forEach((t) => ini.push(P(R("•   " + t), { indent: { left: 800 } })));
          });
          fin.push(
            P(R("Preventiva – Área: " + cab.areaVisita + "   Ações realizadas:", { bold: true, underline: {} }), {
              spacing: { before: 160, after: 80 },
            }),
          );
          sn.sistemas.forEach((s) => {
            if (!s.feitos.length) return;
            fin.push(P(B(`${s.sigla} (${s.nome})`), { spacing: { before: 160, after: 40 } }));
            s.feitos.forEach((e, n) => {
              fin.push(P(B(`${n + 1}.  ${e.nome}`), { indent: { left: 400 }, spacing: { before: 100, after: 40 } }));
              if (e.atividades.length) {
                fin.push(P(R("Atividades realizadas:"), { indent: { left: 800 } }));
                e.atividades.forEach((a, k) => {
                  fin.push(P(R(`${roman(k + 1)}.  ${a}`), { indent: { left: 1200 } }));
                  if (k === 0) e.dias.forEach((x) => fin.push(P(R("•   " + x), { indent: { left: 1700 } })));
                });
              }
              fin.push(P(B("Status: " + e.status), { indent: { left: 800 } }));
            });
          });
        } else {
          ini.push(P(R("Atendimento corretivo solicitado:", { bold: true, underline: {} }), { spacing: { before: 160, after: 80 } }));
          itens.forEach((i) => ini.push(P(R("•   " + [i.titulo, i.problema].filter(Boolean).join(": ")), { indent: { left: 400 } })));
          fin.push(
            P(R("Corretiva – Área: " + cab.areaVisita + "   Ações realizadas:", { bold: true, underline: {} }), {
              spacing: { before: 160, after: 80 },
            }),
          );
          itens.forEach((i) => fin.push(...itemParas(i, "Status Final")));
        }

        // ---- rodapé do relatório
        const mi = (s) => {
            const [h, m] = (s || "").split(":");
            return +h * 60 + +m;
          },
          tt = mi(sn.fim) - mi(sn.ini);
        const tot = isNaN(tt) || tt < 0 ? "" : pad(Math.floor(tt / 60)) + ":" + pad(tt % 60),
          fc = [1700, 3402, 1300, 1700, 1898];
        const foot = Tb(
          [
            TR([
              Lb("Solicitado por:", fc[0]),
              C([P(R(cab.solic))], fc[1]),
              Lb("INÍCIO", fc[2]),
              Lb("Data: " + bd(sn.data), fc[3]),
              C([P(R("Hora: " + sn.ini))], fc[4]),
            ]),
            TR([
              Lb("Executado por:", fc[0]),
              C([P(R(cab.exec))], fc[1]),
              Lb("TÉRMINO", fc[2]),
              Lb("Data: " + bd(sn.data), fc[3]),
              C([P(R("Hora: " + sn.fim))], fc[4]),
            ]),
            TR([
              Lb("Custo:", fc[0]),
              C([P(R("R$ " + (sn.custo || "")))], fc[1]),
              new d.TableCell({
                borders: bo,
                columnSpan: 3,
                width: { size: fc[2] + fc[3] + fc[4], type: DX },
                margins: { top: 60, bottom: 60, left: 100, right: 100 },
                children: [P(B("Tempo Total Trabalhado (Horas:Minutos): " + tot))],
              }),
            ]),
          ],
          fc,
        );

        let headers;
        try {
          const r = await fetch("logo.png");
          if (r.ok)
            headers = {
              default: new d.Header({
                children: [
                  P(
                    new d.ImageRun({
                      type: "png",
                      data: new Uint8Array(await r.arrayBuffer()),
                      transformation: { width: 220, height: 30 },
                    }),
                    { spacing: { after: 0 } },
                  ),
                ],
              }),
            };
        } catch (e) {}
        const corpo = [
          head,
          gap(),
          Tb([TR([Lb("OCORRÊNCIA", 1800), C([P(B("EMITENTE: " + cab.emitente))], W - 1800)])], [1800, W - 1800]),
          box(ini),
          gap(),
          Tb(
            [TR([Lb("CORREÇÃO", 1800), C([P(R(CORRECOES.map((x) => (x === sn.corr ? "(x) " : "( ) ") + x).join("        ")))], W - 1800)])],
            [1800, W - 1800],
          ),
          box(fin),
          gap(),
        ];
        if (prev)
          corpo.push(
            sec(
              "Corretivas técnicas:",
              itens.flatMap((i) => itemParas(i, "Status Final")),
            ),
            gap(),
          );
        corpo.push(sec("Pendências:", pe), gap());
        if (sn.obs) corpo.push(sec("Observação Técnica:", lines(sn.obs)), gap());
        corpo.push(foot);

        const doc = new d.Document({
          creator: "Controller BMS",
          title: "Relatório de Visita Técnica",
          styles: { default: { document: { run: { font: F, size: 16 } } } },
          sections: [
            {
              properties: {
                page: { size: { width: 11906, height: 16838 }, margin: { top: 1134, bottom: 851, left: 851, right: 851, header: 454 } },
              },
              headers,
              footers: {
                default: new d.Footer({
                  children: [
                    P(
                      [
                        R("Página ", { size: 16 }),
                        new d.TextRun({ children: [d.PageNumber.CURRENT], font: F, size: 16 }),
                        R(" de ", { size: 16 }),
                        new d.TextRun({ children: [d.PageNumber.TOTAL_PAGES], font: F, size: 16 }),
                      ],
                      { alignment: d.AlignmentType.RIGHT },
                    ),
                  ],
                }),
              },
              children: corpo,
            },
          ],
        });
        const nome = cab.unidade
          .normalize("NFD")
          .replace(/[̀-ͯ]/g, "")
          .replace(/[^\w]+/g, "_")
          .replace(/^_|_$/g, "");
        baixar(await d.Packer.toBlob(doc), `${nome}_Visita_Tecnica${prev ? "" : "_Corretiva"}_${bd(sn.data).replace(/\//g, "_")}.docx`);
      }

      /* ==================================================================
   11. SIMULADO SDAI — MOTOR DO WORD
   Lê o último relatório (.docx) do cliente e gera o próximo a partir dele,
   trocando só o que muda: datas, nomes, tabelas e fotos. O resto do Word fica igual.
   ================================================================== */
      const SDAI = (() => {
        const WNS = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
        const W14 = "http://schemas.microsoft.com/office/word/2010/wordml";
        const MES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
        const XMLDECL = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
        const CM = 360000; // 1 cm na unidade do Word

        // ---------- utilidades de XML ----------
        const els = (r, tag) => Array.from(r.getElementsByTagNameNS(WNS, tag));
        const eh = (n, tag) => n.nodeType === 1 && n.localName === tag && n.namespaceURI === WNS;
        const filhos = (e, tag) => Array.from(e.childNodes).filter((n) => eh(n, tag));
        const acima = (n, tag) => {
          for (let x = n.parentNode; x; x = x.parentNode) if (eh(x, tag)) return x;
          return null;
        };
        const norm = (s) =>
          String(s || "")
            .normalize("NFD")
            .replace(/[̀-ͯ]/g, "")
            .toUpperCase()
            .replace(/\s+/g, " ")
            .trim();
        const rx = (s) => String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const br = (iso) => String(iso || "").split("-").reverse().join("/");
        const tsDe = (p) => els(p, "t").filter((t) => acima(t, "p") === p);
        const textoP = (p) => tsDe(p).map((t) => t.textContent).join("");
        const psDe = (tc) => els(tc, "p").filter((p) => acima(p, "tc") === tc);
        const textoTc = (tc) => psDe(tc).map(textoP).join(" ").replace(/\s+/g, " ").trim();
        const linhas = (tbl) => filhos(tbl, "tr");
        const celulas = (tr) => filhos(tr, "tc");
        const textoTr = (tr) => celulas(tr).map(textoTc);
        const estilo = (p) => {
          const pp = filhos(p, "pPr")[0],
            st = pp && filhos(pp, "pStyle")[0];
          return st ? st.getAttributeNS(WNS, "val") || "" : "";
        };
        const ehTitulo = (st) => /^(Ttulo|Titulo|Heading)\d$/i.test(st);
        const ehTitulo1 = (st) => /^(Ttulo|Titulo|Heading)1$/i.test(st);
        function mk(doc, tag, attrs) {
          const e = doc.createElementNS(WNS, "w:" + tag);
          if (attrs) for (const k in attrs) e.setAttributeNS(WNS, "w:" + k, attrs[k]);
          return e;
        }
        function run(doc, txt, rpr) {
          const r = mk(doc, "r");
          if (rpr) r.appendChild(rpr);
          const t = mk(doc, "t");
          t.textContent = txt;
          t.setAttribute("xml:space", "preserve");
          r.appendChild(t);
          return r;
        }
        const limpaIds = (n) =>
          [n, ...Array.from(n.getElementsByTagName("*"))].forEach((e) => {
            e.removeAttributeNS(W14, "paraId");
            e.removeAttributeNS(W14, "textId");
          });

        // troca um trecho do parágrafo mesmo quando o Word quebrou o texto em vários pedaços (mantém a formatação)
        function trocaP(p, re, fn) {
          const ts = tsDe(p);
          if (!ts.length) return false;
          const txt = ts.map((t) => t.textContent).join("");
          const g = new RegExp(re.source, re.flags.includes("g") ? re.flags : re.flags + "g");
          const ms = [];
          let m;
          while ((m = g.exec(txt))) {
            if (!m[0].length) {
              g.lastIndex++;
              continue;
            }
            ms.push([m.index, m.index + m[0].length, fn(m)]);
          }
          if (!ms.length) return false;
          for (let k = ms.length - 1; k >= 0; k--) {
            const [ini, fim, rep] = ms[k];
            let pos = 0,
              posto = false;
            for (const t of ts) {
              const s = t.textContent,
                a = pos,
                b = pos + s.length;
              pos = b;
              if (b <= ini || a >= fim) continue;
              t.textContent = s.slice(0, Math.max(ini, a) - a) + (posto ? "" : rep) + s.slice(Math.min(fim, b) - a);
              t.setAttribute("xml:space", "preserve");
              posto = true;
            }
          }
          return true;
        }

        // ---------- células e tabelas ----------
        function rprDe(tc) {
          const ps = psDe(tc);
          for (const p of ps) {
            const r = els(p, "r").find((x) => acima(x, "p") === p && filhos(x, "t").length && filhos(x, "rPr").length);
            if (r) return filhos(r, "rPr")[0];
          }
          for (const p of ps) {
            const pp = filhos(p, "pPr")[0],
              q = pp && filhos(pp, "rPr")[0];
            if (q) return q;
          }
          return null;
        }
        function setCell(doc, tc, txt, fb) {
          const ps = psDe(tc);
          if (!ps.length) return;
          const vazia = !textoTc(tc),
            rpr = rprDe(tc) || fb || null,
            p = ps[0];
          ps.slice(1).forEach((x) => x.parentNode.removeChild(x));
          Array.from(p.childNodes).forEach((c) => {
            if (!eh(c, "pPr")) p.removeChild(c);
          });
          const v = String(txt == null ? "" : txt);
          if (!v) return;
          const novo = rpr ? rpr.cloneNode(true) : null;
          if (novo && vazia) filhos(novo, "highlight").forEach((x) => novo.removeChild(x)); // célula que estava vazia: não herda marca-texto esquecido no modelo
          p.appendChild(run(doc, v, novo));
        }
        // formatação de reserva para células vazias: a de outra célula da mesma coluna
        const fbColuna = (rs, j) =>
          rs
            .map((r) => celulas(r)[j])
            .filter(Boolean)
            .map(rprDe)
            .find(Boolean) || null;
        // grava valores nas linhas que já existem, a partir da coluna c0
        function preencheFixa(doc, tbl, cab, dados, c0) {
          const rs = linhas(tbl).slice(cab);
          (dados || []).forEach((linha, i) => {
            if (!rs[i] || !linha) return;
            const tcs = celulas(rs[i]);
            linha.forEach((v, j) => {
              if (tcs[c0 + j]) setCell(doc, tcs[c0 + j], v, fbColuna(rs, c0 + j));
            });
          });
        }
        // refaz as linhas da tabela conforme a quantidade de itens (copia o formato da primeira linha)
        function preencheVar(doc, tbl, cab, dados) {
          const rs = linhas(tbl).slice(cab);
          if (!rs.length) return;
          const modelo = rs[0].cloneNode(true);
          limpaIds(modelo);
          const fb = celulas(rs[0]).map((_, j) => fbColuna(rs, j));
          rs.forEach((r) => tbl.removeChild(r));
          (dados && dados.length ? dados : [[]]).forEach((linha) => {
            const tr = modelo.cloneNode(true);
            celulas(tr).forEach((tc, j) => setCell(doc, tc, linha[j], fb[j]));
            tbl.appendChild(tr);
          });
        }

        // acha as tabelas do relatório pelo capítulo em que estão e pelo cabeçalho de cada uma
        function mapa(body) {
          const T = {};
          let h1 = "",
            h = "";
          const visita = (n) => {
            for (const c of Array.from(n.childNodes)) {
              if (c.nodeType !== 1) continue;
              if (eh(c, "p")) {
                const st = estilo(c);
                if (!ehTitulo(st)) continue;
                const t = norm(textoP(c));
                if (!t) continue;
                if (ehTitulo1(st)) h1 = t;
                h = t;
              } else if (eh(c, "tbl")) {
                const rs = linhas(c);
                if (!rs.length) continue;
                const cab = norm(textoTr(rs[0]).join(" "));
                const poe = (k) => {
                  if (!T[k]) T[k] = c;
                };
                const par = (a, b) => (T[a] ? poe(b) : poe(a));
                if (/LEVANTAMENTO BASICO/.test(h1)) poe("c4");
                else if (/AMBIENTE COBERTO/.test(h1)) par("c6a", "c6");
                else if (/INFRAESTR/.test(h1)) par("c7a", "c7");
                else if (/IMPOSSIBILIDADE DE ACESSO/.test(h1)) par("acA", "ac");
                else if (/^ALIMENTACAO ELETRICA/.test(cab)) poe("alim");
                else if (/^LACO\(S\)/.test(cab)) poe("lacos");
                else if (/^SINALIZACAO/.test(cab)) poe("sirenes");
                else if (/^DATA E HORA EVENTO/.test(cab)) /DETECTOR/.test(h) ? poe("det") : /ACIONADOR/.test(h) ? poe("acion") : par("acion", "det");
                else if (/^CIRCUITO\(S\) \/ SIRENE\(S\) IDENTIFICACAO/.test(cab)) poe("aviso");
                else if (/^DATA E HORA TIPO PAINEL LACO \/ CIRCUITO/.test(cab)) poe("nc");
                else if (/^DATA E HORA TIPO PAINEL/.test(cab)) poe("mod");
                else if (/^INTERFACE/.test(cab)) poe("inter");
                else if (/^MODELO IDENTIFICACAO/.test(cab)) poe("rep");
                else if (/^CONDICOES/.test(cab)) poe("c12");
              } else if (eh(c, "sdt") || eh(c, "sdtContent") || eh(c, "customXml")) visita(c);
            }
          };
          visita(body);
          return T;
        }

        // ---------- fotos ----------
        // a que assunto pertence a foto, pela legenda que está embaixo dela no Word
        function classifica(leg) {
          const t = norm(leg);
          if (/SIRENE/.test(t) && /TENS/.test(t)) return "sirenes";
          if (/LOOP|LACO/.test(t)) return "lacos";
          if (/TENS/.test(t) && /CENTRAL|ALIMENTA|FONTE|BATERIA/.test(t)) return "alim";
          if (/ACIONADOR/.test(t)) return "acion";
          if (/DETECTOR/.test(t)) return "det";
          if (/CATRACA/.test(t)) return "catracas";
          if (/ELEVADOR/.test(t)) return "elev";
          if (/REPETID/.test(t)) return "repet";
          if (/PRESSURIZ/.test(t)) return "press";
          return "";
        }
        const descLegenda = (leg) =>
          leg
            .replace(/^Figura\s*[\d‐‑\-–.]*\s*/i, "")
            .replace(/[,\s–-]*\d{2}\/\d{2}(\/\d{4})?.*$/, "")
            .trim();
        function desenho(doc, rid, id, nm, cx, cy) {
          const x = `<w:drawing xmlns:w="${WNS}" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${id}" name="${nm}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="${id}" name="${nm}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing>`;
          return doc.importNode(new DOMParser().parseFromString(x, "application/xml").documentElement, true);
        }
        function tamanho(w, h, n) {
          const k = Math.min(((n === 1 ? 12 : 7.4) * CM) / w, ((n === 1 ? 9 : 7) * CM) / h);
          return [Math.round(w * k), Math.round(h * k)];
        }

        // ---------- marcações "x" dos checklists ----------
        const posMarca = (r, cols) => cols.findIndex((c) => (r[c] || "") !== "");
        const achaMarca = (rows, cols) => {
          for (const r of rows) for (const c of cols) if (r[c]) return r[c];
          return "x";
        };

        /* ---------- 1) LER o último relatório ----------
           Devolve { info, bytes }: info = dados do cliente e do último ensaio; bytes = o Word pronto para servir de modelo
           (com os lugares das fotos marcados e sem as fotos antigas). */
        async function ler(buf, JSZip) {
          const zip = await JSZip.loadAsync(buf);
          if (!zip.file("word/document.xml")) throw new Error("Este arquivo não é um documento do Word (.docx).");
          const P = new DOMParser(),
            X = new XMLSerializer();
          const xml = async (n) => P.parseFromString(await zip.file(n).async("string"), "application/xml");
          const docX = await xml("word/document.xml"),
            body = els(docX, "body")[0];
          const info = { mp: "", nome: "", razao: "", dataAtual: "", dataAnt: "", horaIni: "", horaFim: "", exec: [], resp: "", respCliente: "", tem: {}, rot: {}, val: {}, marca: {}, slots: [] };
          let capaData = "";
          for (const p of els(body, "p")) {
            const t = textoP(p).replace(/\s+/g, " ").trim();
            if (!t) continue;
            let m;
            if (!info.mp && (m = t.match(/Refer[êe]ncia:\s*(MP\s?\d{3}\s?\d{3})/i))) info.mp = m[1].replace(/\s/g, "");
            if (!info.razao && (m = t.match(/^Raz[ãa]o Social:\s*(.+)$/i))) info.razao = m[1].trim();
            if (!info.nome && (m = t.match(/^Cliente:\s*(.+)$/i))) info.nome = m[1].trim();
            if (!info.dataAnt && (m = t.match(/ensaio anterior[^.]*?(\d{2}\/\d{2}\/\d{4})/i))) info.dataAnt = m[1];
            if (!capaData && (m = t.match(/Data e hora:\s*(\d{2}\/\d{2}\/\d{4})/i))) capaData = m[1];
            if (!info.respCliente && /^De acordo com o descrito/i.test(t) && (m = t.match(/responsabilidade d[eoa] ([^.]+)\./i))) info.respCliente = m[1].trim();
          }
          for (const n of Object.keys(zip.files)
            .filter((x) => /^word\/(header|footer)\d+\.xml$/.test(x))
            .sort()) {
            const x = await xml(n),
              tudo = els(x, "p").map(textoP).join(" ");
            if (/Erro!|Error!/.test(tudo)) continue; // variantes quebradas do cabeçalho/rodapé
            if (/footer/.test(n) && !info.exec.length) {
              const tc = els(x, "tc").find((c) => /^MP\s?\d{3}\s?\d{3}$/.test(textoTc(c)));
              if (tc) {
                const tcs = celulas(acima(tc, "tr")),
                  i = tcs.indexOf(tc);
                const nomes = (c) =>
                  c
                    ? psDe(c)
                        .map((p) => textoP(p).trim())
                        .filter(Boolean)
                    : [];
                info.exec = nomes(tcs[i + 1]);
                info.resp = nomes(tcs[i + 2]).join(" / ");
                if (!info.mp) info.mp = textoTc(tc).replace(/\s/g, "");
              }
            }
            if (/header/.test(n) && !info.dataAtual) {
              let m = tudo.match(/(\d{2})\s*\/\s*(\d{2})\s*\/\s*(\d{4})\s*\|\s*(\d{2})\s*:\s*(\d{2})\s*h\s*[–-]\s*(\d{2})\s*:\s*(\d{2})/);
              if (m) {
                info.dataAtual = `${m[1]}/${m[2]}/${m[3]}`;
                info.horaIni = `${m[4]}:${m[5]}`;
                info.horaFim = `${m[6]}:${m[7]}`;
              } else if ((m = tudo.match(/(\d{2})\s*\/\s*(\d{2})\s*\/\s*(\d{4})/))) info.dataAtual = `${m[1]}/${m[2]}/${m[3]}`;
            }
          }
          if (!info.dataAtual) info.dataAtual = capaData;

          // tabelas: o que está como "ensaio atual" no Word vira o "anterior" do próximo ensaio
          const T = mapa(body);
          const dados = (t, cab) => linhas(t).slice(cab).map(textoTr);
          const cheia = (r) => r.some((x) => x !== "");
          if (T.alim) {
            const r = dados(T.alim, 2);
            info.tem.alim = 1;
            info.rot.alim = r.map((x) => x[0] || "");
            info.val.alim = r.map((x) => [x[7] || "", x[8] || "", x[9] || ""]);
          }
          for (const k of ["lacos", "sirenes"])
            if (T[k]) {
              const r = dados(T[k], 2);
              info.tem[k] = 1;
              info.rot[k] = r.map((x) => x[1] || x[0] || "");
              info.val[k] = r.map((x) => [x[6] || "", x[7] || "", x[8] || "", x[9] || ""]);
            }
          if (T.c4) {
            const r = dados(T.c4, 1).filter((x) => x.length >= 4);
            info.tem.c4 = 1;
            info.rot.c4 = r.map((x) => x[x.length - 4]);
            info.val.c4 = r.map((x) => ["S", "N", "NA"][posMarca(x, [x.length - 3, x.length - 2, x.length - 1])] || "");
            const n4 = r[0] ? r[0].length : 5;
            info.marca.c4 = achaMarca(r, [n4 - 3, n4 - 2, n4 - 1]);
          }
          for (const k of ["c6", "c7"])
            if (T[k]) {
              const r = dados(T[k], 2);
              info.tem[k] = 1;
              info.rot[k] = r.map((x) => x[0] || "");
              info.val[k] = r.map((x) => [["S", "N"][posMarca(x, [1, 2])] || "", x[3] || "", ["S", "N"][posMarca(x, [4, 5])] || ""]);
              info.marca[k] = achaMarca(r, [1, 2, 4, 5]);
            }
          if (T.c12) {
            const r = dados(T.c12, 1);
            info.tem.c12 = 1;
            info.rot.c12 = r.map((x) => x[0] || "");
            info.val.c12 = r.map((x) => ["S", "N"][posMarca(x, [1, 2])] || "");
            info.marca.c12 = achaMarca(r, [1, 2]);
          }
          for (const k of ["ac", "nc", "inter", "acion", "det", "aviso", "mod", "rep"])
            if (T[k]) {
              info.tem[k] = 1;
              info.val[k] = dados(T[k], 1).filter(cheia);
            }
          if (T.aviso) {
            let c = T.aviso.nextElementSibling;
            for (let i = 0; c && i < 3; i++, c = c.nextElementSibling) {
              const m = eh(c, "p") && /^Tabela/i.test(textoP(c).trim()) && textoP(c).match(/(\d{2})\s*:\s*(\d{2})\s*h?\s*$/);
              if (m) {
                info.val.avisoHora = `${m[1]}:${m[2]}`;
                break;
              }
            }
          }

          // lugares de foto: parágrafo com imagem seguido da legenda "Figura …"
          const genericos = {};
          let nx = 0;
          for (const p of els(body, "p")) {
            const cap = p.nextElementSibling;
            if (!cap || !eh(cap, "p")) continue;
            const leg = textoP(cap).replace(/\s+/g, " ").trim();
            if (!/^Figura/i.test(leg)) continue;
            if (!p.getElementsByTagNameNS(WNS, "drawing").length && !p.getElementsByTagNameNS(WNS, "pict").length) continue;
            const desc = descLegenda(leg);
            let k = classifica(leg);
            if (!k) {
              const d = norm(desc);
              k = genericos[d] || (genericos[d] = "x" + ++nx);
            }
            if (!info.slots.some((s) => s.k === k)) info.slots.push({ k, tit: desc });
            Array.from(p.childNodes).forEach((c) => {
              if (!eh(c, "pPr")) p.removeChild(c);
            });
            p.appendChild(run(docX, `[[F:${k}]]`));
          }

          // tira do arquivo as fotos antigas (ficam as imagens fixas: capa, logos, matriz de causa e efeito)
          const relsN = "word/_rels/document.xml.rels";
          const rels = await xml(relsN),
            txt = X.serializeToString(docX),
            fora = [],
            emUso = new Set();
          Array.from(rels.documentElement.childNodes).forEach((r) => {
            if (r.nodeType !== 1) return;
            const tg = r.getAttribute("Target") || "";
            if (/^media\//.test(tg) && !txt.includes('"' + r.getAttribute("Id") + '"')) {
              fora.push("word/" + tg);
              r.parentNode.removeChild(r);
            } else emUso.add("word/" + tg);
          });
          for (const n of Object.keys(zip.files))
            if (/^word\/_rels\/.+\.rels$/.test(n) && n !== relsN)
              (await zip.file(n).async("string")).replace(/Target="([^"]+)"/g, (_, t) => (emUso.add("word/" + t.replace(/^\/?(word\/)?/, "")), ""));
          fora.forEach((f) => {
            if (!emUso.has(f)) zip.remove(f);
          });
          zip.file(relsN, XMLDECL + X.serializeToString(rels).replace(/^<\?xml[^>]*\?>\s*/, ""));
          zip.file("word/document.xml", XMLDECL + txt.replace(/^<\?xml[^>]*\?>\s*/, ""));
          return { info, bytes: await zip.generateAsync({ type: "uint8array", compression: "DEFLATE" }) };
        }

        /* ---------- 2) GERAR o Word do ensaio a partir do modelo ---------- */
        async function gerar(tpl, d, JSZip) {
          const zip = await JSZip.loadAsync(tpl);
          const P = new DOMParser(),
            X = new XMLSerializer();
          const xml = async (n) => P.parseFromString(await zip.file(n).async("string"), "application/xml");
          const docX = await xml("word/document.xml"),
            body = els(docX, "body")[0];
          const M = d.modelo || {},
            ANT = d.ant || {},
            E = d.ev || {};
          const D = br(d.data),
            A = ANT.data ? br(ANT.data) : "";
          const [ano, mes] = d.data.split("-");
          const ex = (d.exec || []).map((s) => String(s || "").trim()),
            exOk = ex.filter(Boolean);
          const lista = (a) => (a.length > 1 ? a.slice(0, -1).join(", ") + " e " + a[a.length - 1] : a[0] || "");
          const partes = [["word/document.xml", docX]];
          for (const n of Object.keys(zip.files)) if (/^word\/(header|footer)\d+\.xml$/.test(n)) partes.push([n, await xml(n)]);

          // 2.1) textos: datas, horário, mês da capa, MP e nomes
          const mB = /^\d{2}\/\d{2}\/\d{4}$/.test(M.dataAtual || "") ? M.dataAtual.split("/") : null;
          const reMes = mB ? new RegExp("(" + MES[+mB[1] - 1] + ")(\\s*\\/\\s*)" + mB[2], "i") : null;
          const respNovo = String(d.resp || "").trim(),
            respVelho = String(M.resp || "").trim();
          for (const [n, x] of partes) {
            const rodape = /footer/.test(n);
            for (const p of els(x, "p")) {
              const tx = textoP(p);
              if (!tx.trim()) continue;
              if (rodape) {
                for (let i = 0; i < (M.exec || []).length; i++)
                  if (M.exec[i] && trocaP(p, new RegExp("^\\s*" + rx(M.exec[i]) + "\\s*$"), () => ex[i] || "")) break;
              } else if (/^\s*De acordo com o descrito/i.test(tx)) {
                trocaP(p, /nessa data de \d{2}\/\d{2}\/\d{4}(\s+\d{2}:\d{2}\s*h)?/i, () => `nessa data de ${D} ${d.horaIni}h`);
                if (exOk.length) trocaP(p, /\bos? técnicos? .+?(?=,? juntamente)/i, () => (exOk.length > 1 ? "os técnicos " : "o técnico ") + lista(exOk));
                if (d.respCliente) trocaP(p, /responsabilidade d[eoa] [^.]+\./i, () => `responsabilidade de ${d.respCliente}.`);
              } else if (/\(Executante\b/i.test(tx)) {
                if (exOk[0]) trocaP(p, /^\s*[^(]+(?=\()/, () => exOk[0] + " ");
              } else {
                if (/Data e hora:/i.test(tx)) trocaP(p, /(Data e hora:\s*)\d[\d\s\/]*\d(?=\s*\|)/i, (m) => m[1] + D); // capa: vale a data do ensaio, mesmo se a do modelo estiver digitada errada
                trocaP(p, /\d{2}\s*\/\s*\d{2}\s*\/\s*\d{4}/, (m) => {
                  const v = m[0].replace(/\s/g, "");
                  return v === M.dataAtual ? D : v === M.dataAnt && A ? A : m[0];
                });
                trocaP(p, /\d{2}\s*:\s*\d{2}\s*h\s*[–-]\s*\d{2}\s*:\s*\d{2}\s*h/, () => `${d.horaIni}h – ${d.horaFim}h`);
                if (reMes)
                  trocaP(p, reMes, (m) => {
                    const nv = MES[+mes - 1];
                    return (/^[A-ZÀ-Ý]/.test(m[1]) ? nv[0].toUpperCase() + nv.slice(1) : nv) + m[2] + ano;
                  });
              }
              if (d.ref) trocaP(p, /MP\s?\d{3}\s?\d{3}/, () => d.ref);
              if (respNovo && respVelho && respNovo !== respVelho) trocaP(p, new RegExp(rx(respVelho)), () => respNovo);
            }
          }

          // 2.2) tabelas
          const T = mapa(body);
          for (const [k, cAnt, cAtu] of [
            ["alim", 4, 7],
            ["lacos", 2, 6],
            ["sirenes", 2, 6],
          ]) {
            if (!T[k]) continue;
            if (ANT[k]) preencheFixa(docX, T[k], 2, ANT[k], cAnt);
            if (d.med && d.med[k]) preencheFixa(docX, T[k], 2, d.med[k], cAtu);
          }
          const mar = d.marca || {};
          const checklist = (t, cab, vals, m, fn) => {
            if (!t || !vals) return;
            const rs = linhas(t).slice(cab);
            let fb = null;
            for (const r of rs) for (const tc of celulas(r).slice(1).reverse()) if (!fb && textoTc(tc)) fb = rprDe(tc); // formato de uma marcação que já existe
            rs.forEach((tr, i) => {
              if (vals[i] != null) fn(celulas(tr), vals[i], (tc, on) => tc && setCell(docX, tc, on === true ? m || "x" : on || "", fb));
            });
          };
          const C = d.chk || {};
          checklist(T.c4, 1, C.c4, mar.c4, (tcs, v, poe) => ["S", "N", "NA"].forEach((o, j) => poe(tcs[tcs.length - 3 + j], v === o)));
          const sn = (tcs, v, poe) => {
            if (tcs.length < 6) return;
            poe(tcs[1], v[0] === "S");
            poe(tcs[2], v[0] === "N");
            poe(tcs[3], v[1] || "");
            poe(tcs[4], v[2] === "S");
            poe(tcs[5], v[2] === "N");
          };
          checklist(T.c6, 2, C.c6, mar.c6, sn);
          checklist(T.c7, 2, C.c7, mar.c7, sn);
          checklist(T.c6a, 2, ANT.c6, mar.c6, sn);
          checklist(T.c7a, 2, ANT.c7, mar.c7, sn);

      /* ==================================================================

      const SD_PARTE = 700000; // cada parte do modelo (o Firestore aceita até 1 MB por documento)

      /* ---- fotos: ficam na memória enquanto o ensaio está aberto; no banco, uma foto por documento ---- */
      const sdFotoMem = new Map(), // id  { url, bytes }

      // reduz a foto (lado maior de 1200 px, JPEG) para caber no banco e não pesar no Word

            im = new Image();
          im.onload = async () => {
            try {
              const k = Math.min(1, 1200 / Math.max(im.width, im.height)),
                w = Math.max(1, Math.round(im.width * k)),
                h = Math.max(1, Math.round(im.height * k));
              const c = document.createElement("canvas");
              c.width = w;
              c.height = h;
              const g = c.getContext("2d");
              g.fillStyle = "#fff";
              g.fillRect(0, 0, w, h);
              g.drawImage(im, 0, 0, w, h);
              URL.revokeObjectURL(url);
              let bytes = null;
              for (const q of [0.72, 0.62, 0.52, 0.42, 0.32]) {

              no(e);
            }

          im.onerror = () => {
            URL.revokeObjectURL(url);
            no(new Error("imagem inválida"));
          };
          im.src = url;
        });

      async function sdFotoAdd(k, arquivos, galeria) {

      /* ==================================================================

      let sdTplMem = null,

      const abrePadrao = () => ["cab", "chk", "press", "ac", "nc"].forEach((k) => (S.ab["sd:" + k] = true));
      async function simBoot() {

            cli: c.id,

            }),

      // lê o Word anexado no diário, guarda o modelo limpo (fotos antigas viram marcadores) e as informações lidas
      async function simPrepara(c, bdoc) {
        S.sdOcup = "Lendo o documento anterior e atualizando as datas…";
        render();
        await lib("jszip");
        const ps = await Promise.all(Array.from({ length: bdoc.partes || 0 }, (_, i) => DB.get(SDGRANDE, `b_${c.id}_${bdoc.ver}_${i}`)));
        if (!ps.length || ps.some((p) => !p || !p.b64)) throw new Error("o documento anexado não foi encontrado. Anexe o Word de novo no diário.");
        const orig = deB64(ps.map((p) => p.b64).join(""));
        const { info, bytes } = await SDAI.ler(orig.buffer, JSZip);
        if (!info.dataAtual || (Object.keys(info.tem).length < 3 && !info.slots.length))
          throw new Error("Não reconheci este documento. Por enquanto o sistema lê o relatório trimestral padrão do SDAI (modelo Union).");
        const b64 = paraB64(bytes),
          N = Math.ceil(b64.length / SD_PARTE);
        if (N > 8) throw new Error("Este documento ficou grande demais para guardar (imagens fixas muito pesadas).");
        const ver = uid();

          await DB.set(SDGRANDE, `b_${c.id}_${ver}_${i}`, { id: `b_${c.id}_${ver}_${i}`, tipo: "base", clienteId: c.id, equipeId: c.equipeId || "", parte: i, b64: b64.slice(i * SD_PARTE, (i + 1) * SD_PARTE), criadoEm: Date.now() });

        g.rotate(Math.PI / 2);
        g.drawImage(bmp, 0, 0);
        const b = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.8));
        const bytes = new Uint8Array(await b.arrayBuffer());
        URL.revokeObjectURL(m.url);
        sdPoeFoto(id, bytes);

        sdDel() {
          const e = S.sd;
          if (!e || !sdPodeEditar(e) || e.status === "encerrado") return;
          if (!confirm(`Excluir o simulado de ${bd(e.data)}?\nOs dados e as fotos dele serão apagados e não dá para desfazer.`)) return;
          sdSolta(e.id);
          Object.values(e.fotos).flat().forEach((f) => DB.del(SDGRANDE, f.id).catch(console.error));
          DB.del("sdaiEnsaios", e.id).catch((x) => toast("Erro ao excluir: " + (x.code || x.message)));
          S.sdl = S.sdl.filter((x) => x.id !== e.id);
          S.sd = null;
          S.sdDatas = null;
          go("home");
        },
      });

      boot();

      // Corretor ortográfico (pt-BR) em todos os campos de texto, inclusive os criados depois
      (function () {
        const sel = 'textarea, input:not([type]), input[type="text"], input[type="search"]';
        const aplica = (root) =>
          (root.querySelectorAll ? root.querySelectorAll(sel) : []).forEach((el) => {
            el.setAttribute("spellcheck", "true");
            el.setAttribute("lang", "pt-BR");
            el.setAttribute("autocorrect", "on");
            if (!el.hasAttribute("autocapitalize")) el.setAttribute("autocapitalize", "sentences");
          });
        aplica(document);
        new MutationObserver((m) =>
          m.forEach((x) =>
            x.addedNodes.forEach((n) => {
              if (n.nodeType === 1) {
                if (n.matches && n.matches(sel)) aplica({ querySelectorAll: () => [n] });
                aplica(n);
              }
            }),
          ),
        ).observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
