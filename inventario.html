      /* ==================================================================
   9. AÇÕES
   ================================================================== */
      function itemAtual() {
        const doc = S.inv[S.aba];
        return doc ? (doc.itens || []).find((i) => i.id === S.aberto) : null;
      }
      async function salvaMeta(mod) {
        const novo = { id: S.cliId, clienteId: S.cliId, equipeId: (S.clientes.find((c) => c.id === S.cliId) || {}).equipeId || "", versao: 1, decisoes: {}, legenda: {}, importAlertas: [] };
        // aplica a alteração sobre o que está no servidor agora (não apaga problemas/decisões salvos por outra pessoa)
        const n = await gravaT("inventarioMeta", S.cliId, (r) => {
          const m = clone(r || S.meta || novo);
          mod && mod(m);
          m.resumo = resumo(S.inv, m, S.aces);
          return m;
        });
        if (n) S.meta = n;
        return !!n;
      }
      /* ---- causas e problemas ----
         CAUSA = tipo de falha (lista fixa, igual em todos os clientes; a mesma lista está no diário).
         PROBLEMA = o caso real de um cliente ("Fibra 01 – ETE"), guardado em inventarioMeta.problemas;
         as pendências apontam para ele (pendencia.problemaId) e cada uma tem a sua causa (pendencia.causa). */
      const CAUSAS = [
        ["diag", "—", "A diagnosticar", ""],
        ["fibra", "Infraestrutura de rede", "Fibra rompida", "contrato"],
        ["cabo", "Infraestrutura de rede", "Cabo de rede rompido", "contrato"],
        ["switch", "Infraestrutura de rede", "Switch / PoE com defeito", "contrato"],
        ["radio", "Infraestrutura de rede", "Rádio / antena", "contrato"],
        ["conector", "Infraestrutura de rede", "Conector / patch cord", "contrato"],
        ["alim", "Energia", "Falta de alimentação", "contrato"],
        ["fonte", "Energia", "Fonte queimada", "contrato"],
        ["nobreak", "Energia", "Nobreak / estabilizador", "contrato"],
        ["disjuntor", "Energia", "Disjuntor desarmado", "contrato"],
        ["defeito", "Dispositivo", "Dispositivo com defeito (troca)", "controller"],
        ["lente", "Dispositivo", "Lente / visão comprometida", "controller"],
        ["ip", "Configuração", "IP em conflito / rede", "controller"],
        ["senha", "Configuração", "Senha / usuário", "controller"],
        ["firmware", "Configuração", "Firmware", "controller"],
        ["canal", "Configuração", "Canal mal configurado no NVR", "controller"],
        ["hd", "Gravação", "HD cheio ou com defeito", "controller"],
        ["nvr", "Gravação", "NVR / DVR travado ou com defeito", "controller"],
        ["obra", "Externo", "Obra no local", "cliente"],
        ["desligado", "Externo", "Desligado pelo cliente", "cliente"],
        ["vandal", "Externo", "Vandalismo", "cliente"],
        ["removido", "Externo", "Dispositivo removido", "cliente"],
        ["outro", "Outros", "Outro", ""],
      ].map(([id, g, n, r]) => ({ id, g, n, r }));
      const RESP = { controller: "Controller", cliente: "Cliente", contrato: "Conforme contrato" };
      const causaDe = (id) => CAUSAS.find((c) => c.id === id) || CAUSAS[0];
      const optCausas = (sel, vazio) =>
        (vazio ? `<option value="">${esc(vazio)}</option>` : "") +
        [...new Set(CAUSAS.map((c) => c.g))]
          .map((g) => (g === "—" ? CAUSAS.filter((c) => c.g === g).map((c) => `<option value="${c.id}"${c.id === sel ? " selected" : ""}>${esc(c.n)}</option>`).join("") : `<optgroup label="${esc(g)}">${CAUSAS.filter((c) => c.g === g).map((c) => `<option value="${c.id}"${c.id === sel ? " selected" : ""}>${esc(c.n)}</option>`).join("")}</optgroup>`))
          .join("");
      const problemas = () => ((S.meta && S.meta.problemas) || []).filter((x) => !x.excluido);
      const probDe = (id) => problemas().find((x) => x.id === id);
      const ST_PROB = { aberto: "Aberto", andamento: "Em andamento", resolvido: "Resolvido" };
      // dispositivos afetados por um problema: os das pendências ligadas a ele + os que recebem rede do local (quadro) e estão sem rede
      function afetadosDo(pr) {
        const todos = Object.entries(S.inv).flatMap(([sis, d]) => (d.itens || []).map((it) => ({ sis, it })));
        const ids = new Set((S.pend || []).filter((p) => p.problemaId === pr.id && (p.aberta || pr.status === "resolvido")).map((p) => p.dispId).filter(Boolean));
        const loc = pr.localId && todos.find((x) => x.it.id === pr.localId);
        if (loc) {
          ids.add(loc.it.id);
          if (ehQuadro(loc.it)) ligadosAo(S.inv, loc.it).forEach((x) => (pr.status === "resolvido" || SEM_REDE.includes(x.it.status)) && ids.add(x.it.id));
        }
        return todos.filter((x) => ids.has(x.it.id));
      }
      // grava causa/problema numa pendência (do diário), com registro no histórico
      async function gravaCausa(p, causa, problemaId) {
        const novo = { ...p };
        const alt = [];
        if (causa !== undefined && (p.causa || "") !== causa) {
          alt.push({ c: "Causa", de: p.causa ? causaDe(p.causa).n : "", para: causa ? causaDe(causa).n : "" });
          novo.causa = causa;
        }
        if (problemaId !== undefined && (p.problemaId || "") !== problemaId) {
          alt.push({ c: "Problema", de: p.problemaId ? (probDe(p.problemaId) || {}).nome || "" : "", para: problemaId ? (probDe(problemaId) || {}).nome || "" : "" });
          novo.problemaId = problemaId;
          novo.problemaNome = problemaId ? (probDe(problemaId) || {}).nome || "" : "";
          if (problemaId && (!novo.causa || novo.causa === "diag")) novo.causa = (probDe(problemaId) || {}).causa || novo.causa;
        }
        if (!alt.length) return false;
        const d0 = new Date();
        novo.historico = [...(p.historico || []), { data: hoje(), hora: `${pad(d0.getHours())}:${pad(d0.getMinutes())}`, ts: Date.now(), status: "Atualizada", por: meuNome() + " (inventário)", alt }];
        await DB.set("pendencias", p.id, novo);
        return true;
      }

      /* ---- dispositivo OFFLINE vira pendência no diário ----
         uma pendência aberta por dispositivo; só o básico (dispositivo, tipo, problema). Ações, diagnóstico e solução
         ficam em branco para quem for atender preencher no diário. */
      async function abrePendOffline(cli, inv, invTodo = inv) {
        const off = [];
        for (const [sis, d] of Object.entries(inv))
          for (const it of (d && d.itens) || []) {
            if (!SEM_REDE.includes(it.status)) continue; // só OFFLINE e FALHA; VAZIO (canal vazio) não abre pendência
            off.push([sis, it]);
          }
        if (!off.length) return 0;
        const f = cli.equipeId ? { clienteId: cli.id, equipeId: cli.equipeId } : { clienteId: cli.id };
        const todasP = await DB.list("pendencias", f);
        const abertas = todasP.filter((p) => p.aberta && !p.desconsiderada); // desconsiderada é reaberta abaixo, não duplicada
        const ja = new Set(abertas.map((p) => p.dispId).filter(Boolean));
        const jaTag = new Set(abertas.filter((p) => !p.dispId).map((p) => semAcento(p.titulo || "").toUpperCase().trim()).filter(Boolean));
        const d0 = new Date(),
          hora = `${pad(d0.getHours())}:${pad(d0.getMinutes())}`;
        let n = 0;
        for (const [sis, it] of off) {
          if (ja.has(it.id) || (it.tag && jaTag.has(semAcento(it.tag).toUpperCase().trim()))) continue;
          const tId = tipoCatDe(sis, it),
            t = tipoCat(tId);
          // problema aberto no próprio dispositivo ou no quadro de onde ele recebe rede
          const qd = quadroDoItem(invTodo, it);
          const pr = problemas().find((x) => x.status !== "resolvido" && (x.localId === it.id || (qd && SEM_REDE.includes(qd.it.status) && x.localId === qd.it.id)));
          // pendência desconsiderada antes (dispositivo estava VAZIO): reabre a mesma, mantendo o histórico
          const des = todasP.find((p) => p.desconsiderada && p.dispId === it.id);
          if (des) {
            const d1 = new Date();
            const q2 = { ...des, aberta: true, desconsiderada: false, dispStatus: it.status, dispAplicado: `${it.id}|${it.status}`, titulo: it.tag || des.titulo, dispTag: it.tag || "" };
            delete q2.desconsideradaEm;
            delete q2.desconsideradaPor;
            if (pr && !q2.problemaId) Object.assign(q2, { problemaId: pr.id, problemaNome: pr.nome, causa: q2.causa && q2.causa !== "diag" ? q2.causa : pr.causa });
            q2.historico = [...(des.historico || []), { data: hoje(), hora: `${pad(d1.getHours())}:${pad(d1.getMinutes())}`, ts: Date.now(), status: "Reaberta", por: meuNome() + ` (inventário: dispositivo ${it.status})` }];
            await DB.set("pendencias", des.id, q2);
            ja.add(it.id);
            n++;
            continue;
          }
          const id = uid();
          await DB.set("pendencias", id, {
            id,
            clienteId: cli.id,
            equipeId: cli.equipeId || "",
            criadaPorId: (S.user && S.user.uid) || "",
            criadaPorNome: meuNome(),
            criada: hoje(),
            origem: "inventário",
            titulo: it.tag || it.id,
            tipoId: t ? tId : "",
            sis: t ? t.sis : sisCat(sis),
            eqId: "",
            problema: ehQuadro(it)
              ? `Quadro de distribuição sem rede (${it.status})${it.obs ? " · " + it.obs : ""}. Afeta os dispositivos ligados a este quadro.`
              : `Dispositivo ${it.status} no inventário${it.nvr ? ` (${it.nvr}${it.canal ? " canal " + it.canal : ""})` : ""}${it.ip ? " · IP " + it.ip : ""}${qd && SEM_REDE.includes(qd.it.status) ? ` · recebe rede do ${qd.it.tag}, que está sem rede` : ""}`,
            diag: "",
            acoes: [],
            solucao: "",
            obs: "",
            texto: "",
            status: "",
            aberta: true,
            dispId: it.id,
            dispSis: sis,
            dispTag: it.tag || "",
            dispIp: it.ip || "",
            dispPav: it.pav || "",
            dispStatus: it.status,
            dispAplicado: `${it.id}|${it.status}`,
            causa: pr ? pr.causa : "diag",
            ...(pr ? { problemaId: pr.id, problemaNome: pr.nome } : {}),
            historico: [{ data: hoje(), hora, ts: Date.now(), status: "Aberta", por: meuNome() + ` (inventário: dispositivo ${it.status})` }],
          });
          ja.add(it.id);
          n++;
        }
        if (n) audita("abriu pendências de dispositivos offline", "pendencias", cli.id, `${cli.unidade || ""} · ${n} pendência(s)`);
        return n;
      }
      // pendências abertas automaticamente (sem nada preenchido) de dispositivos que agora dependem de um quadro sem rede: concluídas como "agrupadas"
      async function agrupaNoQuadro(cli, devs, qTag) {
        if (!devs.length) return 0;
        const f = cli.equipeId ? { clienteId: cli.id, equipeId: cli.equipeId } : { clienteId: cli.id };
        const ids = new Set(devs.map((d) => d.id));
        const vazio = (p) => !String(p.diag || "").trim() && !String(p.solucao || "").trim() && !String(p.obs || "").trim() && !String(p.texto || "").trim() && !(p.acoes || []).length;
        const L = (await DB.list("pendencias", f)).filter((p) => p.aberta && ids.has(p.dispId) && p.origem === "inventário" && vazio(p));
        const d0 = new Date(),
          hora = `${pad(d0.getHours())}:${pad(d0.getMinutes())}`;
        for (const p of L) {
          Object.assign(p, { aberta: false, concluidaEm: hoje(), concluidaPorId: (S.user && S.user.uid) || "", concluidaPorNome: meuNome(), solucao: `Agrupada na pendência do quadro ${qTag} (o quadro está sem rede).` });
          p.historico = [...(p.historico || []), { data: hoje(), hora, ts: Date.now(), status: "Concluída", por: meuNome() + " (agrupada no quadro " + qTag + ")" }];
          await DB.set("pendencias", p.id, p);
        }
        if (L.length) audita("agrupou pendências no quadro", "pendencias", cli.id, `${cli.unidade || ""} · ${qTag} · ${L.length}`);
        return L.length;
      }
      // dispositivo VAZIO (canal sem câmera) não tem pendência: as pendências automáticas dele são DESCONSIDERADAS
      // (não contam como concluídas e somem das listas; se o dispositivo voltar a OFFLINE/FALHA, a mesma pendência é reaberta).
      // Concluir pendência é só no diário.
      async function fechaPendVazio(cli, devs) {
        if (!devs.length) return 0;
        const f = cli.equipeId ? { clienteId: cli.id, equipeId: cli.equipeId } : { clienteId: cli.id };
        const ids = new Set(devs.map((d) => d.id));
        const L = (await DB.list("pendencias", f)).filter((p) => p.aberta && ids.has(p.dispId) && p.origem === "inventário");
        const d0 = new Date(),
          hora = `${pad(d0.getHours())}:${pad(d0.getMinutes())}`;
        for (const p of L) {
          Object.assign(p, { aberta: false, desconsiderada: true, desconsideradaEm: hoje(), desconsideradaPor: meuNome(), dispStatus: "VAZIO", dispAplicado: `${p.dispId}|VAZIO` });
          p.historico = [...(p.historico || []), { data: hoje(), hora, ts: Date.now(), status: "Desconsiderada", por: meuNome() + " (inventário: dispositivo VAZIO)" }];
          await DB.set("pendencias", p.id, p);
        }
        if (L.length) audita("desconsiderou pendências de dispositivos vazios", "pendencias", cli.id, `${cli.unidade || ""} · ${L.length}`);
        return L.length;
      }
      // pendências abertas dos dispositivos que recebem rede de um quadro com problema aberto passam a apontar para esse problema
      async function ligaAoProblemaDoQuadro(q, devs) {
        const pr = problemas().find((x) => x.status !== "resolvido" && x.localId === q.id);
        if (!pr || !devs.length) return 0;
        const ids = new Set(devs.map((d) => d.id));
        let n = 0;
        for (const p of (S.pend || []).filter((p) => p.aberta && !p.problemaId && ids.has(p.dispId))) if (await gravaCausa(p, pr.causa, pr.id)) n++;
        return n;
      }
      // quadro voltou: os dispositivos ligados a ele que estavam sem rede voltam para ONLINE
      async function cascataQuadro(q) {
        const lig = ligadosAo(S.inv, q).filter((x) => SEM_REDE.includes(x.it.status));
        const sists = new Set();
        lig.forEach(({ sis, it }) => {
          const doc = S.inv[sis],
            n = doc.itens.find((i) => i.id === it.id);
          n.statusOrigem = { titulo: "Quadro " + (q.tag || q.id) + " voltou", antes: n.status, depois: "ONLINE", em: agora(), por: meuNome() };
          n.status = "ONLINE";
          n.alteradoEm = agora();
          n.alteradoPor = meuNome();
          sists.add(sis);
        });
        for (const sis of sists) await salvaSistema(sis);
        return lig.length;
      }
      // guarda o que já foi digitado no formulário de dispositivo novo (antes de redesenhar a tela)
      function leNovo() {
        if (!S.novo) return;
        ["tipo", "tag", "ip", "pav", "nvr", "canal", "laco", "modelo", "fabricante", "login", "senha", "obs", "quadro", "status"].forEach((k) => {
          const el = document.getElementById("n_" + k);
          if (el) S.novo[k] = el.value;
        });
      }
      async function salvaSistema(sis, aces) {
        const doc = clone(S.inv[sis]);
        doc.atualizadoEm = agora();
        doc.atualizadoPor = meuNome();
        S.inv[sis] = doc;
        const bI = S.base["inventario/" + doc.id];
        const n = await gravaT("inventario", doc.id, (r) => mescla3(bI, doc, r, "itens"));
        const ok = !!n;
        if (ok) {
          (n.itens || []).forEach((it) => it.status && (it.status = normSt(it.status)));
          S.inv[sis] = n;
          S.base["inventario/" + doc.id] = clone(n);
        }
        if (ok && aces) {
          const A = clone(S.aces[sis]);
          const bA = S.base["inventarioAcessos/" + A.id];
          const nA = await gravaT("inventarioAcessos", A.id, (r) => mescla3(bA, A, r, null, ["acessos", "centrais"]));
          if (nA) {
            S.aces[sis] = nA;
            S.base["inventarioAcessos/" + A.id] = clone(nA);
          }
        }
        if (ok) await salvaMeta((m) => {
          m.atualizadoEm = agora();
          m.atualizadoPor = meuNome();
        });
        return ok;
      }
      function leAcessosDoForm(sis, id) {
        const a = clone(((S.aces[sis] || {}).acessos || {})[id] || {});
        let mudou = false;
        ACESSO.forEach((k) => {
          const el = $("#e_" + k);
          if (el && (a[k] || "") !== el.value.trim()) {
            a[k] = el.value.trim();
            mudou = true;
          }
        });
        return [a, mudou];
      }
      function garanteAces(sis) {
        if (!S.aces[sis]) {
          const d = S.inv[sis];
          S.aces[sis] = { id: d.id, clienteId: d.clienteId, equipeId: d.equipeId, sistema: sis, acessos: {}, centrais: {} };
        }
        S.aces[sis] = clone(S.aces[sis]);
        S.aces[sis].acessos = S.aces[sis].acessos || {};
      }

      const ACOES = {
        menuT() {
          S.menuAb = !S.menuAb;
          render();
        },
        sair,
        diario() {
          location.href = "index.html";
        },
        abreCli(el) {
          abreCliente(el.dataset.id);
        },
        impCli(el) {
          S.imp = { cliId: el.dataset.id, nome: "", res: null, erro: "", salvando: false };
          go("importar");
        },
        mais() {
          S.lim += 300;
          render();
        },
        centT(el, ev) {
          setTimeout(() => (S.centAb = el.open), 0);
        },
        abreItem(el) {
          S.aberto = S.aberto === el.dataset.id ? "" : el.dataset.id;
          render();
        },
        fechaItem() {
          S.aberto = "";
          render();
        },
        vaiItem(el) {
          const id = el.dataset.id;
          const sis = Object.keys(S.inv).find((s) => (S.inv[s].itens || []).some((i) => i.id === id));
          if (!sis) return;
          Object.assign(S, { aba: sis, aberto: id, fBusca: id, fPav: "", fSt: "", fAl: false, fSp: false });
          render(false);
        },
        verSenha(el) {
          const id = el.dataset.id;
          S.vistas[id] = !S.vistas[id];
          if (S.vistas[id]) audita("viu senha", "inventarioAcessos", S.cliId, `${cliNome(S.cliId)} · ${S.aba} · ${id.replace(/^e_|^cs_/, "")} ${S.aberto || ""}`);
          // mantém o que foi digitado no formulário aberto
          const vals = {};
          document.querySelectorAll(".det input, .det select, .det textarea").forEach((x) => (vals[x.id] = x.value));
          render();
          Object.entries(vals).forEach(([k, v]) => {
            const x = document.getElementById(k);
            if (x) x.value = v;
          });
        },
        filtraCausa(el) {
          S.fCausa = S.fCausa === el.dataset.c ? "" : el.dataset.c;
          render();
        },
        pSelTodas() {
          const f = S.fPend || "aberta",
            fc = S.fCausa || "",

              delete n.verificado;
              delete n.verificadoPor;
            }
          }
          if (n.statusOrigem && n.status !== stAntes) delete n.statusOrigem; // situação trocada aqui no inventário
          n.alteradoEm = agora();

              // TAG mudou: as pendências abertas do dispositivo passam a mostrar a TAG nova (e o título, se era a TAG antiga)
              if ((n.tag || "") !== tagAntes) {
                let k = 0;
                for (const p of (S.pend || []).filter((x) => x.aberta && x.dispId === n.id)) {
                  const q = { ...p, dispTag: n.tag || "" };

              if (n.status === "VAZIO" && stAntes !== "VAZIO" && (await fechaPendVazio(cli, [n]))) msg.push("pendência desconsiderada (vazio)");
              // ligado a um quadro sem rede que tem problema aberto: a pendência do dispositivo é ligada a esse problema
              const q = quadroDoItem(S.inv, n);

                if (["ONLINE", "OPERANDO"].includes(n.status) && SEM_REDE.includes(stAntes) && semRede && confirm(`O quadro ${n.tag} voltou (${n.status}).\n\nMarcar também como ONLINE os ${semRede} dispositivo(s) ligados a ele que estão sem rede?`)) msg.push((await cascataQuadro(n)) + " dispositivo(s) voltaram para ONLINE");
              }
            } catch (e) {
              console.warn(e);
              msg.push("(não consegui mexer nas pendências: " + (e.code || e.message) + ")");
            }
            toast(msg.join(" · "));
          }
        },

            }));

            const eqId = cli.equipeId || "";

            const antigos = {},
              antAces = {};
            for (const d of await DB.list("inventario", { clienteId: cli.id })) antigos[d.sistema] = d;
            for (const d of await DB.list("inventarioAcessos", { clienteId: cli.id })) antAces[d.sistema] = d;

            const inv = montaInventario(I.res, antigos, antAces, juntar);
            const novoAces = {};
            const novoInv = {};
            for (const [sis, itens] of Object.entries(inv)) {
              const id = docId(cli.id, sis);
              const blocos = I.res.centrais[sis] || {};
              const manterCentrais = juntar && !Object.keys(blocos).length && antigos[sis];
              const pub = [],
                sens = {};
              for (const [nome, campos] of Object.entries(blocos)) {
                if (nome.startsWith("CENTRAL ")) {
                  if (campos.length) sens[nome] = campos;
                  continue;
                }
                const p = campos.filter(([k]) => !RE_SENHA.test(k)),
                  s = campos.filter(([k]) => RE_SENHA.test(k));
                pub.push({ nome, campos: p });
                if (s.length) sens[nome] = s;
              }
              Object.keys(sens).forEach((nome) => {
                if (!pub.some((c) => c.nome === nome)) pub.push({ nome, campos: [] });
              });
              const acessos = {};
              const limpos = itens.map((it) => {
                const a = {};
                ACESSO.forEach((k) => {
                  if (it[k]) a[k] = it[k];
                });
                if (it.outros && it.outros.length) a.outros = it.outros;
                if (Object.keys(a).length) acessos[it.id] = a;
                const n = { ...it };
                // planilha marcada como conferida: a senha já entra confirmada

                  n.verificado = agoraIso();
                  n.verificadoPor = meuNome() + " (planilha conferida)";
                }
                ACESSO.forEach((k) => delete n[k]);
                delete n.outros;
                if (n.detalhes && !n.detalhes.length) delete n.detalhes;
                return n;
              });
              const fab = Object.entries(limpos.reduce((o, i) => ((o[i.fabricante] = (o[i.fabricante] || 0) + (i.fabricante ? 1 : 0)), o), {})).sort((a, b) => b[1] - a[1])[0];
              novoInv[sis] = { id, clienteId: cli.id, equipeId: eqId, sistema: sis, fabricante: fab ? fab[0] : "", itens: limpos, centrais: manterCentrais ? antigos[sis].centrais || [] : pub, atualizadoEm: agora(), atualizadoPor: meuNome() };
              await DB.set("inventario", id, novoInv[sis]);
              novoAces[sis] = { id, clienteId: cli.id, equipeId: eqId, sistema: sis, acessos, centrais: manterCentrais ? (antAces[sis] && antAces[sis].centrais) || {} : sens };
              await DB.set("inventarioAcessos", id, novoAces[sis]);
            }
            for (const sis of juntar ? [] : Object.keys(antigos))
              if (!novoInv[sis]) {
                await DB.del("inventario", antigos[sis].id);
                await DB.del("inventarioAcessos", antigos[sis].id).catch(() => {});
              }
            const meta = {
              id: cli.id,
              clienteId: cli.id,
              clienteNome: cli.unidade || "",
              equipeId: eqId,
              versao: ((meta0 && meta0.versao) || 0) + 1,
              origem: juntar && meta0 && meta0.origem ? `${meta0.origem} + ${I.nome}` : I.nome,
              nomeNaPlanilha: I.res.cliente || (meta0 && meta0.nomeNaPlanilha) || "",
              importadoEm: agora(),

              importAlertas: [...new Map([...(juntar ? (meta0 && meta0.importAlertas) || [] : []), ...I.res.importAlertas].map((x) => [x.chave, x])).values()],
              equivalencias: juntar ? [...((meta0 && meta0.equivalencias) || []), ...I.res.equivalencias] : I.res.equivalencias,
              decisoes: (meta0 && meta0.decisoes) || {},
              legenda: (meta0 && meta0.legenda) || {},
            };
            meta.resumo = resumo(novoInv, meta, novoAces);
            await DB.set("inventarioMeta", cli.id, meta);
            audita("importou inventário", "inventarioMeta", cli.id, `${cli.unidade} · v${meta.versao} · ${I.nome} · ${meta.resumo.total} dispositivos${I.conferidas ? " · senhas marcadas como conferidas" : ""}`);
            let nPend = 0;

            } catch (e) {

            S.imp = { cliId: "", nome: "", res: null, erro: "", salvando: false };

      /* cria tipos novos no Catálogo do diário e já liga os tipos da planilha a eles */
      async function criaTipos(chaves) {
        const nomes = {},
          perfisNovos = {};
        for (const k of chaves) {
          const el = document.querySelector(`[data-novo="${CSS.escape(k)}"]`),
            ep = document.querySelector(`[data-novopf="${CSS.escape(k)}"]`);
          const n = txt(el ? el.value : "");
          if (!n) return toast("Preencha o nome do tipo novo");
          nomes[k] = n;
          perfisNovos[k] = txt(ep ? ep.value : "") || "Padrão";
        }
        const ppNovo = {};
        try {
          const cat = (await DB.get("catalogo", "dados")) || { id: "dados", sis: [], tipos: [] }; // lê o mais recente antes de gravar
          cat.tipos = cat.tipos || [];
          const cfg = clone(S.icfg || { id: "geral" });
          cfg.id = "geral";
          cfg.mapa = cfg.mapa || {};
          let novos = 0,
            ligados = 0;
          for (const [k, nome] of Object.entries(nomes)) {
            const sis = k.split("|")[0],
              sigla = sisCat(sis);
            const igual = cat.tipos.find((t) => t.sis === sigla && semAcento(t.nome).toUpperCase() === semAcento(nome).toUpperCase());
            const pfNome = perfisNovos[k];
            let id;
            if (igual) {
              // tipo já existe: usa o perfil com esse nome ou acrescenta um perfil novo nele
              id = igual.id;
              igual.perfis = igual.perfis || [];
              let i = igual.perfis.findIndex((p) => semAcento(p.nome).toUpperCase() === semAcento(pfNome).toUpperCase());
              if (i < 0) {
                igual.perfis.push({ nome: pfNome, atv: ATV_PADRAO.slice() });
                i = igual.perfis.length - 1;
                novos++;
              }
              ppNovo[id] = i;
            } else {
              id = uid();
              cat.tipos.push({ id, sis: sigla, nome, extra: /^NVR\b/i.test(nome) ? "dias" : "", perfis: [{ nome: pfNome, atv: ATV_PADRAO.slice() }], criadoPor: "inventário", criadoEm: agora() });
              ppNovo[id] = 0;
              novos++;
            }
            cfg.mapa[k] = id;
            ligados++;
          }
          if (novos && !(await grava("catalogo", "dados", cat))) return;
          cfg.atualizadoEm = agora();
          cfg.atualizadoPor = meuNome();
          if (!(await grava("inventarioConfig", "geral", cfg))) return;
          S.cat = cat;
          S.icfg = cfg;
          chaves.forEach((k) => {
            if (S.catEd && S.catEd.mapa) delete S.catEd.mapa[k];
          });
          audita("criou tipos no catálogo", "catalogo", "dados", `${cliNome(S.cliId)} · ${Object.values(nomes).join(", ")}`.slice(0, 300));
          await salvaMeta((m) => (m.perfilPadrao = { ...(m.perfilPadrao || {}), ...ppNovo }));
          toast(`${novos} criado${novos === 1 ? "" : "s"} no catálogo · ${ligados} tipo${ligados === 1 ? "" : "s"} ligado${ligados === 1 ? "" : "s"}`);
          render();
        } catch (e) {
          console.error(e);
          toast(e.code === "permission-denied" ? "Sem permissão para alterar o Catálogo (regras do Firestore)." : "Não consegui criar: " + (e.code || e.message));
        }
      }

      /* leitura do arquivo escolhido na importação */
      async function leArquivo(f) {
        const I = S.imp;
        I.erro = "";
        I.res = null;
        I.nome = f.name;
        render();
        try {
          if (typeof XLSX === "undefined") throw new Error("a biblioteca do Excel não carregou (confira a internet)");
          const buf = await f.arrayBuffer();
          const wbx = XLSX.read(buf, { type: "array" });
          const res = lerPlanilha(wbx);
          if (!Object.keys(res.sistemas).length) throw new Error("não achei abas de sistema (CFTV, SCA, SAI, SDAI, AUTOMAÇÃO, SONORIZAÇÃO)");
          const meta0 = S.metas.find((m) => m.clienteId === I.cliId);
          const antigos = {},
            antAces = {};
          if (meta0) {
            for (const d of await DB.list("inventario", { clienteId: I.cliId })) antigos[d.sistema] = d;
            for (const d of await DB.list("inventarioAcessos", { clienteId: I.cliId })) antAces[d.sistema] = d;
          }
          I.antigos = antigos;
          I.antAces = antAces;
          if (!meta0) I.modo = "substituir";
          else if (!I.modo) I.modo = "juntar";
          res.inv = montaInventario(res, antigos, antAces, I.modo === "juntar");
          I.res = res;
          if (!I.cliId) {
            const alvo = semAcento(res.cliente).toUpperCase().replace(/^ED\.?\s*/, "").replace(/[^A-Z0-9]/g, "");
            const c = S.clientes.find((c) => alvo && semAcento(c.unidade).toUpperCase().replace(/[^A-Z0-9]/g, "").includes(alvo));
            if (c) I.cliId = c.id;
          }
        } catch (e) {
          console.error(e);
          I.erro = "Não consegui ler a planilha: " + e.message;
        }
        render();
      }

      document.addEventListener("click", (ev) => {
        const v = ev.target.closest("[data-v]");
        if (v) {
          ev.preventDefault();
          return go(v.dataset.v);
        }
        const ab = ev.target.closest("[data-aba]");
        if (ab) {
          Object.assign(S, { aba: ab.dataset.aba, aberto: "", fBusca: "", fPav: "", fSt: "", fAl: false, fSp: false, lim: 200, selSen: {} });
          return render(false);
        }
        const a = ev.target.closest("[data-a]");
        if (!a || a.tagName === "SELECT" || a.tagName === "DETAILS") return;
        const fn = ACOES[a.dataset.a];
        if (fn) {
          if (a.tagName === "A" || a.tagName === "BUTTON") ev.preventDefault();
          ev.stopPropagation();
          fn(a, ev);
        }
      });
      document.addEventListener("toggle", (ev) => {
        if (ev.target.matches && ev.target.matches('details[data-a="centT"]')) S.centAb = ev.target.open;
        if (ev.target.matches && ev.target.matches("details[data-g]")) (S.grAb = S.grAb || {})[ev.target.dataset.g] = ev.target.open;
        if (ev.target.matches && ev.target.matches("details[data-cab]") && S.criaCat) S.criaCat.ab[ev.target.dataset.cab] = ev.target.open;
      }, true);
      let tBusca = null;
      document.addEventListener("input", (ev) => {
        if (ev.target.dataset && ev.target.dataset.novo !== undefined) {
          S.catEd = S.catEd || { mapa: {}, selecao: {}, pp: {} };
          (S.catEd.novo = S.catEd.novo || {})[ev.target.dataset.novo] = ev.target.value;
          return;
        }
        if (ev.target.dataset && ev.target.dataset.novopf !== undefined) {
          S.catEd = S.catEd || { mapa: {}, selecao: {}, pp: {} };
          (S.catEd.novoPf = S.catEd.novoPf || {})[ev.target.dataset.novopf] = ev.target.value;
          return;
        }
        if (ev.target.dataset && ev.target.dataset.cc && S.criaCat) {
          const d = ev.target.dataset;
          if (d.cc === "eq") S.criaCat.eqs[d.t] = ev.target.checked;
          else S.criaCat[d.cc][d.t] = ev.target.value;
          const bt = document.querySelector("[data-a=criaCatSalva]");
          if (bt) {
            const C = S.criaCat,
              tot = Object.values(C.qtd).reduce((a, n) => a + (+n || 0), 0) + Object.values(C.eqs).filter(Boolean).length;
            bt.textContent = `Criar ${tot} dispositivo(s)`;
            bt.disabled = !tot;
          }
          return;

      const XC = {

      const argb = (h) => "FF" + h.replace("#", "");
      const xFill = (h) => ({ type: "pattern", pattern: "solid", fgColor: { argb: argb(h) } });

      const xBorda = { top: { style: "thin", color: { argb: "FFD9D9D9" } }, left: { style: "thin", color: { argb: "FFD9D9D9" } }, bottom: { style: "thin", color: { argb: "FFD9D9D9" } }, right: { style: "thin", color: { argb: "FFD9D9D9" } } };

      /* ---- gráficos desenhados num canvas (viram imagem no Excel) ---- */
      function grafico(o) {
        const W = o.w || 640,
          H = o.h || 300,
          cv = document.createElement("canvas");
        cv.width = W * 2;
        cv.height = H * 2;
        const g = cv.getContext("2d");
        g.scale(2, 2);
        g.fillStyle = "#fff";
        g.fillRect(0, 0, W, H);
        g.strokeStyle = "#D9D9D9";
        g.strokeRect(0.5, 0.5, W - 1, H - 1);
        g.fillStyle = "#262626";
        g.font = "bold 14px Arial";
        g.textAlign = "center";
        g.fillText(o.titulo, W / 2, 24);
        const cats = o.cats,
          series = o.series.filter((s) => s.vals.length);
        const temLeg = series.length > 1;
        if (temLeg) {
          g.font = "11px Arial";
          const itens = series.map((s) => [s, g.measureText(s.nome).width + 26]);
          let x = W / 2 - itens.reduce((a, b) => a + b[1], 0) / 2;
          itens.forEach(([s, w]) => {
            g.fillStyle = s.cor;
            g.fillRect(x, H - 19, 10, 10);
            g.fillStyle = "#404040";
            g.textAlign = "left";
            g.fillText(s.nome, x + 14, H - 10);
            x += w;
          });
        }
        if (!cats.length) {
          g.fillStyle = "#7F7F7F";
          g.font = "12px Arial";
          g.textAlign = "center";
          g.fillText("Sem dados", W / 2, H / 2);
          return cv.toDataURL("image/png").split(",")[1];
        }
        const tot = cats.map((_, i) => series.reduce((a, s) => a + (s.vals[i] || 0), 0));
        const bruto = Math.max(1, ...(o.empilhado ? tot : series.flatMap((s) => s.vals)));
        const passo = Math.max(1, Math.ceil(bruto / 4)); // marcas inteiras no eixo (0, 1, 2… ou 0, 5, 10…)
        const max = o.pct ? 1 : passo * 4;
        const val = (s, i) => (o.pct ? (tot[i] ? (s.vals[i] || 0) / tot[i] : 0) : s.vals[i] || 0);
        const top = 40,
          bot = temLeg ? 32 : 14;
        g.font = "11px Arial";
        if (o.horiz) {
          const lw = Math.min(210, Math.max(...cats.map((c) => g.measureText(c).width)) + 12);
          const L0 = lw + 8,
            R0 = W - 36,
            pw = R0 - L0,
            ph = H - top - bot,
            band = ph / cats.length,
            bh = Math.min(26, band * 0.66);
          g.strokeStyle = "#EDEDED";
          g.fillStyle = "#7F7F7F";
          g.textAlign = "center";
          for (let k = 0; k <= 4; k++) {
            const x = L0 + (pw * k) / 4;
            g.beginPath();
            g.moveTo(x, top);
            g.lineTo(x, top + ph);
            g.stroke();
            if (o.pct) g.fillText(k * 25 + "%", x, top - 4);
          }
          cats.forEach((c, i) => {
            const y = top + i * band + (band - bh) / 2;
            g.fillStyle = "#404040";
            g.textAlign = "right";
            let t = c;
            while (g.measureText(t).width > lw - 6 && t.length > 4) t = t.slice(0, -2);
            g.fillText(t === c ? c : t + "…", L0 - 6, y + bh / 2 + 4);
            let x = L0;
            const gw = o.empilhado || o.pct ? bh : bh / series.length;
            series.forEach((s, j) => {
              const w = (val(s, i) / max) * pw;
              g.fillStyle = s.cor;
              if (o.empilhado || o.pct) {
                g.fillRect(x, y, w, bh);
                if (w > 0) {
                  g.fillStyle = "#fff";
                  g.fillRect(x + w - 1, y, 1.5, bh);
                }
                x += w;
              } else {
                g.fillRect(L0, y + j * gw, w, gw - 1);
                if (o.rotulos && s.vals[i]) {
                  g.fillStyle = "#262626";
                  g.textAlign = "left";
                  g.font = "bold 11px Arial";
                  g.fillText(String(s.vals[i]), L0 + w + 4, y + j * gw + gw / 2 + 4);
                  g.font = "11px Arial";
                }
              }
            });
            if ((o.empilhado && !o.pct) && o.rotulos && tot[i]) {
              g.fillStyle = "#262626";
              g.textAlign = "left";
              g.font = "bold 11px Arial";
              g.fillText(String(tot[i]), x + 4, y + bh / 2 + 4);
              g.font = "11px Arial";
            }
          });
        } else {
          const L0 = 40,
            R0 = W - 14,
            pw = R0 - L0,
            rot = cats.length > 10,
            ph = H - top - bot - (rot ? 46 : 18),
            band = pw / cats.length,
            bw = Math.min(46, band * 0.66);
          g.strokeStyle = "#EDEDED";
          g.fillStyle = "#7F7F7F";
          g.textAlign = "right";
          for (let k = 0; k <= 4; k++) {
            const y = top + ph - (ph * k) / 4;
            g.beginPath();
            g.moveTo(L0, y);
            g.lineTo(R0, y);
            g.stroke();
            g.fillText(String(passo * k), L0 - 5, y + 4);
          }
          cats.forEach((c, i) => {
            const x0 = L0 + i * band + (band - bw) / 2,
              gw = o.empilhado ? bw : bw / series.length;
            let yb = top + ph;
            series.forEach((s, j) => {
              const h = (val(s, i) / max) * ph;
              g.fillStyle = s.cor;
              if (o.empilhado) {
                g.fillRect(x0, yb - h, bw, h);
                yb -= h;
              } else {
                g.fillRect(x0 + j * gw, top + ph - h, gw - 2, h);
                if (o.rotulos && s.vals[i]) {
                  g.fillStyle = "#262626";
                  g.textAlign = "center";
                  g.font = "bold 10px Arial";
                  g.fillText(String(s.vals[i]), x0 + j * gw + gw / 2 - 1, top + ph - h - 3);
                  g.font = "11px Arial";
                }
              }
            });
            g.fillStyle = "#404040";
            g.font = rot ? "9px Arial" : "11px Arial";
            if (rot) {
              g.save();
              g.translate(x0 + bw / 2, top + ph + 8);
              g.rotate(-Math.PI / 4);
              g.textAlign = "right";
              g.fillText(c, 0, 0);
              g.restore();
            } else {
              g.textAlign = "center";
              g.fillText(c, x0 + bw / 2, top + ph + 14);
            }
            g.font = "11px Arial";
          });
        }
        return cv.toDataURL("image/png").split(",")[1];
      }
      function rosca(titulo, partes, W = 640, H = 300) {
        const cv = document.createElement("canvas");
        cv.width = W * 2;
        cv.height = H * 2;
        const g = cv.getContext("2d");
        g.scale(2, 2);
        g.fillStyle = "#fff";
        g.fillRect(0, 0, W, H);
        g.strokeStyle = "#D9D9D9";
        g.strokeRect(0.5, 0.5, W - 1, H - 1);
        g.fillStyle = "#262626";
        g.font = "bold 14px Arial";
        g.textAlign = "center";
        g.fillText(titulo, W / 2, 24);
        const tot = partes.reduce((a, p) => a + p.val, 0),
          cx = W / 2 - 90,
          cy = 160,
          r = 100;
        let ang = -Math.PI / 2;
        partes.forEach((p) => {
          if (!tot || !p.val) return;
          const a = (p.val / tot) * Math.PI * 2;
          g.beginPath();
          g.moveTo(cx, cy);
          g.arc(cx, cy, r, ang, ang + a);
          g.closePath();
          g.fillStyle = p.cor;
          g.fill();
          g.strokeStyle = "#fff";
          g.lineWidth = 2;
          g.stroke();
          ang += a;
        });
        g.beginPath();
        g.arc(cx, cy, r * 0.6, 0, Math.PI * 2);
        g.fillStyle = "#fff";
        g.fill();
        g.fillStyle = "#262626";
        g.font = "bold 20px Arial";
        g.fillText(String(tot), cx, cy + 4);
        g.font = "11px Arial";
        g.fillStyle = "#7F7F7F";
        g.fillText("dispositivos", cx, cy + 20);
        let y = 110;
        partes.forEach((p) => {
          g.fillStyle = p.cor;
          g.fillRect(cx + 140, y - 10, 12, 12);
          g.fillStyle = "#262626";
          g.textAlign = "left";
          g.font = "12px Arial";
          g.fillText(`${p.nome}: ${p.val} (${tot ? Math.round((p.val / tot) * 100) : 0}%)`, cx + 158, y);
          y += 24;
        });
        return cv.toDataURL("image/png").split(",")[1];
      }

            vence: { formula: `IF(OR(${ref("ab")}="",${ref("prazo")}=""),"",${ref("ab")}+${ref("prazo")})`, result: x && x.vence ? x.vence : "" },
            noPrazo: {
              formula: `IF(${ref("vence")}="","",IF(${ref("sit")}="CONCLUÍDA",IF(${ref("conc")}<=${ref("vence")},"NO PRAZO","ATRASADA"),IF(TODAY()>${ref("vence")},"ATRASADA","NO PRAZO")))`,
              result: x ? x.noPrazo : "",
            },
          };
          pc.forEach(([k], i) => {
            const c = PD.getCell(lin, i + 1);
            c.value = val[k];
            c.border = xBorda;
            c.font = xFont({ bold: k === "sit" || k === "noPrazo" });
            c.alignment = { vertical: "top", wrapText: ["tit", "prob", "sol", "disp"].includes(k), horizontal: ["id", "ab", "pav", "prio", "sit", "conc", "dias", "prazo", "vence", "noPrazo"].includes(k) ? "center" : "left" };
            if (["ab", "conc", "vence"].includes(k)) c.numFmt = "dd/mm/yyyy";
            if (k === "dias" || k === "prazo") c.numFmt = "0";
            if (k === "prio" && p) c.fill = xFill(XC.amarelo);
            else if (p && j % 2) c.fill = xFill(XC.zebra);
          });
        }
        const fimP = 5 + calcP.length + extra - 1;
        const cfSit = (col, pares) =>
          PD.addConditionalFormatting({
            ref: `${col}5:${col}${fimP}`,
            rules: pares.map(([v, [bg, fg]]) => ({ type: "expression", formulae: [`${col}5="${v}"`], style: { fill: { type: "pattern", pattern: "solid", bgColor: { argb: argb(bg) } }, font: { bold: true, color: { argb: argb(fg) } } } })),
          });
        cfSit(PC.sit, [
          ["EM ABERTO", XC.falha],
          ["CONCLUÍDA", XC.ok],
        ]);
        cfSit(PC.noPrazo, [
          ["ATRASADA", XC.falha],
          ["NO PRAZO", XC.ok],
        ]);
        PD.addConditionalFormatting({
          ref: `${PC.dias}5:${PC.dias}${fimP}`,
          rules: [{ type: "expression", formulae: [`AND(${PC.sit}5="EM ABERTO",ISNUMBER(${PC.dias}5),${PC.dias}5>30)`], style: { font: { bold: true, color: { argb: "FFC00000" } } } }],
        });
        lista(PD, `${PC.sit}5:${PC.sit}2000`, ["EM ABERTO", "CONCLUÍDA"]);
        lista(PD, `${PC.prio}5:${PC.prio}2000`, ["ALTA", "MÉDIA", "BAIXA"]);
        // tabela de prazos por prioridade (editável)
        PD.mergeCells("V3:W3");
        PD.getCell("V3").value = "PRAZO POR PRIORIDADE";
        PD.getCell("V3").font = xFont({ bold: true, color: "FFFFFF" });
        PD.getCell("V3").alignment = { horizontal: "center", vertical: "middle" };
        PD.getCell("V3").fill = xFill(XC.cfg);
        PD.getCell("W3").fill = xFill(XC.cfg);
        cab(PD, 4, 22, "Prioridade");
        cab(PD, 4, 23, "Dias");
        SLA_PAD.forEach(([pr, d_], k) => {
          const a_ = PD.getCell(5 + k, 22),
            b_ = PD.getCell(5 + k, 23);
          a_.value = pr;
          b_.value = d_;
          a_.font = xFont({ bold: true });
          b_.fill = xFill(XC.amarelo);
          a_.border = b_.border = xBorda;
          b_.alignment = { horizontal: "center" };
        });
        PD.getCell(9, 22).value = "Mude os dias em amarelo:";
        PD.getCell(10, 22).value = "os prazos se recalculam.";
        // resumo: causas, problemas e os dispositivos de cada um (pendências em aberto; a contagem é fórmula)
        {
          const ab = calcP.filter((x) => x.p.aberta);
          const grupos = new Map();
          ab.forEach((x) => {
            const k = probTxt(x.p);
            const g = grupos.get(k) || { causa: x.p.causa && x.p.causa !== "diag" ? causaDe(x.p.causa).n : "A diagnosticar", prob: x.p.problemaNome || "—", txt: k, tags: [] };
            const d = x.ids.length ? Object.values(S.inv).flatMap((dd) => dd.itens || []).find((i) => i.id === x.ids[0]) : null;
            g.tags.push((d && d.tag) || x.p.dispTag || x.p.titulo || "?");
            grupos.set(k, g);
          });
          const G = [...grupos.values()].sort((a, b) => b.tags.length - a.tags.length);
          const L0 = 13;
          PD.mergeCells(L0, 22, L0, 25);
          const h = PD.getCell(L0, 22);
          h.value = "CAUSAS E PROBLEMAS (EM ABERTO)";
          h.font = xFont({ bold: true, color: "FFFFFF" });
          h.alignment = { horizontal: "center", vertical: "middle" };
          for (let c = 22; c <= 25; c++) PD.getCell(L0, c).fill = xFill(XC.acesso);
          ["Causa", "Problema", "Em aberto", "Dispositivos"].forEach((t, i) => cab(PD, L0 + 1, 22 + i, t));
          G.forEach((g, i) => {
            const r = L0 + 2 + i;
            const cel = [g.causa, g.prob, { formula: `COUNTIFS($${PC.prob}$5:$${PC.prob}$2000,"${g.txt.replace(/"/g, '""')}",$${PC.sit}$5:$${PC.sit}$2000,"EM ABERTO")`, result: g.tags.length }, g.tags.join(", ")];
            cel.forEach((v, k) => {
              const c = PD.getCell(r, 22 + k);
              c.value = v;
              c.border = xBorda;
              c.font = xFont({ bold: k === 2 });
              c.alignment = { vertical: "top", wrapText: true, horizontal: k === 2 ? "center" : "left" };
              if (i % 2) c.fill = xFill(XC.zebra);
            });
          });
          const rt = L0 + 2 + G.length;
          PD.getCell(rt, 22).value = "Total";
          PD.getCell(rt, 22).font = xFont({ bold: true });
          PD.getCell(rt, 24).value = { formula: G.length ? `SUM(X${L0 + 2}:X${rt - 1})` : "0", result: ab.length };
          PD.getCell(rt, 24).font = xFont({ bold: true });
          PD.getCell(rt, 24).alignment = { horizontal: "center" };
          for (let c = 22; c <= 25; c++) {
            PD.getCell(rt, c).fill = xFill("D9D9D9");
            PD.getCell(rt, c).border = xBorda;
          }
          PD.getColumn(23).width = 28;
          PD.getColumn(24).width = 10;
          PD.getColumn(25).width = 60;
        }
        PD.getCell(11, 22).value = "O diário ainda não tem prioridade;";
        PD.getCell(12, 22).value = "todas entram como MÉDIA.";
        [9, 10, 11, 12].forEach((l) => (PD.getCell(l, 22).font = xFont({ size: 8, italic: true, color: "7F7F7F" })));
        PD.getColumn(21).width = 3;
        PD.getColumn(22).width = 16;
        PD.getColumn(23).width = Math.max(8, PD.getColumn(23).width || 0);
        if (!calcP.length) PD.getCell(5, 8).value = "Nenhuma pendência registrada no diário para este cliente.";
        PD.autoFilter = { from: { row: 4, column: 1 }, to: { row: Math.max(5, 4 + calcP.length), column: pc.length } };
        PD.pageSetup.printTitlesRow = "4:4";

        /* ---------- Pavimentos (pavimento × sistema) ---------- */
        const PV = nova("Pavimentos", { frz: 7 });
        faixa(PV, 5, 1, sists.length + 2, `${nome.toUpperCase()} | DISPOSITIVOS POR PAVIMENTO`, 14, 28);
        PV.getColumn(1).width = 16;
        cab(PV, 7, 1, "Pavimento");
        sists.forEach((s, i) => {
          cab(PV, 7, i + 2, s);
          PV.getColumn(i + 2).width = 14;
        });
        cab(PV, 7, sists.length + 2, "Total");
        [...pavs, "(sem pavimento)"].forEach((pv, j) => {
          const lin = 8 + j;
          PV.getCell(lin, 1).value = pv;
          PV.getCell(lin, 1).font = xFont({ bold: true });
          PV.getCell(lin, 1).border = xBorda;
          let t = 0;
          sists.forEach((s, i) => {
            const q = (S.inv[s].itens || []).filter((it) => (pv === "(sem pavimento)" ? !it.pav : it.pav === pv)).length;
            t += q;
            const c = PV.getCell(lin, i + 2);
            c.value = q || null;
            c.border = xBorda;
            c.alignment = { horizontal: "center" };
          });
          const c = PV.getCell(lin, sists.length + 2);
          c.value = t;
          c.font = xFont({ bold: true });
          c.border = xBorda;
          c.fill = xFill("F2F2F2");
          c.alignment = { horizontal: "center" };
        });
        PV.addConditionalFormatting({ ref: `B8:${colL(sists.length + 1)}${8 + pavs.length}`, rules: [{ type: "colorScale", cfvo: [{ type: "num", value: 0 }, { type: "max" }], color: [{ argb: "FFFFFFFF" }, { argb: "FF5B9BD5" }] }] });

        /* ---------- Alertas ---------- */
        const AL = nova("Alertas", { frz: 3 });
        const ac2 = [
          ["Situação", 12],
          ["Sistema", 13],
          ["Alerta", 26],
          ["TAG / Item", 30],
          ["Detalhe", 60],
          ["Dispositivos", 26],
          ["Justificativa", 36],
          ["Conferido por", 16],
          ["Data", 11],
        ];
        faixa(AL, 1, 1, ac2.length, "ALERTAS PARA CONFERIR", 12, 24);
        ac2.forEach(([h, w], i) => {
          AL.getColumn(i + 1).width = w;
          cab(AL, 3, i + 1, h);
        });
        al.forEach((a, j) => {
          [a.sit, a.sis, a.tipo, a.tag, a.texto, a.ids.join(", "), a.just, a.por, a.data].forEach((v, i) => {
            const c = AL.getCell(4 + j, i + 1);
            c.value = v || null;
            c.font = xFont({ bold: i === 0 || i === 2, color: a.sit === "OK" ? "8C8C8C" : "000000" });
            c.border = xBorda;
            c.alignment = { vertical: "top", wrapText: i === 4 || i === 5 };
          });
        });
        AL.addConditionalFormatting({
          ref: `A4:A${4 + Math.max(al.length, 1)}`,
          rules: [
            ["PENDENTE", XC.ver],
            ["NOK", XC.falha],
            ["OK", XC.ok],
          ].map(([v, [bg, fg]]) => ({ type: "expression", formulae: [`A4="${v}"`], style: { fill: { type: "pattern", pattern: "solid", bgColor: { argb: argb(bg) } }, font: { bold: true, color: { argb: argb(fg) } } } })),
        });
        AL.autoFilter = { from: { row: 3, column: 1 }, to: { row: 3 + Math.max(al.length, 1), column: ac2.length } };
        lista(AL, "A4:A2000", ["PENDENTE", "OK", "NOK"]);

        /* ---------- Catálogo (ligações) e Legenda ---------- */
        const CT = nova("Catálogo", { frz: 3 });
        const cc = [
          ["Sistema", 14],
          ["Tipo na planilha", 26],
          ["Descrição (Legenda)", 28],
          ["Tipo no catálogo", 28],
          ["Perfil neste cliente", 20],
          ["Na preventiva", 18],
          ["Dispositivos", 12],
        ];
        faixa(CT, 1, 1, cc.length, "LIGAÇÃO COM O CATÁLOGO DO DIÁRIO E LEGENDA", 12, 24);
        cc.forEach(([h, w], i) => {
          CT.getColumn(i + 1).width = w;
          cab(CT, 3, i + 1, h);
        });
        let lc = 4;
        for (const s of sists) {
          const cont = {};
          (S.inv[s].itens || []).forEach((it) => (cont[it.tipo] = (cont[it.tipo] || 0) + 1));
          for (const [tp, q] of Object.entries(cont).sort((a, b) => b[1] - a[1])) {
            const id = ((S.icfg && S.icfg.mapa) || {})[chaveTipo(s, tp)],
              t = tipoCat(id),
              pf = +((m.perfilPadrao || {})[id] || 0);
            [s, tp, leg[s + "|" + tp] || "", t ? t.nome : "SEM CATÁLOGO", t ? ((t.perfis || [])[pf] || {}).nome || "Padrão" : "", t ? (selecaoDe(t.id) === "todos" ? "Todos (marcados)" : "Escolher quais") : "", q].forEach((v, i) => {
              const c = CT.getCell(lc, i + 1);
              c.value = v === "" ? null : v;
              c.border = xBorda;
              c.font = xFont({ bold: i === 0, color: v === "SEM CATÁLOGO" ? "C00000" : "000000" });
            });
            lc++;
          }
        }

        /* ---------- Detalhes (servidores, NVRs, centrais) ---------- */
        const comDet = sists.flatMap((s) => (S.inv[s].itens || []).filter((it) => (it.detalhes || []).length || (!semSenhas && (((S.aces[s] || {}).acessos || {})[it.id] || {}).outros)).map((it) => [s, it]));
        if (comDet.length) {
          const DT = nova("Detalhes", { frz: 3 });
          faixa(DT, 1, 1, 5, "DETALHES DE SERVIDORES, GRAVADORES E CENTRAIS", 12, 24);
          [
            ["Sistema", 13],
            ["ID", 11],
            ["TAG", 26],
            ["Campo", 34],
            ["Valor", 40],
          ].forEach(([h, w], i) => {
            DT.getColumn(i + 1).width = w;
            cab(DT, 3, i + 1, h);
          });
          let ld = 4;
          for (const [s, it] of comDet) {
            const linhas = [...(it.detalhes || []), ...(semSenhas ? [] : (((S.aces[s] || {}).acessos || {})[it.id] || {}).outros || [])];
            for (const [k, v] of linhas) {
              [s, it.id, it.tag, k, v].forEach((x, i) => {
                const c = DT.getCell(ld, i + 1);
                c.value = x || null;
                c.border = xBorda;
                c.font = xFont({ bold: i === 3, color: RE_SENHA.test(k) && i === 4 ? XC.acesso : "000000" });
              });
              ld++;
            }
          }
        }

        const buf = await wb.xlsx.writeBuffer();
        const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `Inventario_${semAcento(nome).replace(/[^A-Za-z0-9]+/g, "_")}${semSenhas ? "_SEM_SENHAS" : ""}_${hoje()}.xlsx`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          URL.revokeObjectURL(a.href);
          a.remove();
        }, 2000);
        audita("exportou inventário", "inventarioMeta", S.cliId, `${nome}${semSenhas ? " (sem senhas)" : " (com senhas)"}`);
        toast("Planilha gerada");
      }

      boot();
    </script>
  </body>
</html>
