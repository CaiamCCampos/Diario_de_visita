<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Diário de Visitas Técnicas</title>
    <meta name="theme-color" content="#c81e2c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Diário" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
    <script src="config.js"></script>
    <style>
      :root {
        --r: #c81e2c;
        --rd: #8f0f19;
        --l: #e6e0e0;
        --d: #7a6d6d;
        --ok: #1f8a3b;
        --warn: #c47a00;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.4 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: #201616;
        background: #fff;
      }
      .app {
        max-width: 980px;
        margin: 0 auto;
        padding: 10px 10px 80px;
      }
      header {
        border: 1px solid var(--l);
        border-top: 4px solid var(--r);
        border-radius: 10px;
        padding: 10px 14px;
        margin-bottom: 10px;
      }
      .hrow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }
      .logo {
        height: 30px;
        max-width: 60vw;
      }
      .htop {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .htop .logo {
        min-width: 0;
        max-width: calc(100% - 90px);
        object-fit: contain;
        object-position: left center;
      }
      .hsair {
        flex: 0 0 auto;
        margin: 0;
      }
      .hr {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .hr .chipuser {
        border-radius: 14px;
        white-space: normal;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .chip {
        font-size: 11px;
        border: 1px solid var(--l);
        border-radius: 20px;
        padding: 3px 9px;
        color: var(--d);
        white-space: nowrap;
        display: inline-block;
      }
      .chip.ok {
        color: var(--ok);
        border-color: var(--ok);
      }
      .chip.warn {
        color: var(--warn);
        border-color: var(--warn);
      }
      .chip.red {
        color: var(--r);
        border-color: var(--r);
      }
      nav,
      .tabs {
        display: flex;
        gap: 2px;
        border-bottom: 1px solid var(--l);
        margin-bottom: 12px;
        overflow-x: auto;
      }
      nav button,
      .tabs button {
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        padding: 10px 14px;
        cursor: pointer;
        color: var(--d);
        font: inherit;
        font-weight: 600;
        white-space: nowrap;
      }
      nav button.on,
      .tabs button.on {
        color: var(--r);
        border-color: var(--r);
      }
      .card {
        border: 1px solid var(--l);
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 12px;
      }
      .card h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--r);
        margin: 0 0 10px;
      }
      h3 {
        margin: 0 0 6px;
        font-size: 17px;
      }
      .g {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 10px;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--d);
        margin: 8px 0 3px;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--l);
        border-radius: 6px;
        font: inherit;
        background: #fbfbfb;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid var(--r);
        outline-offset: 1px;
      }
      textarea {
        resize: vertical;
      }
      .g > *,
      .row > * {
        min-width: 0;
      }
      input[type="date"],
      input[type="time"] {
        display: block;
        min-width: 0;
        max-width: 100%;
        -webkit-appearance: none;
        appearance: none;
        min-height: 43px;
        line-height: 1.2;
      }

      input[type="time"]::-webkit-date-and-time-value {
        text-align: left;
        min-width: 0;
      }
      .top .nm {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .top {
        flex-wrap: wrap;
      }
      .li .t {
        flex-wrap: wrap;
      }
      .b {
        background: var(--r);
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 11px 15px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        margin: 6px 6px 0 0;
      }
      .b:hover {
        background: var(--rd);
      }
      .b.o {
        background: #fff;
        color: #201616;
        border: 1px solid var(--l);
      }
      .b.o:hover {
        background: #f6f2f2;
      }
      .b.s {
        padding: 7px 10px;
        font-size: 12.5px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: flex-end;
      }
      .row > * {
        flex: 1;
        min-width: 140px;
      }
      .eq {
        border: 1px solid var(--l);
        border-left: 3px solid var(--r);
        border-radius: 8px;
        padding: 10px 12px;
        margin: 10px 0;
      }
      .k {
        display: flex;
        gap: 9px;
        align-items: center;
        margin: 6px 0;
        color: #201616;
        font-size: 14px;
      }
      .k input {
        width: auto;
        transform: scale(1.2);
      }
      small,
      .sm {
        color: var(--d);
        font-size: 12.5px;
      }
      .li {
        border: 1px solid var(--l);
        border-radius: 8px;
        padding: 11px 13px;
        margin: 8px 0;
        cursor: pointer;
      }
      .li:hover {
        background: #faf6f6;
      }
      .li .t {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }
      .note {
        background: #fff3b0;
        border-radius: 6px;
        padding: 8px 10px;
        margin: 8px 0;
        font-size: 13px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .center {
        text-align: center;
        padding: 40px 10px;
        color: var(--d);
      }
      .login {
        max-width: 380px;
        margin: 40px auto;
      }
      .login img {
        max-width: 100%;
      }
      .err {
        color: var(--r);
        font-size: 13px;
        min-height: 18px;
        margin-top: 8px;
      }
      details summary {
        cursor: pointer;
        color: var(--r);
        font-size: 13px;
        margin: 8px 0;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        background: #201616;
        color: #fff;
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 14px;
        display: none;
        z-index: 9;
        max-width: 90vw;
      }
      details.eq > summary {
        font-size: 15px;
        margin: 0;
      }
      .rd {
        color: var(--r);
      }
      .b.am,
      .chip.am {
        color: #8a5a00;
        border-color: #c47a00;
        background: #fff6e0;
      }
      fieldset.ro {
        border: 0;
        padding: 0;
        margin: 0;
        min-width: 0;
      }
      .ro .b,
      .ro summary ~ .b {
        display: none;
      }
      @media (max-width: 640px) {
        .g {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="app"></div>
    <div id="toast"></div>
    <script>
      "use strict";
      /* ==================================================================
   1. UTILIDADES
   ================================================================== */
      const FBCFG = window.FIREBASE_CONFIG || {};
      const USE_FB = !!FBCFG.apiKey && !String(FBCFG.apiKey).startsWith("SUA");

      const $ = (s, r = document) => r.querySelector(s);
      const pad = (n) => String(n).padStart(2, "0");
      const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      const clone = (o) => JSON.parse(JSON.stringify(o));
      const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      const hoje = () => {
        const d = new Date();
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      };
      const bd = (iso) => (iso ? iso.split("-").reverse().join("/") : "");
      const roman = (n) => {
        const m = [
          [10, "X"],
          [9, "IX"],
          [5, "V"],
          [4, "IV"],
          [1, "I"],
        ];
        let r = "";
        for (const [v, s] of m)
          while (n >= v) {
            r += s;
            n -= v;
          }
        return r;
      };
      const byName = (a, b) => (a.unidade || "").localeCompare(b.unidade || "", "pt-BR");

      const STATUS_EQ = ["Funcionando normalmente", "Funcionando com ressalvas", "Não está funcionando"];
      const STATUS_ITEM = [
        "Concluído",
        "Aguardando orçamento",
        "Aguardando aprovação do orçamento",
        "Funcionando de forma paliativa",
        "Funcionando parcialmente",
      ];
      const CORRECOES = ["Em andamento", "Sugerida", "Solucionada", "Agendada"];
      const CFG_PADRAO = {
        tecnicos: ["Caiam Camargo"],
        equipe: "Equipe 5 - São Paulo 2",
        ini: "07:00",
        fim: "17:00",
        hora: "10:00",
        inatividade: 30,
      };

      function toast(msg) {
        const t = $("#toast");
        t.textContent = msg;
        t.style.display = "block";
        clearTimeout(toast.t);
        toast.t = setTimeout(() => (t.style.display = "none"), 3500);
      }

      /* ==================================================================
   2. CATÁLOGO INICIAL (sistemas, tipos de equipamento, perfis)
   ================================================================== */
      function seedCat() {
        const I = ["Inspeção visual", "Verificação de dispositivos online", "Verificação de eventos", "Verificação de comunicação em rede"];
        const SW = [
          "Teste de comunicação com os periféricos",
          "Limpeza de disco (C:)",
          "Validação do gerenciamento de serviços",
          "Análise e backup do banco de dados",
        ];
        const C = [
          "Inspeção visual",
          "Limpeza do dispositivo",
          "Reaperto dos conectores e dos fixadores",
          "Verificação de comunicação com o sistema",
          "Teste de alimentação",
        ];
        const T = (sis, nome, extra, perfis) => ({ id: uid(), sis, nome, extra, perfis: perfis.map(([n, a]) => ({ nome: n, atv: a })) });
        return {
          id: "dados",
          sis: [
            { sigla: "CFTV", nome: "Circuito fechado de televisão" },
            { sigla: "SCA", nome: "Sistema de controle de acesso" },
            { sigla: "SAI", nome: "Sistema de alarme de intrusão" },
            { sigla: "SSCU", nome: "Sistema de supervisão e controle de utilidades" },
            { sigla: "SSON", nome: "Sistema de sonorização" },
            { sigla: "SDAI", nome: "Sistema de detecção e alarme de incêndio" },
          ],
          tipos: [
            T("CFTV", "NVR", "dias", [
              [
                "Padrão",
                [
                  "Verificação do tempo de gravação",
                  "Verificação de gravação de cada câmera",
                  "Verificação do status do disco rígido",
                  "Teste de comunicação em rede",
                ],
              ],
            ]),
            T("CFTV", "Câmeras de vigilância", "", [
              [
                "Padrão",
                ["Inspeção visual", "Teste de infravermelho", "Limpeza", "Reaperto de parafusos", "Teste da fonte de alimentação"],
              ],
            ]),
            T("CFTV", "Servidor CFTV", "", [["Padrão", []]]),
            T("SCA", "Servidor SCA", "", [
              ["Inspeção", [...I, "Atualização do banco de dados"]],
              ["Software", SW],
            ]),
            T("SCA", "Controladoras e periféricos", "", [["Padrão", C]]),
            T("SAI", "Central de alarme", "", [["Padrão", [...I, "Teste de alimentação"]]]),
            T("SAI", "Teclados", "", [
              [
                "Padrão",
                [
                  "Inspeção visual",
                  "Limpeza do dispositivo",
                  "Reaperto dos conectores e dos fixadores",
                  "Verificação de comunicação",
                  "Verificação de falhas",
                ],
              ],
            ]),
            T("SSCU", "Servidor SSCU", "", [
              ["Inspeção", I],
              ["Software", SW],
            ]),
            T("SSCU", "Controladoras e gerenciadoras", "", [["Padrão", C]]),
            T("SSON", "Amplificadora / iPod / iPad", "", [
              [
                "Padrão",
                [
                  "Verificação do seu funcionamento",
                  "Verificação das suas configurações no sistema",
                  "Verificação da comunicação entre os periféricos",
                  "Teste de desempenho",
                  "Limpeza",
                ],
              ],
            ]),
            T("SDAI", "Painel SDAI", "", [["Padrão", ["Validação visual", "Limpeza", "Validação da alimentação da central"]]]),
            T("SDAI", "Módulo / chave de fluxo", "", [["Padrão", []]]),
          ],
        };
      }

      /* ==================================================================
   3. CAMADA DE BANCO DE DADOS
      - Firebase (produção): Firestore + login
      - Local (teste sem Firebase): localStorage
   ================================================================== */
      let DB = null;

      function makeLocalDB() {
        const key = (c) => "diario2:" + c;
        const read = (c) => {
          try {
            return JSON.parse(localStorage.getItem(key(c))) || {};
          } catch (e) {
            return {};
          }
        };
        const write = (c, o) => localStorage.setItem(key(c), JSON.stringify(o));
        const subs = [];
        const ok = (d, f, v) => !f || (typeof f === "string" ? d[f] === v : Object.entries(f).every(([k, x]) => d[k] === x));
        const rows = (c, f, v) =>
          Object.values(read(c))
            .filter((d) => ok(d, f, v))
            .map(clone);
        const notify = (c) => subs.filter((s) => s.col === c).forEach((s) => s.fire());
        return {
          mode: "local",
          async criaLogin() {
            return uid();
          },
          async get(c, id) {
            const d = read(c)[id];
            return d ? clone(d) : null;
          },
          async set(c, id, data) {
            const o = read(c);
            o[id] = clone(data);
            write(c, o);
            notify(c);
          },
          async del(c, id) {
            const o = read(c);
            delete o[id];
            write(c, o);
            notify(c);
          },
          async list(c, f, v) {
            return rows(c, f, v);
          },
          listen(c, f, v, cb) {
            const s = { col: c, fire: () => cb(rows(c, f, v)) };
            subs.push(s);
            s.fire();
            return () => {
              const i = subs.indexOf(s);
              if (i >= 0) subs.splice(i, 1);
            };
          },
        };
      }

      async function makeFirebaseDB() {
        const base = "https://www.gstatic.com/firebasejs/10.13.2/";
        const [appM, fsM, authM] = await Promise.all([
          import(base + "firebase-app.js"),
          import(base + "firebase-firestore.js"),
          import(base + "firebase-auth.js"),
        ]);
        const app = appM.initializeApp(FBCFG);
        let db;
        try {
          // cache no aparelho: permite anotar sem sinal e sincronizar depois
          db = fsM.initializeFirestore(app, { localCache: fsM.persistentLocalCache({ tabManager: fsM.persistentMultipleTabManager() }) });
        } catch (e) {
          console.warn("Sem cache offline", e);
          db = fsM.getFirestore(app);
        }
        const auth = authM.getAuth(app);
        const q = (c, f, v) => {
          const col = fsM.collection(db, c),
            w = !f ? [] : typeof f === "string" ? [[f, v]] : Object.entries(f);
          return w.length ? fsM.query(col, ...w.map(([k, x]) => fsM.where(k, "==", x))) : col;
        };
        return {
          mode: "firebase",
          auth,
          authM,
          // cria o login de outra pessoa sem deslogar quem está criando (usa uma segunda conexão)
          async criaLogin(email, senha) {
            const sec = appM.initializeApp(FBCFG, "sec" + Date.now()),
              a2 = authM.getAuth(sec);
            try {
              let cred;
              try {
                cred = await authM.createUserWithEmailAndPassword(a2, email, senha);
              } catch (e) {
                if (e.code === "auth/email-already-in-use") cred = await authM.signInWithEmailAndPassword(a2, email, senha);
                else throw e;
              }
              return cred.user.uid;
            } finally {
              try {
                await authM.signOut(a2);
              } catch (e) {}
              try {
                await appM.deleteApp(sec);
              } catch (e) {}
            }
          },
          async get(c, id) {
            const s = await fsM.getDoc(fsM.doc(db, c, id));
            return s.exists() ? s.data() : null;
          },
          async set(c, id, data) {
            await fsM.setDoc(fsM.doc(db, c, id), clone(data));
          },
          async del(c, id) {
            await fsM.deleteDoc(fsM.doc(db, c, id));
          },
          async list(c, f, v) {
            const s = await fsM.getDocs(q(c, f, v));
            return s.docs.map((d) => d.data());
          },
          listen(c, f, v, cb) {
            return fsM.onSnapshot(
              q(c, f, v),
              (s) => cb(s.docs.map((d) => d.data())),
              (e) => console.error("listen " + c, e),
            );
          },
        };
      }

      /* ---- gravação com indicador "Salvando…/Salvo" e salvamento adiado ---- */
      let gravando = 0;
      const timers = {},
        fns = {};
      const saveLabel = () =>
        gravando || Object.keys(timers).length ? (navigator.onLine ? "Salvando…" : "Sem conexão: salvo no aparelho") : "Salvo ✓";
      function showSave() {
        const el = $("#savestat");
        if (el) {
          el.textContent = saveLabel();
          el.className = "chip " + (saveLabel() === "Salvo ✓" ? "ok" : "warn");
        }
      }
      const gravPend = new Set();
      function gravar(col, id, data) {
        gravando++;
        showSave();
        const p = DB.set(col, id, data)
          .catch((e) => {
            console.error(e);
            toast("Erro ao salvar: " + (e.code || e.message));
          })
          .finally(() => {
            gravando--;
            showSave();
            gravPend.delete(p);
          });
        gravPend.add(p);
        return p;
      }
      function later(key, fn, ms = 600) {
        clearTimeout(timers[key]);
        fns[key] = fn;
        timers[key] = setTimeout(() => {
          delete timers[key];
          fn();
        }, ms);
        showSave();
      }
      function flushAll() {
        for (const k of Object.keys(timers)) {
          clearTimeout(timers[k]);
          delete timers[k];
          fns[k]();
        }
      }
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") flushAll();
      });
      window.addEventListener("pagehide", flushAll);
      window.addEventListener("online", showSave);
      window.addEventListener("offline", showSave);

      /* ==================================================================
   4. ESTADO
   ================================================================== */
      const S = {
        authChecked: false,
        ready: false,
        user: null,
        fatal: null,
        me: null,
        semAcesso: "",
        eq: [],
        eqSel: "",
        usuarios: null,
        nu: null,
        rel: null,
        aviso: "",
        trocaSenha: false,
        trocaErro: "",
        loginFresh: false,
        pcAberto: "",
        cliExc: null,
        aut: [],
        autCli: null,
        ax: { data: "", equipe: "" },
        rascProp: [],
        rascExc: [],
        catSis: "",
        imp: null,
        userAberto: "",
        catBusca: "",
        catAberto: "",
        view: "home",
        tab: "dados",
        cat: null,
        cfg: null,
        clientes: [],
        pendAbertas: [],
        rascunhos: [], // listas ao vivo (só leitura)
        cli: null,
        hist: null,
        pc: null, // cliente aberto + histórico + pendências (cópias de trabalho)
        visit: null,
        vcli: null, // visita em edição + cliente dela
        nv: { cliId: "", tipo: "preventiva" },
        busca: "",
        mostrarArq: false,
      };
      let unsubs = [];

      const tp = (id) =>
        S.cat.tipos.find((t) => t.id === id) || { id, sis: "", nome: "(tipo removido)", extra: "", perfis: [{ nome: "Padrão", atv: [] }] };
      const perfilDe = (e) => {
        const t = tp(e.tipo);
        return t.perfis[e.perfil] || t.perfis[0];
      };
      const atvDe = (e) => (e.atv && e.atv.length ? e.atv : perfilDe(e).atv);
      const nmEq = (e) => (e.nome || "(sem nome)") + (e.local ? ` (${e.local})` : "");
      const cliNome = (id) => (S.clientes.find((c) => c.id === id) || {}).unidade || "(cliente removido)";
      const nAbertas = (id) => S.pendAbertas.filter((p) => p.clienteId === id).length;
      const novoItem = () => ({
        id: uid(),
        titulo: "",
        problema: "",
        diag: "",
        acoes: [],
        solucao: "",
        obs: "",
        texto: "",
        status: "",
        resolvido: true,
      });
      const novaPend = (clienteId, equipeId) => ({
        id: uid(),
        clienteId,
        equipeId,
        criadaPorId: S.user.uid,
        criadaPorNome: S.me.nome,
        titulo: "",
        problema: "",
        diag: "",
        acoes: [],
        solucao: "",
        obs: "",
        texto: "",
        status: "Aguardando orçamento",
        aberta: true,
        criada: hoje(),
        historico: [],
        nova: true,
        concluir: false,
      });

      /* ==================================================================
   4b. PERFIS E PERMISSÕES (um lugar só decide o que cada perfil pode)
   ================================================================== */
      const PAPEIS = { admin: "Administrador", supervisor: "Supervisor", tecnico: "Técnico" };
      const PERM = {
        admin: ["*"],
        supervisor: [
          "cliente.editar",
          "catalogo.editar",
          "config",
          "visita.excluir",
          "visita.editarTodas",
          "pend.editarTodas",
          "usuarios.ver",
          "relatorios",
          "backup",
        ],
        tecnico: [],
      };
      const pode = (a) => {
        const p = PERM[(S.me || {}).papel] || [];
        return p.includes("*") || p.includes(a);
      };
      const eqNome = (id) => (S.eq.find((e) => e.id === id) || {}).nome || "(sem equipe)";
      const eqAtiva = () => (S.me.papel === "admin" ? S.eqSel : S.me.equipeId); // '' = admin vendo todas
      const filtro = (o = {}) => {
        const e = eqAtiva();
        return e ? { ...o, equipeId: e } : o;
      };
      const fCli = (c) => (c.equipeId ? { clienteId: c.id, equipeId: c.equipeId } : { clienteId: c.id }); // clientes antigos não têm equipe
      // Quem edita a visita: o técnico que a criou, o supervisor e o admin. Visitas sem dono (antigas) só o supervisor/admin.
      const podeEditarVisita = (v) => {
        if (v.excecao && v.status === "encerrada" && S.me.papel !== "admin" && S.me.equipeId !== v.equipeId) return false; // acesso ao cliente já terminou
        return pode("visita.editarTodas") || (!!v.autorId && v.autorId === S.user.uid);
      };
      // Pendência: dono, supervisor e admin editam tudo; qualquer outro técnico só escreve a solução e conclui.
      const podeEditarPend = (p) => pode("pend.editarTodas") || !!p.nova || (!!p.criadaPorId && p.criadaPorId === S.user.uid);
      const ro = (h, ok) => (ok ? h : `<fieldset disabled class="ro">${h}</fieldset>`);
      const novoNU = () => ({ email: "", senha: "", nome: "", papel: "tecnico", equipeId: "", trocar: true });

      /* ==================================================================
   5. INICIALIZAÇÃO, LOGIN E CARGA
   ================================================================== */
      async function boot() {
        render();
        try {
          DB = USE_FB ? await makeFirebaseDB() : makeLocalDB();
        } catch (e) {
          console.error(e);
          S.fatal = "Não consegui carregar o Firebase. Verifique a internet e tente de novo.";
          S.authChecked = true;
          render();
          return;
        }
        if (DB.mode === "firebase") {
          DB.authM.onAuthStateChanged(DB.auth, (user) => {
            S.authChecked = true;
            S.user = user;
            S.me = null;
            S.semAcesso = "";
            S.trocaSenha = false;
            S.usuarios = null;
            S.rel = null;
            if (user) start();
            else {
              stop();
              pararSessao();
              S.ready = false;
              render();
            }
          });
        } else {
          S.authChecked = true;
          S.user = { email: "modo local", uid: "local" };
          start();
        }
      }

      /* ==================================================================
   5b. SESSÃO (passo 6): um aparelho por login, logout ao fechar o navegador e por inatividade.
   Controle feito no próprio app (não é segurança de servidor). O administrador fica de fora.
   ================================================================== */
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      let minhaSid = "",
        unSessao = null,
        ultAtiv = Date.now(),
        tIdle = null,
        saindo = false,
        deferido = "",
        ultGrava = 0;
      const limMin = () => Math.max(1, Number((S.cfg || {}).inatividade) || 30);
      const semPendencia = () => navigator.onLine !== false && gravando === 0 && gravPend.size === 0;
      function barraIdle(txt) {
        let b = document.getElementById("idlebar");
        if (!txt) {
          if (b) b.style.display = "none";
          return;
        }
        if (!b) {
          b = document.createElement("div");
          b.id = "idlebar";
          b.style.cssText =
            "position:fixed;left:10px;right:10px;top:10px;z-index:20;background:#fff6e0;border:1px solid #c47a00;color:#5a3c00;border-radius:10px;padding:12px;font-size:14px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.2)";
          document.body.appendChild(b);
        }
        b.textContent = txt;
        b.style.display = "block";
      }
      function ativ() {
        if (!tIdle) return;
        ultAtiv = Date.now();
        barraIdle("");
        if (ultAtiv - ultGrava > 5000) {
          ultGrava = ultAtiv;
          try {
            localStorage.setItem("diario:ultAtiv", String(ultAtiv));
          } catch (e) {}
        }
      }
      ["pointerdown", "keydown", "touchstart", "input", "scroll"].forEach((e) =>
        document.addEventListener(e, ativ, { capture: true, passive: true }),
      );
      // sai da conta guardando tudo antes (e deixando um aviso na tela de login)
      async function sair(msg) {
        if (saindo) return;
        saindo = true;
        try {
          S.aviso = msg || "";
          flushAll();
          await Promise.race([Promise.all([...gravPend]), sleep(4000)]);
          pararSessao();
          try {
            sessionStorage.removeItem("diario:ativo");
          } catch (e) {}
          await DB.authM.signOut(DB.auth);
        } catch (e) {
          console.error(e);
        } finally {
          saindo = false;
        }
      }
      function pararSessao() {
        if (unSessao) {
          try {
            unSessao();
          } catch (e) {}
          unSessao = null;
        }
        if (tIdle) {
          clearInterval(tIdle);
          tIdle = null;
        }
        deferido = "";
        barraIdle("");
      }
      function tickIdle() {
        if (!tIdle || saindo) return;
        if (deferido && semPendencia()) return void sair(deferido);
        const lim = limMin() * 60000,
          idle = Date.now() - ultAtiv;
        if (idle >= lim) {
          if (semPendencia()) return void sair(`Você foi desconectado por ficar ${limMin()} min sem usar o sistema.`);
          barraIdle("");
          return;
        } // offline ou salvando: espera
        if (idle >= lim - 60000)
          barraIdle(
            `Sua sessão vai encerrar por inatividade em ${Math.max(1, Math.ceil((lim - idle) / 1000))} s. Toque na tela para continuar.`,
          );
      }
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") tickIdle();
      });
      async function iniciaSessao() {
        const fresh = S.loginFresh;
        S.loginFresh = false;
        let ativo = false,
          ult = 0;
        try {
          ativo = !!sessionStorage.getItem("diario:ativo");
          ult = Number(localStorage.getItem("diario:ultAtiv")) || 0;
        } catch (e) {}
        if (!fresh) {
          // login restaurado automaticamente pelo navegador
          let motivo = "";
          if (!ativo) motivo = "Sua sessão foi encerrada porque o navegador foi fechado. Entre de novo.";
          else if (ult && Date.now() - ult > limMin() * 60000)
            motivo = `Você foi desconectado por ficar ${limMin()} min sem usar o sistema.`;
          if (motivo) {
            if (semPendencia()) {
              await sair(motivo);
              return false;
            }
            deferido = motivo; // sem internet / salvando: não desconecta agora, para não perder dados
          }
        }
        try {
          sessionStorage.setItem("diario:ativo", "1");
        } catch (e) {}
        ultAtiv = Date.now();
        minhaSid = Math.random().toString(36).slice(2) + Date.now().toString(36);
        try {
          await DB.set("sessoes", S.user.uid, { uid: S.user.uid, email: S.user.email, sid: minhaSid, em: Date.now() });
        } catch (e) {
          console.error(e);
          S.fatal = "Não consegui registrar a sessão: " + (e.code || e.message) + ". Confira as regras do Firestore.";
          render();
          return false;
        }
        unSessao = DB.listen("sessoes", { uid: S.user.uid }, null, (a) => {
          const d = a[0];
          if (d && d.sid && d.sid !== minhaSid) sair("Sua conta foi aberta em outro aparelho. Esta sessão foi encerrada.");
        });
        tIdle = setInterval(tickIdle, 10000);
        return true;
      }

      const meuNome = () => (S.me && S.me.nome) || "";
      // Lê o perfil do usuário. Se o login não tem perfil, tenta criar o administrador inicial
      // (as regras do Firestore só aceitam isso para o e-mail do dono do sistema).
      async function carregaPerfil() {
        if (DB.mode === "local")
          return { uid: "local", email: "modo local", nome: "Modo local", papel: "admin", equipeId: "", ativo: true };
        let me = await DB.get("usuarios", S.user.uid);
        if (!me) {
          const novo = {
            uid: S.user.uid,
            email: S.user.email,
            nome: S.user.displayName || String(S.user.email).split("@")[0],
            papel: "admin",
            equipeId: "",
            ativo: true,
            criado: Date.now(),
          };
          try {
            await DB.set("usuarios", S.user.uid, novo);
            me = novo;
          } catch (e) {
            me = null;
          }
        }
        return me;
      }

      async function start() {
        S.ready = false;
        render();
        try {
          S.me = await carregaPerfil();
          S.semAcesso = !S.me
            ? "Seu login ainda não foi liberado. Peça ao administrador para cadastrar o seu usuário no sistema."
            : !PAPEIS[S.me.papel]
              ? "Seu usuário está com um perfil inválido. Fale com o administrador."
              : S.me.ativo === false
                ? "Seu usuário está desativado. Fale com o administrador."
                : S.me.papel !== "admin" && !S.me.equipeId
                  ? "Seu usuário não está associado a uma equipe. Fale com o administrador."
                  : "";
          if (!S.semAcesso && DB.mode === "firebase" && S.me.trocarSenha === true) {
            stop();
            S.trocaSenha = true;
            S.trocaErro = "";
            render();
            return;
          }
          if (S.semAcesso) {
            stop();
            render();
            return;
          }
          S.cat = await DB.get("catalogo", "dados");
          if (!S.cat) {
            S.cat = seedCat();
            if (pode("catalogo.editar")) gravar("catalogo", "dados", S.cat);
          }
          S.cfg = await DB.get("config", "dados");
          if (!S.cfg) {
            S.cfg = clone(CFG_PADRAO);
            if (pode("config")) gravar("config", "dados", S.cfg);
          }
          S.eq = (await DB.list("equipes")).sort((a, b) => (a.nome || "").localeCompare(b.nome || "", "pt-BR"));
        } catch (e) {
          console.error(e);
          S.fatal = "Não consegui ler os dados: " + (e.code || e.message) + ". Confira as regras do Firestore e a conexão.";
          render();
          return;
        }
        if (S.me.papel === "admin" && !S.eq.some((e) => e.id === S.eqSel)) S.eqSel = "";
        if (DB.mode === "firebase" && S.me.papel !== "admin" && !(await iniciaSessao())) return;
        ouvir();
        S.ready = true;
        render();
      }
      function ouvir() {
        stop();
        unsubs = [
          DB.listen("clientes", filtro(), null, (a) => {
            S.clientes = a.sort(byName);
            softRender(["home", "clientes"]);
          }),
          DB.listen("pendencias", filtro({ aberta: true }), null, (a) => {
            S.pendAbertas = a;
            softRender(["home", "clientes"]);
          }),
          DB.listen("visitas", filtro({ status: "rascunho" }), null, (a) => {
            S.rascProp = a;
            mergeRasc();
          }),
        ];
        if (S.me.equipeId)
          unsubs.push(
            // visitas em exceção feitas pela minha equipe em cliente de outra, e autorizações para a minha equipe
            DB.listen("visitas", { equipeAutorId: S.me.equipeId, status: "rascunho", excecao: true }, null, (a) => {
              S.rascExc = a;
              mergeRasc();
            }),
            DB.listen("autorizacoes", { equipeAutorizadaId: S.me.equipeId, ativa: true }, null, (a) => {
              S.aut = a;
              softRender(["home", "clientes", "cliente"]);
            }),
          );
      }
      function mergeRasc() {
        S.rascunhos = [...S.rascProp, ...S.rascExc.filter((x) => !S.rascProp.some((y) => y.id === x.id))].sort(
          (x, y) => (y.criada || 0) - (x.criada || 0),
        );
        softRender(["home"]);
      }
      // autorização ainda utilizável: em uso, ou aguardando e dentro da validade
      const autValida = (a) => a.status === "em_uso" || (a.status === "aguardando" && a.validaAteMs >= Date.now());
      const autsVisiveis = () => S.aut.filter(autValida);
      function vAutLista() {
        const l = autsVisiveis();
        if (!l.length) return "";
        return card(
          "Acesso temporário",
          l
            .map(
              (
                a,
              ) => `<div class="li" data-a="openCliExc" data-id="${esc(a.id)}"><div class="t"><b class="rd">${esc(a.clienteNome)}</b><span class="chip am">${a.status === "em_uso" ? "em uso" : "temporário"}</span></div>
    <div class="sm">Cliente da <b>${esc(eqNome(a.equipeDonaId))}</b> (não é da sua equipe) · exceção aberta por ${esc(a.criadaPorNome)} (${esc(eqNome(a.equipeDonaId))}) · válido em ${bd(a.data)}${a.status === "em_uso" ? " · em uso por " + esc(a.usadaPorNome) : ""}</div></div>`,
            )
            .join(""),
        );
      }
      function stop() {
        unsubs.forEach((u) => {
          try {
            u();
          } catch (e) {}
        });
        unsubs = [];
      }
      function softRender(views) {
        if (S.ready && views.includes(S.view)) render();
      }
      async function carregaUsuarios() {
        try {
          S.eq = (await DB.list("equipes")).sort((a, b) => (a.nome || "").localeCompare(b.nome || "", "pt-BR"));
          S.usuarios = (await DB.list("usuarios", pode("usuarios.gerir") ? null : { equipeId: S.me.equipeId })).sort((a, b) =>
            (a.nome || "").localeCompare(b.nome || "", "pt-BR"),
          );
        } catch (e) {
          console.error(e);
          S.usuarios = [];
          toast("Não consegui carregar os usuários: " + (e.code || e.message));
        }
        if (S.view === "usuarios") render();
      }

      /* ==================================================================
   6. COMPONENTES DE FORMULÁRIO (campos ligados ao estado por "caminho")
   ================================================================== */
      const val = (p) => p.split(".").reduce((o, k) => (o == null ? undefined : o[k]), S);
      function setPath(p, v) {
        const k = p.split(".");
        let o = S;
        for (let i = 0; i < k.length - 1; i++) {
          if (o[k[i]] == null) o[k[i]] = {};
          o = o[k[i]];
        }
        o[k[k.length - 1]] = v;
      }
      const at = (p, r) => `data-p="${esc(p)}"${r ? " data-r" : ""}`;
      const fIn = (p, l, o = {}) =>
        `<div><label>${l}</label><input type="${o.type || "text"}" ${at(p, o.r)} value="${esc(val(p))}"${o.list ? ` list="${o.list}"` : ""}></div>`;
      const fTa = (p, l, o = {}) =>
        `<div><label>${l}</label><textarea ${at(p, o.r)}${o.lines ? " data-l" : ""} rows="${o.rows || 3}">${esc(o.lines ? (val(p) || []).join("\n") : val(p))}</textarea></div>`;
      const fSel = (p, l, opts, o = {}) =>
        `<div><label>${l}</label><select ${at(p, o.r)}>${opts.map(([v, t]) => `<option value="${esc(v)}"${String(v) === String(val(p)) ? " selected" : ""}>${esc(t)}</option>`).join("")}</select></div>`;
      const fChk = (p, l, o = {}) =>
        `<label class="k"><input type="checkbox" ${at(p, o.r)}${o.inv ? " data-inv" : ""}${(o.inv ? !val(p) : val(p)) ? " checked" : ""}>${l}</label>`;
      const card = (t, body) => `<div class="card"><h2>${t}</h2>${body}</div>`;

      /* ==================================================================
   7. TELAS
   ================================================================== */
      function vLogin() {
        return `<div class="card login"><img src="logo.png" alt="Controller BMS" onerror="this.style.display='none'">
  <h3>Diário de Visitas Técnicas</h3><label>E-mail</label><input id="lemail" type="email" autocomplete="username">
  <label>Senha</label><input id="lsenha" type="password" autocomplete="current-password">
  <button class="b" data-a="login" style="width:100%">Entrar</button><button class="b o s" data-a="resetpw">Esqueci a senha</button>
  <div class="err" id="lerr">${esc(S.aviso || "")}</div></div>`;
      }
      function vHeader() {
        // linha de cima: logo à esquerda e botão Sair fixo à direita; embaixo: quem está logado e o estado de gravação
        return `<header><div class="htop"><img src="logo.png" class="logo" alt="Controller BMS" onerror="this.style.display='none'">
  ${DB.mode === "firebase" ? '<button class="b o s hsair" data-a="logout">Sair</button>' : '<span class="chip warn">modo local</span>'}</div>
  <div class="hr"><span class="chip chipuser">${esc(meuNome())} · ${PAPEIS[S.me.papel]}${S.me.equipeId ? " · " + esc(eqNome(S.me.equipeId)) : ""}</span><span id="savestat" class="chip ok">${saveLabel()}</span></div></header>`;
      }
      function vNav() {
        const t = [
          ["home", "Início"],
          ["clientes", "Clientes"],
          ["catalogo", "Catálogo"],
          ...(pode("relatorios") ? [["relatorios", "Relatórios"]] : []),
          ...(pode("usuarios.ver") ? [["usuarios", "Usuários"]] : []),
          ...(pode("config") ? [["config", "Configurações"]] : []),
        ];
        return `<nav>${t.map(([v, n]) => `<button class="${S.view === v || (v === "clientes" && S.view === "cliente") ? "on" : ""}" data-v="${v}">${n}</button>`).join("")}</nav>`;
      }

      // primeiro acesso: a pessoa troca a senha que o administrador definiu
      function vTrocaSenha() {
        return `<div class="card login"><img src="logo.png" alt="Controller BMS" onerror="this.style.display='none'"><h3>Crie sua senha</h3>
  <p class="sm">Este é o seu primeiro acesso. Por segurança, troque a senha que recebeu por uma só sua (mínimo 6 caracteres).</p>
  <label>Senha atual (a que você recebeu)</label><input id="tsatual" type="password" autocomplete="current-password">
  <label>Nova senha</label><input id="tsnova" type="password" autocomplete="new-password">
  <label>Repita a nova senha</label><input id="tsnova2" type="password" autocomplete="new-password">
  <button class="b" data-a="trocaSenha" style="width:100%">Salvar e entrar</button><button class="b o s" data-a="logout">Sair</button>
  <div class="err" id="tserr">${esc(S.trocaErro || "")}</div></div>`;
      }
      function vSemAcesso() {
        return `<div class="card login"><img src="logo.png" alt="Controller BMS" onerror="this.style.display='none'"><h3>Sem acesso</h3><p>${esc(S.semAcesso)}</p>
  ${DB.mode === "firebase" ? '<button class="b" data-a="logout" style="width:100%">Sair</button>' : ""}</div>`;
      }
      function vEquipeSel() {
        if (S.me.papel !== "admin") return "";
        return `<div class="card" style="padding:8px 12px"><label style="margin:0">Equipe em exibição</label><select id="eqsel"><option value="">Todas as equipes</option>${S.eq.map((e) => `<option value="${esc(e.id)}"${e.id === S.eqSel ? " selected" : ""}>${esc(e.nome)}</option>`).join("")}</select></div>`;
      }

      function vNovaVisita() {
        const ativos = S.clientes.filter((c) => !c.arquivado);
        if (!ativos.length) return '<p class="sm">Cadastre o primeiro cliente na aba Clientes.</p>';
        return `<div class="row">${fSel("nv.cliId", "Cliente", [["", "— escolher —"], ...ativos.map((c) => [c.id, c.unidade])])}${fSel(
          "nv.tipo",
          "Tipo de visita",
          [
            ["preventiva", "Preventiva"],
            ["corretiva", "Corretiva (atendimento)"],
          ],
        )}</div>
  <button class="b" data-a="nv">Iniciar visita</button>`;
      }

      function vHome() {
        let h = "";
        h += card("Nova visita", vNovaVisita());
        h += vAutLista();
        h += card(
          "Visitas em andamento",
          S.rascunhos.length
            ? S.rascunhos
                .map(
                  (
                    v,
                  ) => `<div class="li"><div class="t"><b>${esc(v.clienteNome || cliNome(v.clienteId))}</b><span class="chip ${v.tipo === "corretiva" ? "red" : "ok"}">${v.tipo === "corretiva" ? "Corretiva" : "Preventiva"}</span></div>
    <div class="sm">${bd(v.data)} · ${esc(v.autorNome || v.tecnicos || "")}</div>
    <button class="b s" data-a="openVisit" data-id="${v.id}">${podeEditarVisita(v) ? "Continuar" : "Ver"}</button>${podeEditarVisita(v) ? `<button class="b o s" data-a="delRascunho" data-id="${v.id}">Descartar</button>` : ""}</div>`,
                )
                .join("")
            : '<p class="sm">Nenhuma visita em andamento.</p>',
        );
        const gr = {};
        S.pendAbertas.forEach((p) => (gr[p.clienteId] = gr[p.clienteId] || []).push(p));
        const ids = Object.keys(gr).sort((a, b) => cliNome(a).localeCompare(cliNome(b), "pt-BR"));
        h += card(
          "Pendências em aberto",
          ids.length
            ? ids
                .map(
                  (
                    id,
                  ) => `<div class="li" data-a="openCli" data-id="${id}" data-t="pendencias"><div class="t"><b>${esc(cliNome(id))}</b><span class="chip red">${gr[id].length}</span></div>
    <div class="sm">${gr[id]
      .slice(0, 3)
      .map((p) => esc(p.titulo || "(sem título)"))
      .join(" · ")}${gr[id].length > 3 ? " …" : ""}</div></div>`,
                )
                .join("")
            : '<p class="sm">Nenhuma pendência em aberto.</p>',
        );
        return h;
      }

      function vListaClientes() {
        const q = S.busca.trim().toLowerCase();
        const l = S.clientes.filter((c) => (S.mostrarArq || !c.arquivado) && (!q || (c.unidade || "").toLowerCase().includes(q)));
        if (!l.length) return '<p class="sm">Nenhum cliente encontrado.</p>';
        return l
          .map((c) => {

      /* ---- importação do catálogo por arquivo Word (.docx) ----
         Estrutura esperada: Título 1 = "SIGLA — Nome do sistema"; Título 2 = nome do equipamento;
         parágrafo em negrito "Perfil X" = perfil; lista com marcadores = atividades. */
      const normTxt = (t) =>
        String(t || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/\s+/g, " ")
          .trim();
      function lerCatalogoHtml(html) {
        const doc = new DOMParser().parseFromString(html, "text/html"),
          tx = (el) => el.textContent.replace(/\s+/g, " ").trim(),
          out = [];
        let sis = null,
          eq = null,
          perf = null;
        for (const el of doc.body.children) {
          const tag = el.tagName;
          if (tag === "H1") {
            const p = tx(el).split(/\s+[—–-]\s+/);
            sis = { sigla: p[0].trim().toUpperCase(), nome: (p.slice(1).join(" - ") || p[0]).trim(), tipos: [] };
            out.push(sis);
            eq = perf = null;
          } else if (tag === "H2" && sis) {
            let nome = tx(el);
            const m = nome.match(/\(\s*j[áa] existe\s*:\s*([^)]+)\)/i); // "(já existe: Nome no catálogo)" usa o nome que já está no sistema
            nome = m ? m[1].trim() : nome.replace(/\(\s*j[áa] existe[^)]*\)/i, "").trim();
            eq = { nome, perfis: [] };
            sis.tipos.push(eq);
            perf = null;
          } else if (tag === "P" && eq && el.children.length === 1 && el.firstElementChild.tagName === "STRONG" && /^perfil\b/i.test(tx(el))) {
            perf = { nome: tx(el).replace(/^perfil\s*:?\s*/i, "") || "Padrão", atv: [] };
            eq.perfis.push(perf);
          } else if ((tag === "UL" || tag === "OL") && eq) {
            if (!perf) {
              perf = { nome: "Padrão", atv: [] };
              eq.perfis.push(perf);
            }
            el.querySelectorAll("li").forEach((li) => {
              const t = tx(li);
              if (t) perf.atv.push(t);
            });
          }
        }
        out.forEach((x) =>
          x.tipos.forEach((t) => {
            if (!t.perfis.length) t.perfis.push({ nome: "Padrão", atv: [] });
          }),
        );
        return out.filter((x) => x.sigla);
      }
      // compara o arquivo com o catálogo atual: o que é novo e o que já existe
      function resumoImport(lista) {
        const r = { sisNovos: [], eqNovos: [], eqExistentes: [] };
        for (const x of lista) {
          if (!S.cat.sis.some((y) => y.sigla === x.sigla)) r.sisNovos.push(x);
          for (const t of x.tipos) {
            const ex = S.cat.tipos.find((y) => y.sis === x.sigla && normTxt(y.nome) === normTxt(t.nome));
            (ex ? r.eqExistentes : r.eqNovos).push({ sigla: x.sigla, t, ex });
          }
        }
        return r;
      }
      function vCatImport() {
        const i = S.imp;
        let h = '<div class="card"><h2>Importar catálogo (Word)</h2>';
        if (!i) {
          return (
            h +
            `<p class="sm">Envie um arquivo <b>.docx</b> com os sistemas, equipamentos e atividades. Você confere o resumo antes de importar.</p>
          <input type="file" id="catfile" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
          <details><summary>Como montar o arquivo</summary><p class="sm">Use no Word: <b>Título 1</b> = <i>SIGLA — Nome do sistema</i> (ex.: CFTV — Circuito fechado de televisão); <b>Título 2</b> = nome do equipamento; uma linha em <b>negrito</b> começando com "Perfil" (ex.: <i>Perfil Padrão</i>); e as atividades em lista com marcadores. Para atualizar um equipamento que já existe, use exatamente o nome dele ou escreva <i>(já existe: Nome atual)</i> no título.</p></details></div>`
          );
        }
        const r = resumoImport(i.lista),
          adm = pode("catalogo.excluir");
        h += `<p><b>${esc(i.arquivo)}</b></p>
        <p class="sm">Sistemas novos: <b>${r.sisNovos.length}</b> · Equipamentos novos: <b>${r.eqNovos.length}</b> · Equipamentos que já existem: <b>${r.eqExistentes.length}</b></p>`;
        h += i.lista
          .map(
            (x) =>
              `<div class="eq"><b class="rd">${esc(x.sigla)}</b> <span class="sm">${esc(x.nome)}${r.sisNovos.includes(x) ? " · sistema novo" : ""}</span>${x.tipos
                .map((t) => {
                  const ex = r.eqExistentes.some((e) => e.t === t);
                  return `<div class="sm">• ${esc(t.nome)} — ${t.perfis.length} perfil(is), ${t.perfis.reduce((a, p) => a + p.atv.length, 0)} atividade(s) <span class="chip ${ex ? "am" : "ok"}">${ex ? "já existe" : "novo"}</span></div>`;
                })
                .join("")}</div>`,
          )
          .join("");
        if (r.eqExistentes.length)
          h += adm
            ? fChk("imp.subst", "Substituir os perfis e atividades dos equipamentos que já existem (os perfis antigos serão trocados)")
            : '<p class="sm">Os equipamentos que já existem não serão alterados (só o administrador pode substituí-los).</p>';
        return h + '<button class="b" data-a="impAplica">Importar</button><button class="b o" data-a="impCancela">Cancelar</button></div>';
      }
      async function lerArquivoCatalogo(f) {
        if (!f) return;
        if (!/\.docx$/i.test(f.name)) return toast(/\.pdf$/i.test(f.name) ? "PDF não é aceito: salve o arquivo como Word (.docx) e envie de novo." : "Envie um arquivo Word (.docx).");
        try {
          toast("Lendo o arquivo…");
          await lib("mammoth");
          const res = await window.mammoth.convertToHtml({ arrayBuffer: await f.arrayBuffer() }),
            lista = lerCatalogoHtml(res.value);
          if (!lista.length || !lista.some((x) => x.tipos.length)) return toast("Não encontrei sistemas e equipamentos. Confira os Títulos 1 e 2 do arquivo.");
          S.imp = { lista, arquivo: f.name, subst: false };
          render();
        } catch (e) {
          console.error(e);
          toast("Não consegui ler o arquivo: " + (e.message || e));
        }
      }

      // nível 2: equipamentos de um sistema, cada um recolhido (abre ao tocar)
      function vCatTipos() {

      /* ==================================================================
   7b. RELATÓRIOS DO SUPERVISOR (visitas e pendências, com Excel e PDF)
   ================================================================== */
      const REL0 = () => ({
        aba: "visitas",
        pronto: false,
        carregando: false,
        visitas: [],
        pend: [],
        f: {
          tec: "",
          cli: "",
          tipo: "",
          sit: "",
          base: "data",
          de: "",
          ate: "",
          ptec: "",
          pcli: "",
          psit: "",
          pbase: "criada",
          pde: "",
          pate: "",
        },
      });
      const dMs = (ms) => {
        if (!ms) return "";
        const d = new Date(ms);
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      };
      const noPeriodo = (d, de, ate) => (!de && !ate) || (!!d && (!de || d >= de) && (!ate || d <= ate));
      const diasEntre = (a, b) => (a && b ? Math.round((Date.parse(b) - Date.parse(a)) / 864e5) : "");
      const tecV = (v) => v.autorNome || v.tecnicos || "(sem técnico)";
      const tecP = (p) => p.criadaPorNome || "(sem registro)";
      const nomeCliRel = (id, nome) => (S.clientes.find((c) => c.id === id) || {}).unidade || nome || "(cliente removido)";
      const dataV = (v) => (S.rel.f.base === "criada" ? dMs(v.criada) : v.data);
      const dataP = (p) => (S.rel.f.pbase === "concluidaEm" ? p.concluidaEm : p.criada);

      async function carregaRel() {
        S.rel.carregando = true;
        try {
          const [v, p, ex] = await Promise.all([
            DB.list("visitas", filtro()),
            DB.list("pendencias", filtro()),
            S.me.papel !== "admin" && S.me.equipeId
              ? DB.list("visitas", { equipeAutorId: S.me.equipeId, excecao: true })
              : Promise.resolve([]),
          ]);
          S.rel.visitas = [...v, ...ex.filter((x) => !v.some((y) => y.id === x.id))];
          S.rel.pend = p;
        } catch (e) {
          console.error(e);
          toast("Não consegui carregar os dados: " + (e.code || e.message));
        }
        S.rel.pronto = true;
        S.rel.carregando = false;
        if (S.view === "relatorios") render();
      }
      function relVisitas() {
        const f = S.rel.f;
        return S.rel.visitas
          .filter(
            (v) =>
              (!f.tec || tecV(v) === f.tec) &&
              (!f.cli || v.clienteId === f.cli) &&
              (!f.tipo || v.tipo === f.tipo) &&
              (!f.sit || v.status === f.sit) &&
              noPeriodo(dataV(v), f.de, f.ate),
          )
          .sort((a, b) => String(b.data).localeCompare(String(a.data)) || (b.criada || 0) - (a.criada || 0));
      }
      function relPend() {
        const f = S.rel.f;
        return S.rel.pend
          .filter(
            (p) =>
              (!f.ptec || tecP(p) === f.ptec) &&
              (!f.pcli || p.clienteId === f.pcli) &&
              (!f.psit || (f.psit === "aberta" ? p.aberta : !p.aberta)) &&
              noPeriodo(dataP(p), f.pde, f.pate),
          )
          .sort((a, b) => String(b.criada).localeCompare(String(a.criada)));
      }
      const unicos = (arr, fn) =>
        [...new Map(arr.map((x) => [fn(x)[0], fn(x)[1]])).entries()].sort((a, b) => String(a[1]).localeCompare(String(b[1]), "pt-BR"));

      function relTotais() {
        const v = relVisitas(),
          p = relPend();
        const conc = p.filter((x) => !x.aberta && x.concluidaEm),
          dias = conc.map((x) => diasEntre(x.criada, x.concluidaEm)).filter((x) => x !== "");
        return {
          v,
          p,
          nv: v.length,
          prev: v.filter((x) => x.tipo === "preventiva").length,
          corr: v.filter((x) => x.tipo === "corretiva").length,
          enc: v.filter((x) => x.status === "encerrada").length,
          np: p.length,
          ab: p.filter((x) => x.aberta).length,
          co: p.filter((x) => !x.aberta).length,
          media: dias.length ? Math.round((dias.reduce((a, b) => a + b, 0) / dias.length) * 10) / 10 : null,
        };
      }
      const relEquipeTxt = () => (S.me.papel === "admin" ? (S.eqSel ? eqNome(S.eqSel) : "Todas as equipes") : eqNome(S.me.equipeId));
      function relFiltrosTxt() {
        const f = S.rel.f,
          per = (a, b) => (!a && !b ? "todo o período" : `${a ? bd(a) : "início"} a ${b ? bd(b) : "hoje"}`);
        const cn = (id) => (id ? nomeCliRel(id, "") : "todos");
        return {
          visitas: `Visitas: técnico ${f.tec || "todos"} · cliente ${cn(f.cli)} · tipo ${f.tipo || "todos"} · situação ${f.sit || "todas"} · ${f.base === "criada" ? "data de criação" : "data da visita"}: ${per(f.de, f.ate)}`,
          pend: `Pendências: aberta por ${f.ptec || "todos"} · cliente ${cn(f.pcli)} · situação ${f.psit === "aberta" ? "abertas" : f.psit === "concluida" ? "concluídas" : "todas"} · ${f.pbase === "concluidaEm" ? "data de conclusão" : "data de criação"}: ${per(f.pde, f.pate)}`,
        };
      }

      function vRelatorios() {
        if (!S.rel) S.rel = REL0();
        if (!S.rel.pronto) {
          if (!S.rel.carregando) carregaRel();
          return '<p class="center">Carregando dados do relatório…</p>';
        }
        const R = S.rel,
          f = R.f,
          T = relTotais(),
          MAX = 150;
        const tecs = unicos(R.visitas, (v) => [tecV(v), tecV(v)]),
          clis = unicos(R.visitas, (v) => [v.clienteId, nomeCliRel(v.clienteId, v.clienteNome)]);
        const ptecs = unicos(R.pend, (p) => [tecP(p), tecP(p)]),
          pclis = unicos(R.pend, (p) => [p.clienteId, nomeCliRel(p.clienteId, "")]);
        let h = `<div class="card"><div class="top"><b>${esc(relEquipeTxt())}</b><button class="b o s" data-a="relAtualiza" style="margin:0">Atualizar dados</button></div>
    <div class="tabs" style="margin:10px 0 0">${[
      ["visitas", "Visitas"],
      ["pend", "Pendências"],
    ]
      .map(([k, n]) => `<button class="${R.aba === k ? "on" : ""}" data-a="relAba" data-t="${k}">${n}</button>`)
      .join("")}</div></div>`;
        if (R.aba === "visitas") {
          h += card(
            "Filtros",
            `<div class="g">${fSel("rel.f.tec", "Técnico", [["", "Todos"], ...tecs.map(([k, n]) => [k, n])], { r: true })}${fSel("rel.f.cli", "Cliente", [["", "Todos"], ...clis], { r: true })}
      ${fSel(
        "rel.f.tipo",
        "Tipo",
        [
          ["", "Todos"],
          ["preventiva", "Preventiva"],
          ["corretiva", "Corretiva"],
        ],
        { r: true },
      )}${fSel(
        "rel.f.sit",
        "Situação",
        [
          ["", "Todas"],
          ["encerrada", "Encerrada"],
          ["rascunho", "Em andamento"],
        ],
        { r: true },
      )}
      ${fSel(
        "rel.f.base",
        "Período por",
        [
          ["data", "Data da visita"],
          ["criada", "Data de criação da visita"],
        ],
        { r: true },
      )}<div></div>${fIn("rel.f.de", "De", { type: "date", r: true })}${fIn("rel.f.ate", "Até", { type: "date", r: true })}</div>`,
          );
          h += card(
            "Totais",
            `<p><b>${T.nv}</b> visita(s) · ${T.prev} preventiva(s) · ${T.corr} corretiva(s) · ${T.enc} encerrada(s) · ${T.nv - T.enc} em andamento</p>`,
          );
          h += card(
            "Visitas",
            T.v.length
              ? T.v
                  .slice(0, MAX)
                  .map(
                    (
                      v,
                    ) => `<div class="li" style="cursor:default"><div class="t"><b>${bd(v.data)} · ${esc(nomeCliRel(v.clienteId, v.clienteNome))}</b><span><span class="chip ${v.tipo === "corretiva" ? "red" : "ok"}">${v.tipo === "corretiva" ? "Corretiva" : "Preventiva"}</span> <span class="chip ${v.status === "encerrada" ? "ok" : "warn"}">${v.status === "encerrada" ? "Encerrada" : "Em andamento"}</span>${v.excecao ? ' <span class="chip am">exceção</span>' : ""}</span></div>
      <div class="sm">${esc(tecV(v))} · ${esc(eqNome(v.equipeAutorId || v.equipeId))}${v.criada ? " · criada em " + bd(dMs(v.criada)) : ""}</div>
      <button class="b s" data-a="relAbreVisita" data-id="${v.id}">Abrir</button>${v.snap ? `<button class="b o s" data-a="relWord" data-id="${v.id}">Baixar Word</button>` : ""}</div>`,
                  )
                  .join("") +
                  (T.v.length > MAX ? `<p class="sm">Mostrando ${MAX} de ${T.v.length}. O arquivo exportado traz todas.</p>` : "")
              : '<p class="sm">Nenhuma visita com esses filtros.</p>',
          );
        } else {
          h += card(
            "Filtros",
            `<div class="g">${fSel("rel.f.ptec", "Aberta por", [["", "Todos"], ...ptecs], { r: true })}${fSel("rel.f.pcli", "Cliente", [["", "Todos"], ...pclis], { r: true })}
      ${fSel(
        "rel.f.psit",
        "Situação",
        [
          ["", "Todas"],
          ["aberta", "Em aberto"],
          ["concluida", "Concluídas"],
        ],
        { r: true },
      )}${fSel(
        "rel.f.pbase",
        "Período por",
        [
          ["criada", "Data de criação"],
          ["concluidaEm", "Data de conclusão"],
        ],
        { r: true },
      )}
      ${fIn("rel.f.pde", "De", { type: "date", r: true })}${fIn("rel.f.pate", "Até", { type: "date", r: true })}</div>`,
          );
          h += card(
            "Totais",
            `<p><b>${T.np}</b> pendência(s) · ${T.ab} em aberto · ${T.co} concluída(s)${T.media !== null ? ` · média de ${String(T.media).replace(".", ",")} dia(s) até concluir` : ""}</p>`,
          );
          h += card(
            "Pendências",
            T.p.length
              ? T.p
                  .slice(0, MAX)
                  .map(
                    (
                      p,
                    ) => `<div class="li" style="cursor:default"><div class="t"><b>${esc(p.titulo || "(sem título)")}</b><span class="chip ${p.aberta ? "red" : "ok"}">${p.aberta ? "Em aberto" : "Concluída"}</span></div>
      <div class="sm">${esc(nomeCliRel(p.clienteId, ""))} · aberta por ${esc(tecP(p))} em ${bd(p.criada)}${!p.aberta && p.concluidaEm ? ` · concluída em ${bd(p.concluidaEm)}${p.concluidaPorNome ? " por " + esc(p.concluidaPorNome) : ""}` : ""}</div></div>`,
                  )
                  .join("") +
                  (T.p.length > MAX ? `<p class="sm">Mostrando ${MAX} de ${T.p.length}. O arquivo exportado traz todas.</p>` : "")
              : '<p class="sm">Nenhuma pendência com esses filtros.</p>',
          );
        }
        h += `<div class="card"><h2>Exportar</h2><p class="sm">Gera um arquivo com as visitas e as pendências, cada uma com os filtros da sua aba.</p>
    <button class="b" data-a="relExcel">Baixar Excel</button><button class="b o" data-a="relPdf">Baixar PDF</button></div>`;
        return h;
      }

      /* ---- exportação (bibliotecas carregadas só quando necessário) ---- */
      const LIBS = {
        exceljs: "https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js",
        jspdf: "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js",
        autotable: "https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js",
        mammoth: "https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js",
      };
      const libP = {};
      const lib = (k) =>
        libP[k] ||
        (libP[k] = new Promise((ok, no) => {
          const e = document.createElement("script");
          e.src = LIBS[k];
          e.onload = ok;
          e.onerror = () => {
            delete libP[k];
            no(new Error("Não consegui carregar a biblioteca de exportação. Verifique a internet."));
          };
          document.head.appendChild(e);
        }));
      function relLinhas() {
        const T = relTotais(),
          eqV = (v) => eqNome(v.equipeAutorId || v.equipeId);
        return {
          T,
          visitas: T.v.map((v) => ({
            data: v.data,
            cliente: nomeCliRel(v.clienteId, v.clienteNome),
            equipe: eqV(v),
            tipo: v.tipo === "corretiva" ? "Corretiva" : "Preventiva",
            sit: v.status === "encerrada" ? "Encerrada" : "Em andamento",
            tec: tecV(v),
            criada: dMs(v.criada),
            enc: dMs(v.encerradaEm),
            exc: v.excecao ? `Sim – cliente da ${eqNome(v.equipeId)}` : "",
          })),
          pend: T.p.map((p) => ({
            cliente: nomeCliRel(p.clienteId, ""),
            equipe: eqNome(p.equipeId),
            titulo: p.titulo || "(sem título)",
            problema: p.problema || "",
            status: p.status || "",
            sit: p.aberta ? "Em aberto" : "Concluída",
            criada: p.criada || "",
            por: tecP(p),
            conc: p.concluidaEm || "",
            concPor: p.concluidaPorNome || "",
            dias: p.aberta ? "" : diasEntre(p.criada, p.concluidaEm),
          })),
        };
      }
      const xd = (iso) => (iso ? new Date(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10), 12) : null);
      const agoraTxt = () => {
        const d = new Date();
        return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      };

      async function relExcel() {
        try {
          await lib("exceljs");
          const L = relLinhas(),
            F = relFiltrosTxt(),
            wb = new ExcelJS.Workbook();
          wb.creator = S.me.nome;
          wb.created = new Date();
          const red = { type: "pattern", pattern: "solid", fgColor: { argb: "FFC81E2C" } };
          const r = wb.addWorksheet("Resumo");
          r.columns = [{ width: 26 }, { width: 110 }];
          [
            ["Relatório de visitas e pendências", ""],
            ["Equipe", relEquipeTxt()],
            ["Gerado em", agoraTxt()],
            ["Gerado por", `${S.me.nome} (${PAPEIS[S.me.papel]})`],
            ["", ""],
            ["Filtros das visitas", F.visitas],
            ["Filtros das pendências", F.pend],
            ["", ""],
            ["Visitas", `${L.T.nv} · ${L.T.prev} preventiva(s) · ${L.T.corr} corretiva(s) · ${L.T.enc} encerrada(s)`],

            const c = document.createElement("canvas");
            c.width = i.naturalWidth;
            c.height = i.naturalHeight;
            c.getContext("2d").drawImage(i, 0, 0);
            ok({ url: c.toDataURL("image/png"), w: i.naturalWidth, h: i.naturalHeight });
          };
          i.onerror = () => ok(null);
          i.src = "logo.png";
        });

      async function relPdf() {
        try {

            M = 12;
          const logo = await logoDados();
          let y = M;
          if (logo) {
            const w = 62,
              h = (w * logo.h) / logo.w;
            doc.addImage(logo.url, "PNG", M, y, w, h);
            y += h + 5;
          }
          doc.setFontSize(15);
          doc.setFont("helvetica", "bold");
          doc.text("Relatório de visitas e pendências", M, y + 4);
          y += 10;
          doc.setFontSize(9.5);
          doc.setFont("helvetica", "normal");

            `Equipe: ${relEquipeTxt()}   ·   Gerado em ${agoraTxt()} por ${S.me.nome}`,

            F.pend,
            `Visitas: ${L.T.nv} (${L.T.prev} preventiva(s), ${L.T.corr} corretiva(s), ${L.T.enc} encerrada(s))   ·   Pendências: ${L.T.np} (${L.T.ab} em aberto, ${L.T.co} concluída(s)${L.T.media !== null ? ", média de " + String(L.T.media).replace(".", ",") + " dia(s) até concluir" : ""})`,
          ];
          linhas.forEach((t) => {
            const q = doc.splitTextToSize(t, W - 2 * M);
            doc.text(q, M, y);
            y += q.length * 4.4;
          });
          y += 2;
          const head = (c) => [c],
            estilo = { fontSize: 8, cellPadding: 1.6, overflow: "linebreak" },
            cab = { fillColor: [200, 30, 44], textColor: 255 };
          const dd = (x) => (x ? bd(x) : "");
          doc.setFont("helvetica", "bold");
          doc.setFontSize(11);
          doc.text(`Visitas (${L.visitas.length})`, M, y + 3);
          doc.autoTable({
            startY: y + 5,
            margin: { left: M, right: M, top: M, bottom: 14 },
            styles: estilo,
            headStyles: cab,
            head: head(["Data", "Cliente", "Equipe", "Tipo", "Situação", "Técnico", "Criada em", "Encerrada em", "Exceção"]),
            body: L.visitas.length
              ? L.visitas.map((v) => [dd(v.data), v.cliente, v.equipe, v.tipo, v.sit, v.tec, dd(v.criada), dd(v.enc), v.exc])
              : [["Nenhuma visita com esses filtros.", "", "", "", "", "", "", "", ""]],
          });
          let y2 = doc.lastAutoTable.finalY + 8;
          if (y2 > H - 40) {
            doc.addPage();
            y2 = M;
          }
          doc.setFont("helvetica", "bold");
          doc.setFontSize(11);
          doc.text(`Pendências (${L.pend.length})`, M, y2 + 3);
          doc.autoTable({
            startY: y2 + 5,
            margin: { left: M, right: M, top: M, bottom: 14 },
            styles: estilo,
            headStyles: cab,
            head: head(["Cliente", "Título", "Status", "Situação", "Aberta por", "Criada em", "Concluída em", "Concluída por", "Dias"]),
            body: L.pend.length

                  p.status,
                  p.sit,
                  p.por,
                  dd(p.criada),

                  p.concPor,
                  p.dias === "" ? "" : String(p.dias),
                ])
              : [["Nenhuma pendência com esses filtros.", "", "", "", "", "", "", "", ""]],
          });
          const n = doc.getNumberOfPages();
          for (let i = 1; i <= n; i++) {
            doc.setPage(i);
            doc.setFontSize(8);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(120);
            doc.text(`Controller BMS · ${relEquipeTxt()}`, M, H - 6);

        }

      function afterChange(p) {
        const root = p.split(".")[0];
        if (root === "visit") {
          const v = S.visit;
          if (!podeEditarVisita(v)) return;
          later("visit:" + v.id, () => gravar("visitas", v.id, v));
        } else if (root === "cli") {
          const c = S.cli;
          later("cli:" + c.id, () => gravar("clientes", c.id, c));
        } else if (root === "cat") {
          const c = S.cat;
          later("cat", () => gravar("catalogo", "dados", c));
        } else if (root === "cfg") {
          const c = S.cfg;
          later("cfg", () => gravar("config", "dados", c));
        } else if (root === "usuarios") {
          const u = S.usuarios[+p.split(".")[1]];
          later("us:" + u.uid, () => gravar("usuarios", u.uid, u));
        } else if (root === "eq") {
          const e = S.eq[+p.split(".")[1]];
          later("eq:" + e.id, () => gravar("equipes", e.id, e));
        } else if (root === "pc") {
          const o = S.pc[+p.split(".")[1]];
          later("pc:" + o.id, () => gravar("pendencias", o.id, semTransitorios(o)));
        }
      }

      async function newVisit(cliId, tipo, aut) {
        if (!cliId) return toast("Escolha o cliente");
        try {
          const c = await DB.get("clientes", cliId);
          if (!c) return toast("Cliente não encontrado");
          let vid = uid();
          if (aut) {
            // exceção: reserva a autorização para esta visita (só uma pessoa da equipe consegue)
            const fresh = await DB.get("autorizacoes", aut.id);
            if (!fresh || fresh.status !== "aguardando" || fresh.validaAteMs < Date.now())
              return toast("Esta autorização não está mais disponível.");
            try {
              await DB.set("autorizacoes", aut.id, {
                ...fresh,
                status: "em_uso",
                visitaId: vid,
                usadaPorId: S.user.uid,
                usadaPorNome: S.me.nome,
                usadaEm: Date.now(),
              });
            } catch (e) {
              console.error(e);
              return toast("Não consegui iniciar: outra pessoa da equipe pode ter começado esta visita.");
            }
          }
          const pend = (await DB.list("pendencias", fCli(c)))
            .filter((p) => p.aberta)
            .sort((a, b) => String(a.criada).localeCompare(String(b.criada)))
            .map((p) => ({ ...clone(p), concluir: false }));
          const v = {
            id: vid,
            excecao: !!aut,
            autorizacaoId: aut ? aut.id : "",
            clienteId: cliId,
            clienteNome: c.unidade,
            tipo,
            status: "rascunho",
            data: hoje(),
            equipeId: c.equipeId,
            autorId: S.user.uid,
            autorNome: meuNome(),
            equipeAutorId: S.me.equipeId || c.equipeId,

      async function openVisit(id) {

          try {

          }
          if (!S.vcli && v.excecao) S.vcli = { id: v.clienteId, unidade: v.clienteNome, eqs: [], equipeId: v.equipeId }; // sem acesso ao cliente depois da exceção

      }
      const pushHist = (p, e) => {
        p.historico = (p.historico || []).filter((h) => h.visitaId !== e.visitaId);
        p.historico.push(e);
