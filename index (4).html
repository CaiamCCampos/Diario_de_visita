      async function encerrar() {
        if (!podeEditarVisita(S.visit)) return;
        flushAll();
        const v = S.visit,
          c = S.vcli,
          data = v.data;
        if (
          v.tipo === "preventiva" &&
          !Object.values(v.sis).some(Boolean) &&
          !confirm("Nenhum sistema foi selecionado. Gerar o relatório mesmo assim?")
        )
          return;
        if (
          v.tipo === "corretiva" &&
          !v.itens.some((i) => i.titulo || i.problema || i.diag || i.texto) &&
          !confirm("Nenhum atendimento foi preenchido. Gerar o relatório mesmo assim?")
        )
          return;
        try {
          for (const p of v.pend) {
            // pendências já existentes (e novas digitadas na visita)
            if (!podeEditarPend(p)) {
              // pendência de outro técnico: só solução e conclusão, sobre a versão atual do banco
              const cur = await DB.get("pendencias", p.id);
              if (!cur) continue;
              cur.solucao = p.solucao;
              if (p.concluir && cur.aberta) {
                cur.aberta = false;
                cur.concluidaEm = data;
                cur.concluidaPorId = S.user.uid;
                cur.concluidaPorNome = S.me.nome;
                pushHist(cur, { data, visitaId: v.id, status: "Concluída", por: S.me.nome });
              }
              gravar("pendencias", cur.id, cur);
              continue;
            }
            p.clienteId = c.id;
            p.equipeId = c.equipeId;
            p.aberta = !p.concluir;
            if (p.concluir) {
              p.concluidaEm = data;
              p.concluidaPorId = S.user.uid;
              p.concluidaPorNome = S.me.nome;
            } else {
              delete p.concluidaEm;
              delete p.concluidaPorId;
              delete p.concluidaPorNome;
            }
            pushHist(p, { data, visitaId: v.id, status: p.concluir ? "Concluída" : p.status || "", por: S.me.nome });
            gravar("pendencias", p.id, semTransitorios(p));
          }
          for (const it of v.itens) {
            // corretivas não resolvidas viram pendência
            const old = it.pendId ? await DB.get("pendencias", it.pendId) : null;
            if (!it.resolvido) {
              if (!it.pendId) it.pendId = uid();
              const p = old || {
                id: it.pendId,
                clienteId: c.id,
                equipeId: c.equipeId,
                criadaPorId: S.user.uid,
                criadaPorNome: S.me.nome,
                criada: data,
                origemVisita: v.id,
                historico: [],
              };
              Object.assign(p, {
                titulo: it.titulo,
                problema: it.problema,
                diag: it.diag,
                acoes: it.acoes || [],
                solucao: it.solucao,
                obs: it.obs,
                texto: it.texto,
                status: it.status || "",
                aberta: true,
              });
              delete p.concluidaEm;
              pushHist(p, { data, visitaId: v.id, status: it.status || "" });
              gravar("pendencias", p.id, p);
            } else if (old) {
              old.aberta = false;
              old.concluidaEm = data;
              old.concluidaPorId = S.user.uid;
              old.concluidaPorNome = S.me.nome;
              pushHist(old, { data, visitaId: v.id, status: "Concluída", por: S.me.nome });
              gravar("pendencias", old.id, old);
            }
          }
          v.snap = makeSnap(v, c);
          v.status = "encerrada";
          v.encerradaEm = Date.now();
          v.clienteNome = c.unidade;
          gravar("visitas", v.id, v);
          const cf = await DB.get("clientes", c.id);
          if (cf && (!cf.ultimaVisita || cf.ultimaVisita < data)) {
            cf.ultimaVisita = data;
            gravar("clientes", c.id, cf);
          }
          await gerarDocx(v.snap);
          toast("Relatório gerado");
          render();
          if (v.excecao && v.autorizacaoId) {
            // termina o acesso temporário depois que tudo foi gravado
            await Promise.all([...gravPend]);
            const a = await DB.get("autorizacoes", v.autorizacaoId);
            if (a && a.status === "em_uso" && a.visitaId === v.id)
              await DB.set("autorizacoes", a.id, { ...a, status: "concluida", ativa: false, concluidaEm: Date.now() });
          }
        } catch (e) {
          console.error(e);
          toast("Erro ao encerrar: " + (e.code || e.message));
        }
      }

      function makeSnap(v, c) {
        const prev = v.tipo === "preventiva";
        const sistemas = prev
          ? S.cat.sis
              .filter((s) => v.sis[s.sigla])
              .map((s) => {
                const eqs = c.eqs.filter((e) => tp(e.tipo).sis === s.sigla);
                return {
                  sigla: s.sigla,
                  nome: s.nome,
                  previstos: eqs.map(nmEq),
                  feitos: eqs
                    .filter((e) => !(v.ver[e.id] || {}).off)
                    .map((e) => {
                      const t = tp(e.tipo),
                        st = v.ver[e.id] || {};
                      return {
                        nome: nmEq(e),
                        atividades: atvDe(e).filter((a, k) => !(st.no || {})[k]),
                        dias: t.extra === "dias" ? st.dias || [] : [],
                        status: st.st || STATUS_EQ[0],
                      };
                    }),
                };
              })
          : [];
        return {
          tipo: v.tipo,
          data: v.data,
          hora: v.hora,
          numero: (v.numero || "").trim(),
          ini: v.ini,
          fim: v.fim,
          tecnicos: v.tecnicos,
          corr: v.corr,
          custo: v.custo,
          obs: v.obs,
          cab: {
            empresa: c.empresa,
            unidade: c.unidade,
            area: c.area,
            sisMan: c.sisMan,
            tipoOc: prev ? "PREVENTIVA" : "CORRETIVA",
            equipCab: c.equipCab,
            areaVisita: c.areaVisita || "Comum/Técnica",
            emitente: eqNome(v.equipeAutorId || c.equipeId),
            solic: eqNome(v.equipeAutorId || c.equipeId),
            exec: eqNome(v.equipeAutorId || c.equipeId),
          },
          sistemas,
          itens: clone(v.itens),
          pend: clone(v.pend),
        };
      }

      async function backup() {
        try {
          const [clientes, visitas, pendencias] = await Promise.all([
            DB.list("clientes", filtro()),
            DB.list("visitas", filtro()),
            DB.list("pendencias", filtro()),
          ]);
          const blob = new Blob(
            [
              JSON.stringify(
                { gerado: new Date().toISOString(), equipes: S.eq, catalogo: S.cat, config: S.cfg, clientes, visitas, pendencias },
                null,
                1,
              ),
            ],
            { type: "application/json" },
          );
          baixar(blob, `backup_diario_${hoje()}.json`);
        } catch (e) {
          toast("Erro no backup: " + (e.code || e.message));
        }
      }
      function baixar(blob, nome) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = nome;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          URL.revokeObjectURL(a.href);
          a.remove();
        }, 1500);
      }

        addTipo(el) {
          const t = { id: uid(), sis: el.dataset.s, nome: "Novo equipamento", extra: "", perfis: [{ nome: "Padrão", atv: [] }] };
          S.cat.tipos.push(t);
          S.catAberto = t.id;
          S.catBusca = "";
          afterChange("cat.x");
          render();
        },
        addPerfil(el) {
          const t = S.cat.tipos[+el.dataset.i];
          t.perfis.push({ nome: "Novo perfil", atv: [] });
          S.catAberto = t.id;
          afterChange("cat.x");
          render();
        },
        delPerfil(el) {
          if (!pode("catalogo.excluir") || !confirm("Remover este perfil?")) return;
          S.catAberto = S.cat.tipos[+el.dataset.i].id;
          S.cat.tipos[+el.dataset.i].perfis.splice(+el.dataset.j, 1);
          afterChange("cat.x");
          render();
        },
        async delTipo(el) {
          if (!pode("catalogo.excluir")) return;
          const t = S.cat.tipos[+el.dataset.i];
          let todos = [];
          try {
            todos = await DB.list("clientes");
          } catch (e) {
            return toast("Não consegui conferir o uso: " + (e.code || e.message));
          }
          if (todos.some((c) => (c.eqs || []).some((e) => e.tipo === t.id)))
            return alert("Este tipo está em uso por algum cliente. Troque o tipo dos equipamentos antes de remover.");
          if (!confirm("Remover este tipo?")) return;
          S.cat.tipos.splice(+el.dataset.i, 1);
          afterChange("cat.x");
          render();
        },
        async delCli() {
          const c = S.cli;
          if (!c || !pode("cliente.editar")) return;
          if (!confirm(`Excluir o cliente "${c.unidade}"?\nAs visitas e as pendências dele também serão apagadas. Não dá para desfazer.`))
            return;
          if (!confirm("Confirma a exclusão definitiva deste cliente?")) return;
          try {
            const f = fCli(c);
            const [vs, ps] = await Promise.all([DB.list("visitas", f), DB.list("pendencias", f)]);
            [...vs.map((v) => "visit:" + v.id), ...ps.map((p) => "pc:" + p.id), "cli:" + c.id].forEach((k) => {
              clearTimeout(timers[k]);
              delete timers[k];
              delete fns[k];
            });
            await Promise.all([
              ...vs.map((v) => DB.del("visitas", v.id)),
              ...ps.map((p) => DB.del("pendencias", p.id)),
              DB.del("clientes", c.id),
            ]);
            S.clientes = S.clientes.filter((x) => x.id !== c.id);
            S.cli = null;
            S.hist = null;
            S.pc = null;
            toast("Cliente excluído");
            go("clientes");
          } catch (e) {
            console.error(e);
            toast("Erro ao excluir: " + (e.code || e.message));
          }
        },
        addEquipe() {
          const nome = (prompt("Nome da equipe (sai como emitente no relatório):", "") || "").trim();
          if (!nome) return;
          const e = { id: uid(), nome };
          S.eq.push(e);
          gravar("equipes", e.id, e);
          render();
        },
        async delEquipe(el) {
          const e = S.eq[+el.dataset.i];
          try {
            const [c, u] = await Promise.all([DB.list("clientes", { equipeId: e.id }), DB.list("usuarios", { equipeId: e.id })]);
            if (c.length || u.length)
              return alert(`Esta equipe não pode ser excluída: tem ${c.length} cliente(s) e ${u.length} usuário(s). Mude ou exclua antes.`);
            if (!confirm(`Excluir a equipe "${e.nome}"?`)) return;
            clearTimeout(timers["eq:" + e.id]);
            delete timers["eq:" + e.id];
            delete fns["eq:" + e.id];
            await DB.del("equipes", e.id);
            S.eq.splice(+el.dataset.i, 1);
            if (S.eqSel === e.id) S.eqSel = "";
            render();
          } catch (err) {
            console.error(err);
            toast("Erro: " + (err.code || err.message));
          }
        },
        async criarUser() {
          if (!pode("usuarios.gerir")) return;
          const n = S.nu,
            email = (n.email || "").trim(),
            nome = (n.nome || "").trim();
          if (!email || !nome || (n.senha || "").length < 6) return toast("Preencha e-mail, nome e uma senha de no mínimo 6 caracteres.");
          if (n.papel !== "admin" && !n.equipeId) return toast("Escolha a equipe do usuário.");
          try {
            const id = await DB.criaLogin(email, n.senha);
            await DB.set("usuarios", id, {
              uid: id,
              email,
              nome,
              papel: n.papel,
              equipeId: n.papel === "admin" ? "" : n.equipeId,
              ativo: true,
              trocarSenha: !!n.trocar, // se marcado, no primeiro acesso a pessoa precisa criar a própria senha
              criado: Date.now(),
            });
            S.nu = novoNU();
            await carregaUsuarios();
            toast("Usuário criado");
          } catch (e) {
            console.error(e);
            alert(
              e.code === "auth/invalid-credential"
                ? "Este e-mail já tem login no Firebase. Digite a senha atual dele para vincular, ou apague o login no Console do Firebase."
                : AUTH_ERR[e.code] || "Erro: " + (e.code || e.message),
            );
          }
        },
        async exigeTroca(el) {
          const u = S.usuarios[+el.dataset.i];
          if (!u || u.uid === S.me.uid || !pode("usuarios.gerir")) return;
          const liga = el.dataset.v0 !== "0";
          if (liga && !confirm(`Exigir que ${u.nome || u.email} crie uma nova senha no próximo acesso?`)) return;
          u.trocarSenha = liga;
          await gravar("usuarios", u.uid, u);
          toast(liga ? "Troca de senha exigida no próximo acesso" : "Exigência cancelada");
          render();
        },
        toggleUser(el) {
          const u = S.usuarios[+el.dataset.i];
          if (!u || u.uid === S.me.uid) return;
          if (u.ativo !== false && !confirm(`Desativar ${u.nome}? Ele não conseguirá mais usar o sistema.`)) return;
          u.ativo = u.ativo === false;
          gravar("usuarios", u.uid, u);
          render();
        },
        async delUser(el) {
          const u = S.usuarios[+el.dataset.i];
          if (!u || u.uid === S.me.uid || !pode("usuarios.gerir")) return;
          if (
            !confirm(
              `Remover ${u.nome} (${u.email}) do sistema?\nEle perde o acesso e some da lista. As visitas e pendências dele continuam com o nome dele.\nO login continua no Firebase: para apagá-lo, remova em Authentication → Users.`,
            )
          )
            return;
          try {
            clearTimeout(timers["us:" + u.uid]);
            delete timers["us:" + u.uid];
            delete fns["us:" + u.uid];
            await DB.del("usuarios", u.uid);
            S.usuarios.splice(+el.dataset.i, 1);
            render();
            toast("Usuário removido");
          } catch (e) {
            console.error(e);
            toast("Erro ao remover: " + (e.code || e.message));
          }
        },
        async resetUser(el) {
          const u = S.usuarios[+el.dataset.i];
          try {
            await DB.authM.sendPasswordResetEmail(DB.auth, u.email);
            toast("Enviei o e-mail de nova senha");
          } catch (e) {
            toast(AUTH_ERR[e.code] || "Erro: " + e.code);
          }
        },
        backup,
      };
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-a],[data-v]");
        if (!b) return;
        if (b.dataset.v) {
          flushAll();
          if (b.dataset.v === "catalogo") {
            S.catSis = "";
            S.catBusca = "";
            S.catAberto = "";
          }
          return go(b.dataset.v);
        }
        const f = A[b.dataset.a];
        if (f) f(b);
      });

      /* ==================================================================
   10. GERAÇÃO DO WORD (a partir da cópia congelada da visita)
   ================================================================== */
      async function gerarDocx(sn) {
        if (typeof docx === "undefined") return toast("Biblioteca do Word não carregou. Verifique a internet.");
        const d = docx,
          F = "Arial",
          W = 10000,
          DX = d.WidthType.DXA;
        const ln = { style: d.BorderStyle.SINGLE, size: 6, color: "000000" },
          bo = { top: ln, bottom: ln, left: ln, right: ln };
        const R = (t, o) => new d.TextRun({ text: t, font: F, size: 16, ...o }),
          B = (t) => R(t, { bold: true });
        const P = (ch, o) => new d.Paragraph({ spacing: { before: 40, after: 40 }, children: [].concat(ch), ...o });
        const sh = (f) => ({ type: d.ShadingType.CLEAR, fill: f, color: "auto" });
        const C = (ch, w, o = {}) =>
          new d.TableCell({
            borders: bo,
            width: { size: w, type: DX },
            margins: { top: 60, bottom: 60, left: 100, right: 100 },
            children: ch.length ? ch : [P(R(""))],
            ...o,
          });
        const Lb = (t, w) => C([P(B(t))], w, { shading: sh("EDEDED") });
        const TR = (x) => new d.TableRow({ children: x });
        const Tb = (r, cols) =>
          new d.Table({
            width: { size: W, type: DX },
            columnWidths: cols,
            layout: d.TableLayoutType.FIXED,
            alignment: d.AlignmentType.CENTER,
            indent: { size: 0, type: DX },
            rows: r,
          });
        const gap = () => P(R("", { size: 8 }), { spacing: { before: 0, after: 0 } });
        const box = (ch) => Tb([TR([C(ch, W)])], [W]);
        const sec = (t, ch) =>
          Tb([new d.TableRow({ cantSplit: true, children: [C([P(B(t))], W, { shading: sh("EDEDED") })] }), TR([C(ch, W)])], [W]);
        const lines = (t) =>
          (t || "")
            .split("\n")
            .map((s) => s.trim())
            .filter(Boolean)
            .map((l) => P(R(l)));
        const cab = sn.cab,
          prev = sn.tipo === "preventiva",
          HS = 12; // respostas do cabeçalho: 6 pt (tópicos e resto do documento: 8 pt)

        // ---- cabeçalho (Detectada e Prioridade ficam em branco, para preencher no Word)
        const L = [
          ["Empresa:", cab.empresa],
          ["Unidade de Man.:", cab.unidade],
          ["Área:", cab.area],
          ["Sistema de Man.:", cab.sisMan],
          ["Detectada:", null],
          ["Prioridade:", null],
        ];
        const Rr = [
          ["Tipo de Ocorrência:", cab.tipoOc],
          ["Equipamento:", cab.equipCab],
          ["Capacidade:", ""],
          ["Marca:", ""],
          ["Modelo:", ""],
          ["Data / Hora:", bd(sn.data) + "   " + sn.hora],
        ];
        const cl = [1800, 2800, 650, 2150, 2600];
        const head = Tb(
          L.map((l, i) =>
            TR([
              Lb(l[0], cl[0]),
              C([P(R(l[1] || "", { size: HS }))], cl[1]),
              ...(i === 0
                ? [
                    new d.TableCell({
                      borders: bo,
                      rowSpan: 6,
                      width: { size: cl[2], type: DX },
                      verticalAlign: d.VerticalAlign.CENTER,
                      textDirection: d.TextDirection.BOTTOM_TO_TOP_LEFT_TO_RIGHT,
                      children: [P([B("Nº: "), R(sn.numero || "", { size: 32 })], { alignment: d.AlignmentType.CENTER })],
                    }),
                  ]
                : []),
              Lb(Rr[i][0], cl[3]),
              C([P(R(Rr[i][1], { size: HS }))], cl[4]),
            ]),
          ),
          cl,
        );

        // ---- itens de corretiva / pendência
        const rot = (r, t) => (t ? P([B(r + ": "), R(t)]) : null);
        function itemParas(it, rotStatus) {
          const o = [],
            est = it.problema || it.diag || (it.acoes || []).length || it.solucao || it.obs;
          if (it.titulo) o.push(P(est ? [B("Equipamento: "), R(it.titulo)] : B(it.titulo), { spacing: { before: 140, after: 40 } }));
          o.push(rot("Problema Reportado", it.problema), rot("Diagnóstico", it.diag));
          if ((it.acoes || []).length) {
            o.push(P(B("Ações Corretivas Executadas:")));
            it.acoes.forEach((a, k) => o.push(P(R(`${roman(k + 1)}.  ${a}`), { indent: { left: 500 } })));
          }
          o.push(rot("Solução proposta", it.solucao), rot("Observação técnica", it.obs));
          o.push(...lines(it.texto));
          if (it.status) o.push(P(B(rotStatus + ": " + it.status)));
          return o.filter(Boolean);
        }
        const itens = sn.itens.filter((i) => i.titulo || i.problema || i.diag || i.texto || (i.acoes || []).length || i.solucao || i.obs);
        const pe = [];
        sn.pend
          .filter((p) => p.titulo || p.problema || p.diag || p.texto || (p.acoes || []).length || p.solucao || p.obs)
          .forEach((p) => pe.push(...itemParas({ ...p, status: p.concluir ? "Concluída em " + bd(sn.data) : p.status }, "Status")));

        // ---- início e final da visita
        const ini = [P(B("Início da Visita Técnica")), P([B("Técnicos: "), R(sn.tecnicos)]), P([B("Área: "), R(cab.areaVisita)])];
        const fin = [P(B("Final da Visita Técnica")), P([B("Técnicos: "), R(sn.tecnicos)])];
        if (prev) {
          ini.push(
            P(R("Estão previstas as realizações das seguintes atividades preventivas:", { bold: true, underline: {} }), {
              spacing: { before: 160, after: 80 },
            }),
          );
          sn.sistemas.forEach((s, n) => {
            ini.push(P(B(`${n + 1}.  ${s.sigla} (${s.nome})`), { indent: { left: 400 }, spacing: { before: 120, after: 40 } }));
            s.previstos.forEach((t) => ini.push(P(R("•   " + t), { indent: { left: 800 } })));
          });
          fin.push(
            P(R("Preventiva – Área: " + cab.areaVisita + "   Ações realizadas:", { bold: true, underline: {} }), {
              spacing: { before: 160, after: 80 },
            }),
          );
          sn.sistemas.forEach((s) => {
            if (!s.feitos.length) return;
            fin.push(P(B(`${s.sigla} (${s.nome})`), { spacing: { before: 160, after: 40 } }));
            s.feitos.forEach((e, n) => {
              fin.push(P(B(`${n + 1}.  ${e.nome}`), { indent: { left: 400 }, spacing: { before: 100, after: 40 } }));
              if (e.atividades.length) {
                fin.push(P(R("Atividades realizadas:"), { indent: { left: 800 } }));
                e.atividades.forEach((a, k) => {
                  fin.push(P(R(`${roman(k + 1)}.  ${a}`), { indent: { left: 1200 } }));
                  if (k === 0) e.dias.forEach((x) => fin.push(P(R("•   " + x), { indent: { left: 1700 } })));
                });
              }
              fin.push(P(B("Status: " + e.status), { indent: { left: 800 } }));
            });
          });
        } else {
          ini.push(P(R("Atendimento corretivo solicitado:", { bold: true, underline: {} }), { spacing: { before: 160, after: 80 } }));
          itens.forEach((i) => ini.push(P(R("•   " + [i.titulo, i.problema].filter(Boolean).join(": ")), { indent: { left: 400 } })));
          fin.push(
            P(R("Corretiva – Área: " + cab.areaVisita + "   Ações realizadas:", { bold: true, underline: {} }), {
              spacing: { before: 160, after: 80 },
            }),
          );
          itens.forEach((i) => fin.push(...itemParas(i, "Status Final")));
        }

        // ---- rodapé do relatório
        const mi = (s) => {
            const [h, m] = (s || "").split(":");
            return +h * 60 + +m;
          },
          tt = mi(sn.fim) - mi(sn.ini);
        const tot = isNaN(tt) || tt < 0 ? "" : pad(Math.floor(tt / 60)) + ":" + pad(tt % 60),
          fc = [1700, 3402, 1300, 1700, 1898];
        const foot = Tb(
          [
            TR([
              Lb("Solicitado por:", fc[0]),
              C([P(R(cab.solic))], fc[1]),
              Lb("INÍCIO", fc[2]),
              Lb("Data: " + bd(sn.data), fc[3]),
              C([P(R("Hora: " + sn.ini))], fc[4]),
            ]),
            TR([
              Lb("Executado por:", fc[0]),
              C([P(R(cab.exec))], fc[1]),
              Lb("TÉRMINO", fc[2]),
              Lb("Data: " + bd(sn.data), fc[3]),
              C([P(R("Hora: " + sn.fim))], fc[4]),
            ]),
            TR([
              Lb("Custo:", fc[0]),
              C([P(R("R$ " + (sn.custo || "")))], fc[1]),
              new d.TableCell({
                borders: bo,
                columnSpan: 3,
                width: { size: fc[2] + fc[3] + fc[4], type: DX },
                margins: { top: 60, bottom: 60, left: 100, right: 100 },
                children: [P(B("Tempo Total Trabalhado (Horas:Minutos): " + tot))],
              }),
            ]),
          ],
          fc,
        );

        let headers;
        try {
          const r = await fetch("logo.png");
          if (r.ok)
            headers = {
              default: new d.Header({
                children: [
                  P(
                    new d.ImageRun({
                      type: "png",
                      data: new Uint8Array(await r.arrayBuffer()),
                      transformation: { width: 220, height: 30 },
                    }),
                    { spacing: { after: 0 } },
                  ),
                ],
              }),
            };
        } catch (e) {}
        const corpo = [
          head,
          gap(),
          Tb([TR([Lb("OCORRÊNCIA", 1800), C([P(B("EMITENTE: " + cab.emitente))], W - 1800)])], [1800, W - 1800]),
          box(ini),
          gap(),
          Tb(
            [TR([Lb("CORREÇÃO", 1800), C([P(R(CORRECOES.map((x) => (x === sn.corr ? "(x) " : "( ) ") + x).join("        ")))], W - 1800)])],
            [1800, W - 1800],
          ),
          box(fin),
          gap(),
        ];
        if (prev)
          corpo.push(
            sec(
              "Corretivas técnicas:",
              itens.flatMap((i) => itemParas(i, "Status Final")),
            ),
            gap(),
          );
        corpo.push(sec("Pendências:", pe), gap());
        if (sn.obs) corpo.push(sec("Observação Técnica:", lines(sn.obs)), gap());
        corpo.push(foot);

        const doc = new d.Document({
          creator: "Controller BMS",
          title: "Relatório de Visita Técnica",
          styles: { default: { document: { run: { font: F, size: 16 } } } },
          sections: [
            {
              properties: {
                page: { size: { width: 11906, height: 16838 }, margin: { top: 1134, bottom: 851, left: 851, right: 851, header: 454 } },
              },
              headers,
              footers: {
                default: new d.Footer({
                  children: [
                    P(
                      [
                        R("Página ", { size: 16 }),
                        new d.TextRun({ children: [d.PageNumber.CURRENT], font: F, size: 16 }),
                        R(" de ", { size: 16 }),
                        new d.TextRun({ children: [d.PageNumber.TOTAL_PAGES], font: F, size: 16 }),
                      ],
                      { alignment: d.AlignmentType.RIGHT },
                    ),
                  ],
                }),
              },
              children: corpo,
            },
          ],
        });
        const nome = cab.unidade
          .normalize("NFD")
          .replace(/[̀-ͯ]/g, "")
          .replace(/[^\w]+/g, "_")
          .replace(/^_|_$/g, "");
        baixar(await d.Packer.toBlob(doc), `${nome}_Visita_Tecnica${prev ? "" : "_Corretiva"}_${bd(sn.data).replace(/\//g, "_")}.docx`);
      }

      boot();

      // Corretor ortográfico (pt-BR) em todos os campos de texto, inclusive os criados depois
      (function () {
        const sel = 'textarea, input:not([type]), input[type="text"], input[type="search"]';
        const aplica = (root) =>
          (root.querySelectorAll ? root.querySelectorAll(sel) : []).forEach((el) => {
            el.setAttribute("spellcheck", "true");
            el.setAttribute("lang", "pt-BR");
            el.setAttribute("autocorrect", "on");
            if (!el.hasAttribute("autocapitalize")) el.setAttribute("autocapitalize", "sentences");
          });
        aplica(document);
        new MutationObserver((m) =>
          m.forEach((x) =>
            x.addedNodes.forEach((n) => {
              if (n.nodeType === 1) {
                if (n.matches && n.matches(sel)) aplica({ querySelectorAll: () => [n] });
                aplica(n);
              }
            }),
          ),
        ).observe(document.body, { childList: true, subtree: true });
      })();
    </script>
